<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EconomyGame — MVP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --ink: #12181f;
  --ink-soft: #1a2430;
  --panel: #e9e2cf;
  --panel-line: #c7bb9c;
  --panel-dim: #d9cfb4;
  --brass: #c79a3a;
  --brass-dim: #8a6f2b;
  --forest: #2f6a52;
  --brick: #a1483a;
  --text-light: #efe9d8;
  --text-dim: #a9a08a;
  --text-dark: #201c14;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Fraunces', serif;
  --sans: 'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text-light);font-family:var(--sans);}
body{font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--sans);cursor:pointer;}
::selection{background:var(--brass);color:var(--text-dark);}

#app{display:flex;flex-direction:column;min-height:100vh;}

.setup-screen{max-width:760px;margin:0 auto;padding:60px 24px;}
.setup-title{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:-0.01em;color:var(--brass);margin:0 0 4px;}
.setup-sub{font-family:var(--mono);color:var(--text-dim);font-size:13px;margin-bottom:32px;letter-spacing:0.04em;text-transform:uppercase;}
.setup-card{background:var(--panel);color:var(--text-dark);border-radius:2px;padding:28px;margin-bottom:20px;position:relative;}
.setup-card h3{font-family:var(--serif);margin:0 0 10px;font-size:20px;}
.setup-card p{margin:0;line-height:1.55;color:#4a4331;}
.edge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;}
.edge-card{border:1px solid var(--panel-line);padding:16px;border-radius:2px;cursor:pointer;transition:all .15s ease;background:#f2ecdc;}
.edge-card:hover{border-color:var(--brass);transform:translateY(-2px);}
.edge-card.selected{border-color:var(--brass);background:#f7edd2;box-shadow:0 0 0 2px var(--brass);}
.edge-card h4{margin:0 0 6px;font-family:var(--serif);font-size:16px;}
.edge-card .build-tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass-dim);}
.edge-card p{font-size:12.5px;color:#544c38;margin-top:8px;}
.big-btn{background:var(--brass);color:var(--text-dark);border:none;padding:14px 26px;font-family:var(--serif);font-weight:600;font-size:16px;border-radius:2px;letter-spacing:.02em;}
.big-btn:disabled{opacity:.4;cursor:not-allowed;}
.big-btn:hover:not(:disabled){background:#d6ab48;}

/* ---- Top status ledger bar ---- */
.status-bar{display:flex;align-items:stretch;background:var(--ink-soft);border-bottom:2px solid var(--brass-dim);padding:0 18px;position:sticky;top:0;z-index:20;}
.status-item{padding:12px 18px;border-right:1px solid #2a3644;font-family:var(--mono);}
.status-item:last-child{border-right:none;}
.status-label{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px;}
.status-value{font-size:16px;font-weight:600;color:var(--text-light);}
.status-value.money{color:var(--brass);}
.status-value.debt{color:var(--brick);}
.status-value.good{color:#7fbf9e;}
.turn-badge{margin-left:auto;display:flex;align-items:center;font-family:var(--serif);font-size:18px;color:var(--brass);padding:0 10px;}

/* ---- Layout ---- */
.game-layout{display:grid;grid-template-columns:260px 1fr 320px;gap:0;flex:1;min-height:0;}
.panel{padding:16px;overflow-y:auto;}
.panel-left{background:var(--ink-soft);border-right:1px solid #263243;}
.panel-center{background:var(--ink);}
.panel-right{background:var(--ink-soft);border-left:1px solid #263243;}
.panel h2{font-family:var(--serif);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin:0 0 12px;border-bottom:1px solid #2a3644;padding-bottom:8px;}

.asset-row{background:#20293480;border:1px solid #2a3644;border-radius:2px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.asset-row .name{font-weight:600;color:var(--text-light);margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.asset-row .meta{color:var(--text-dim);font-family:var(--mono);font-size:11px;}
.change-indicator{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;}
.change-indicator.up{color:#7fbf9e;background:#2f6a5226;}
.change-indicator.down{color:#e29a8f;background:#a1483a26;}
.qty-input{width:64px;padding:6px;font-family:var(--mono);font-size:12px;border:1px solid var(--panel-line);border-radius:2px;background:#fff;color:var(--text-dark);}
.loan-detail{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);line-height:1.6;margin-top:4px;}
.improve-cost-line{font-family:var(--mono);font-size:12px;color:var(--brass);margin-bottom:8px;}
.save-tag{color:#7fbf9e;font-family:var(--mono);font-size:10.5px;}
.synergy-tag{display:inline-block;background:#2f6a5233;color:#8fd6b3;border:1px solid #2f6a5266;font-size:10px;padding:1px 6px;border-radius:8px;margin-top:5px;margin-right:4px;font-family:var(--mono);}
.level-badge{display:inline-block;background:var(--brass);color:var(--text-dark);font-size:10px;padding:1px 7px;border-radius:8px;font-family:var(--mono);font-weight:700;letter-spacing:.03em;}
.level-up-card{border:2px solid var(--brass);background:#f4ecd6;}
.risk-tag{display:inline-block;background:#a1483a26;color:#e29a8f;border:1px solid #a1483a55;font-size:10px;padding:1px 6px;border-radius:8px;margin-top:5px;margin-right:4px;font-family:var(--mono);}
.rel-state-stable{color:#7fbf9e;}
.rel-state-strained{color:#e0c265;}
.rel-state-at_risk{color:#e29a8f;}

.log-entry{border-left:2px solid var(--brass-dim);padding:8px 12px;margin-bottom:10px;background:#171f27;font-size:13px;line-height:1.5;}
.log-entry.event{border-left-color:var(--brick);}
.log-entry.milestone{border-left-color:var(--brass);background:#2a2312;}

.opp-card{background:var(--panel);color:var(--text-dark);border-radius:2px;padding:14px 16px;margin-bottom:12px;}
.opp-card .opp-head{display:flex;justify-content:space-between;align-items:baseline;}
.opp-card h3{font-family:var(--serif);font-size:16px;margin:0;}
.opp-card .exp{font-family:var(--mono);font-size:10.5px;color:var(--brick);text-transform:uppercase;}
.opp-card .facts{font-family:var(--mono);font-size:12px;color:#4a4331;margin:8px 0;line-height:1.6;}
.opp-card .blurb{font-size:12.5px;color:#5a5341;font-style:italic;margin-bottom:10px;}
.opp-actions{display:flex;gap:8px;flex-wrap:wrap;}
.mini-btn{background:transparent;border:1px solid var(--text-dark);color:var(--text-dark);padding:6px 12px;font-size:12px;border-radius:2px;font-family:var(--mono);}
.mini-btn:hover{background:var(--text-dark);color:var(--panel);}
.mini-btn.primary{background:var(--brick);border-color:var(--brick);color:#fff;}
.mini-btn.primary:hover{background:#8a3a2f;}
.mini-btn:disabled{opacity:.35;cursor:not-allowed;}
.buy-now-btn{border-color:var(--brass-dim);color:#6b5a20;}
.buy-now-btn:hover{background:var(--brass);border-color:var(--brass);color:var(--text-dark);}
.buy-now-note{font-family:var(--mono);font-size:10px;color:#8a7d5e;margin-top:6px;font-style:italic;}

.urgent-card{background:#3a2420;border:1px solid var(--brick);border-radius:2px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
.urgent-card .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:#e29a8f;letter-spacing:.05em;}

.ap-bar{display:flex;align-items:center;gap:10px;background:var(--ink-soft);border-top:2px solid var(--brass-dim);padding:12px 18px;}
.ap-dot{width:14px;height:14px;border-radius:50%;background:#2a3644;border:1px solid var(--brass-dim);}
.ap-dot.filled{background:var(--brass);}
.advance-btn{margin-left:auto;background:var(--brass);color:var(--text-dark);border:none;padding:10px 22px;font-family:var(--serif);font-weight:600;font-size:14px;border-radius:2px;}
.advance-btn:hover{background:#d6ab48;}
.hold-btn{background:transparent;border:1px solid var(--text-dim);color:var(--text-dim);padding:10px 16px;border-radius:2px;font-family:var(--mono);font-size:12px;}

/* graph */
.graph-wrap{background:#0d1319;border:1px solid #263243;border-radius:2px;padding:10px;margin-bottom:16px;}
.overlay-toggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.overlay-toggle{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #2a3644;background:transparent;color:var(--text-dim);}
.overlay-toggle.active{background:var(--brass);color:var(--text-dark);border-color:var(--brass);}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,18,.75);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--panel);color:var(--text-dark);width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;border-radius:3px;padding:24px;}
.modal h2{font-family:var(--serif);margin:0 0 4px;font-size:20px;}
.modal .sub{font-family:var(--mono);font-size:11px;color:#6b6248;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;}
.chat-log{max-height:260px;overflow-y:auto;background:#f2ecdc;border:1px solid var(--panel-line);border-radius:2px;padding:10px;margin-bottom:12px;}
.intel-box{background:#eef3ea;border:1px solid var(--forest);border-radius:2px;padding:10px 14px;margin-bottom:14px;}
.intel-box.locked{background:#f2ede2;border:1px dashed var(--brass-dim);}
.intel-title{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--forest);margin-bottom:6px;font-weight:600;}
.intel-box.locked .intel-title{color:var(--brass-dim);}
.intel-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55;color:#33402f;}
.intel-list li{margin-bottom:5px;}
.intel-locked-text{margin:0;font-size:12.5px;color:#6b6248;font-style:italic;}
.chat-msg{margin-bottom:10px;font-size:13px;line-height:1.5;}
.chat-msg .who{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass-dim);display:block;margin-bottom:2px;}
.chat-msg.player{text-align:right;}
.chat-msg.player .who{color:var(--forest);}
.offer-box{background:#e3dcc2;border:1px dashed var(--brass-dim);padding:8px 10px;font-family:var(--mono);font-size:11.5px;border-radius:2px;margin-top:6px;}
.close-deal-box{background:#e8f2ec;border:1px solid var(--forest);border-radius:2px;padding:12px 14px;margin-bottom:12px;}
.close-deal-label{font-family:var(--serif);font-weight:600;font-size:13.5px;color:#1f5c3d;margin-bottom:6px;}
.close-deal-btn{width:100%;margin-top:8px;background:var(--forest);border-color:var(--forest);color:#fff;padding:10px;font-size:13px;}
.close-deal-btn:hover{background:#255a44;}
.neg-input{width:100%;padding:10px;border:1px solid var(--panel-line);border-radius:2px;font-family:var(--sans);font-size:13px;resize:vertical;min-height:60px;}
.neg-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.rounds-left{font-family:var(--mono);font-size:11px;color:#6b6248;}
.result-banner{padding:12px 14px;border-radius:2px;font-family:var(--serif);font-weight:600;margin-bottom:12px;}
.result-banner.accepted{background:#dcefe2;color:#1f5c3d;border:1px solid #2f6a52;}
.result-banner.rejected{background:#f2ded9;color:#7a3327;border:1px solid #a1483a;}
.debrief ul{margin:6px 0 12px 18px;padding:0;font-size:13px;}

.report-screen{max-width:820px;margin:40px auto;padding:0 24px;}
.report-card{background:var(--panel);color:var(--text-dark);border-radius:2px;padding:32px;}
.report-card h1{font-family:var(--serif);font-size:32px;margin:0 0 4px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0;}
.stat-box{background:#f2ecdc;border:1px solid var(--panel-line);padding:12px;border-radius:2px;}
.stat-box .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:#6b6248;}
.stat-box .val{font-family:var(--serif);font-size:22px;font-weight:600;}

.stamp{display:inline-block;border:3px solid var(--brick);color:var(--brick);font-family:var(--serif);font-weight:700;font-size:14px;padding:6px 14px;transform:rotate(-4deg);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;}

.empty-hint{color:var(--text-dim);font-size:12.5px;font-style:italic;padding:8px 0;}

@media (max-width: 980px){
  .game-layout{grid-template-columns:1fr;}
  .panel-left,.panel-right{max-height:260px;}
  .edge-grid{grid-template-columns:1fr;}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
// ============ CONTENT DATA ============

const BUSINESS_TEMPLATES = [

  { id:'landscaping', name:'Landscaping Company', industry:'field_services',

    blurb:'Marketing efficiency, inventory risk, scalable distribution.' },
  { id:'software_company', name:'Small Software Company', industry:'technology',
    inputTags:['hosting','development'], outputTags:['recurring_software_revenue'], capabilityTags:['low_marginal_cost'],
    priceRange:[150000,320000], revRange:[20000,45000], marginRange:[0.35,0.55],

    blurb:'Recurring revenue, high customer concentration, low marginal cost.' },

// Authored synergy chains (tag-based, per design doc table 18)
const SYNERGY_CHAINS = [
  { id:'farm_to_restaurant', anchor:'restaurant', partnerName:'Vegetable Farm', partnerTag:'vegetables',
    costLine:'operatingCosts', costReduction:0.20, addedRiskLabel:'weather / spoilage / logistics risk', addedCostPerTurn:2500 },

  { id:'retail_strip', name:'Retail Strip Unit', priceRange:[180000,300000], downPct:0.22,
    rentRange:[3000,4600], opexPct:0.30, vacancyRisk:0.15, blurb:'Storefront unit, tenant turnover risk.' },
  { id:'multifamily6', name:'6-Unit Multifamily', priceRange:[420000,650000], downPct:0.25,
    rentRange:[7800,11500], opexPct:0.34, vacancyRisk:0.10, blurb:'Larger residential asset, steadier diversified rent roll.' },
];

const SECURITIES = [
  { ticker:'TCH', name:'Technology Fund', sector:'technology', basePrice:100, volatility:0.09 },
  { ticker:'CNS', name:'Consumer Fund', sector:'consumer', basePrice:100, volatility:0.05 },
  { ticker:'NRG', name:'Energy Fund', sector:'energy', basePrice:100, volatility:0.08 },
  { ticker:'BNK', name:'Banking Fund', sector:'finance', basePrice:100, volatility:0.06 },
  { ticker:'HLT', name:'Healthcare Fund', sector:'healthcare', basePrice:100, volatility:0.04 },
  { ticker:'SCP', name:'Small-Cap Fund', sector:'small_cap', basePrice:100, volatility:0.12 },

  { ticker:'BRD', name:'Broad-Market Fund', sector:'broad', basePrice:100, volatility:0.045 },

const NEGOTIATOR_ARCHETYPES = [
  { id:'desperate_seller', name:'Desperate Seller', urgency:0.8, trust:0.4, riskTolerance:0.3, concessionStyle:'fast',
    respondsTo:['fast closing','credible funding','simple terms'], flavor:'anxious to close quickly',
    tips:[
      "They need this done fast — a quick, certain closing timeline will move them more than squeezing the price.",

  { id:'proud_founder', name:'Proud Founder', urgency:0.35, trust:0.5, riskTolerance:0.25, concessionStyle:'slow',

  { id:'skeptical_buyer', name:'Skeptical Buyer', urgency:0.3, trust:0.35, riskTolerance:0.2, concessionStyle:'slow',

  { id:'meticulous_investor', name:'Meticulous Investor', urgency:0.25, trust:0.45, riskTolerance:0.35, concessionStyle:'slow',
    respondsTo:['data','milestones','governance'], flavor:'analytical, wants transparent assumptions',
    tips:[
      "They think in data and milestones — structure your offer around clear, verifiable terms, not one lump number.",

  { id:'aggressive_banker', name:'Aggressive Banker', urgency:0.4, trust:0.5, riskTolerance:0.15, concessionStyle:'medium',
    respondsTo:['collateral','coverage','covenants'], flavor:'direct, low tolerance for ambiguity',
    tips:[
      "They're direct — soft or overly diplomatic language reads as evasive. Get to the point.",
      "Collateral and coverage matter more to them than relationship-building small talk.",
      "They respect firmness. Conceding too quickly signals weakness and invites them to push harder." ] },
  { id:'relationship_owner', name:'Relationship-Oriented Owner', urgency:0.3, trust:0.6, riskTolerance:0.3, concessionStyle:'medium',
    respondsTo:['reliability','fair dealing','long-term commitment'], flavor:'values trust over isolated economics',
    tips:[
      "They value the relationship itself — reliability lands harder with them than an aggressive first offer.",

  { id:'corporate_client', name:'Corporate Client', urgency:0.25, trust:0.3, riskTolerance:0.2, concessionStyle:'slow',

      "They don't respond to rapport — lead with clean numbers and a credible delivery plan.",

// ============ GAME ENGINE ============

function rnd(min, max){ return min + Math.random()*(max-min); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function fmt(n){
  const neg = n < 0;
  n = Math.abs(Math.round(n));
  const s = '$' + n.toLocaleString('en-US');
  return neg ? '-'+s : s;
}
function fmtPct(n){ return (n*100).toFixed(0)+'%'; }
function uid(){ return Math.random().toString(36).slice(2,10); }

function computeLoanTerms(amount, rate, term=10){
  const principalPerTurn = amount/term;
  const paymentPerTurn = principalPerTurn + amount*rate;
  return { principalPerTurn, paymentPerTurn, totalReturn: paymentPerTurn*term, term };
}

function changeIndicatorHTML(current, baseline){
  if(baseline==null || baseline===0 || !isFinite(current)) return '';
  const pct = (current-baseline)/baseline;
  const up = pct>=0;
  const arrow = up ? '▲' : '▼';
  return `<span class="change-indicator ${up?'up':'down'}">${arrow} ${Math.abs(pct*100).toFixed(1)}%</span>`;
}

// ---- Game modes ----
// Simulator: original, realistic numbers — a training/simulator experience where growth is hard-won.
// Arcade: cheap early, generous revenue/costs, faster progress — balanced by more frequent negotiation-forcing trouble.
const GAME_MODES = {
  simulator: { label:'Simulator', priceMult:1, revenueMult:1, costMult:1, downPctMult:1, rateAdj:0,
    valuationMult:1, eventFreqMult:1, urgentFreqMult:1, tierScaleOn:false },

};
function modeCfg(s){ return GAME_MODES[s.mode] || GAME_MODES.simulator; }

// Capital-tier scale: opportunities grow in size as the player's capital grows, so early turns are
// affordable and late turns can plausibly reach the $10M target. Only active in Arcade mode —
// Simulator keeps the original static template ranges for realism.
function tierScale(s){
  const cfg = modeCfg(s);
  if(!cfg.tierScaleOn) return 1;
  const capital = Math.max(netWorth(s), s.cash, 1000);
  return clamp(capital/70000, 0.3, 60);
}

function newRunState(){
  const marketState = {
    interestRates: 'stable', creditAvailability: 'normal', consumerDemand: 'stable',
    businessConfidence: 'neutral', inflation: 'moderate',
    sectorMomentum: {}
  };
  BUSINESS_TEMPLATES.forEach(t=> marketState.sectorMomentum[t.industry] = pick(['positive','neutral','negative']));

  return {
    seed: Math.floor(Math.random()*1e9),
    mode: 'simulator',
    turn: 1,
    maxTurns: 30,
    cash: 25000,
    reputation: 12,
    actionPoints: 2,
    marketState,
    portfolio: { businesses: [], realEstate: [], securities: [] },
    loans: [],
    strategicEdges: [],
    edgeChoicesPending: null,
    opportunities: [],
    urgentProblems: [],
    turnHistory: [],
    log: [],
    negotiation: null,
    milestoneStage: 'survival',
    milestonesHit: [],
    contracts: [],
    gameOver: null,
    lastAdvanceReport: null,
  };
}

function netWorth(s){
  const bizVal = s.portfolio.businesses.reduce((a,b)=>a+b.valuation,0);
  const reVal = s.portfolio.realEstate.reduce((a,b)=>a+b.valuation,0);
  const secVal = s.portfolio.securities.reduce((a,b)=>a+b.shares*b.price,0);
  const debt = s.loans.reduce((a,l)=>a+l.principal,0);
  return s.cash + bizVal + reVal + secVal - debt;
}

function liquidityRatio(s){
  const mandatory = mandatoryPaymentsThisTurn(s) || 1;
  const liquid = s.cash + s.portfolio.securities.reduce((a,b)=>a+b.shares*b.price,0);
  return liquid / mandatory;
}

function mandatoryPaymentsThisTurn(s){
  return s.loans.reduce((a,l)=>a+l.paymentPerTurn,0);
}

function hasEdge(s, id){ return s.strategicEdges.includes(id); }

// ---- Synergy detection & application ----
function computeSynergies(s){
  const active = [];
  SYNERGY_CHAINS.forEach(chain=>{
    const anchors = s.portfolio.businesses.filter(b=>b.templateId===chain.anchor);
    const hasPartner = s.portfolio.businesses.some(b=> b.inputTags.includes(chain.partnerTag) === false && b.outputTags && b.outputTags.includes(chain.partnerTag));
    // Partner represented as a business whose output tag matches the anchor's needed input tag
    anchors.forEach(anchor=>{
      const partner = s.portfolio.businesses.find(b => b.id!==anchor.id && b.outputTags && b.outputTags.includes(chain.partnerTag));
      if(partner){
        active.push({ chainId:chain.id, anchorId:anchor.id, partnerId:partner.id,
          label:`${chain.partnerName} → ${anchor.name}`, costReduction:chain.costReduction,
          addedRiskLabel:chain.addedRiskLabel, addedCostPerTurn:chain.addedCostPerTurn });
      }
    });
  });
  return active;
}

// ---- Turn cash-flow resolution ----
function resolveCashFlow(s){
  const synergies = computeSynergies(s);
  s.portfolio.businesses.forEach(b=> b.activeSynergies = synergies.filter(y=>y.anchorId===b.id));

  let revenueTotal=0, costTotal=0, notes=[];

  s.portfolio.businesses.forEach(b=>{
    let rev = b.revenuePerTurn;
    let cost = b.operatingCosts;
    b.activeSynergies.forEach(syn=>{
      const bonus = hasEdge(s,'supply_chain_builder') && !b._firstSynergyBonusUsed ? syn.costReduction*1.05 : syn.costReduction;
      cost *= (1-bonus);
      cost += syn.addedCostPerTurn;
      b._firstSynergyBonusUsed = true;
    });
    if(hasEdge(s,'roll_up_strategy')){
      const sameIndustry = s.portfolio.businesses.filter(x=>x.industry===b.industry).length;
      if(sameIndustry>1) cost *= 0.95;
    }
    revenueTotal += rev; costTotal += cost;
    b._lastRevenue = rev; b._lastCost = cost;
  });

  let reRevenue=0, reCost=0;
  s.portfolio.realEstate.forEach(r=>{
    reRevenue += r.rentPerTurn * (1-r.vacancyRisk*0.4);
    reCost += r.operatingExpenses;
  });

  const debtService = mandatoryPaymentsThisTurn(s);
  const netCashFlow = revenueTotal + reRevenue - costTotal - reCost - debtService;
  s.cash += netCashFlow;

  s.loans.forEach(l=>{ l.turnsRemaining -= 1; l.principal = Math.max(0, l.principal - l.principalPerTurn); });
  s.loans = s.loans.filter(l=> l.turnsRemaining>0 && l.principal>0);

  return { revenueTotal: revenueTotal+reRevenue, costTotal: costTotal+reCost, debtService, netCashFlow, notes };
}

// ---- Market update ----
function resolveMarketUpdate(s){
  const drift = (val, states)=>{
    const idx = states.indexOf(val);
    const r = Math.random();
    if(r<0.2 && idx>0) return states[idx-1];
    if(r>0.8 && idx<states.length-1) return states[idx+1];
    return val;
  };
  s.marketState.interestRates = drift(s.marketState.interestRates, ['falling','stable','rising','restrictive']);
  s.marketState.creditAvailability = drift(s.marketState.creditAvailability, ['loose','normal','selective','frozen']);
  s.marketState.consumerDemand = drift(s.marketState.consumerDemand, ['weak','stable','strong']);
  s.marketState.businessConfidence = drift(s.marketState.businessConfidence, ['contraction','neutral','expansion']);
  s.marketState.inflation = drift(s.marketState.inflation, ['low','moderate','high']);
  Object.keys(s.marketState.sectorMomentum).forEach(k=>{
    s.marketState.sectorMomentum[k] = drift(s.marketState.sectorMomentum[k], ['negative','neutral','positive']);
  });

  // security price movement
  s.portfolio.securities.forEach(sec=>{
    const tmpl = SECURITIES.find(x=>x.ticker===sec.ticker);
    const momentum = s.marketState.sectorMomentum[tmpl.sector] || 'neutral';
    const drift2 = momentum==='positive'?0.02:momentum==='negative'?-0.02:0;
    sec.price = Math.max(5, sec.price * (1 + drift2 + rnd(-tmpl.volatility, tmpl.volatility)));
  });
}

function currentSecurityPrice(ticker, s){
  let sec = s.portfolio.securities.find(x=>x.ticker===ticker);
  if(sec) return sec.price;
  const tmpl = SECURITIES.find(x=>x.ticker===ticker);
  return s._secPrices?.[ticker] ?? tmpl.basePrice;
}

function initSecurityPrices(s){
  s._secPrices = {};
  SECURITIES.forEach(t=> s._secPrices[t.ticker] = t.basePrice);
}

// ---- Opportunity generation ----
function maxOwnedLevel(s){
  if(!s.portfolio.businesses.length) return 1;
  return Math.max(...s.portfolio.businesses.map(b=>b.level||1));
}

// Once the player owns a Level 2+ business, bigger acquisition targets start appearing at that
// scale too — more expensive, and negotiated with tougher, less personal counterparties.
function pickBusinessLevel(s){
  const maxLvl = maxOwnedLevel(s);
  const r = Math.random();
  if(maxLvl>=3){ if(r<0.4) return 1; if(r<0.75) return 2; return 3; }
  if(maxLvl>=2){ if(r<0.6) return 1; return 2; }
  return 1;
}

const LEVEL_ARCHETYPE_POOLS = {
  1: ['desperate_seller','proud_founder','proud_founder','relationship_owner'],
  2: ['skeptical_buyer','meticulous_investor','relationship_owner'],
  3: ['meticulous_investor','aggressive_banker','corporate_seller','corporate_seller'],
};
const LEVEL_RESERVATION_PCT = { 1:[0.72,0.9], 2:[0.8,0.93], 3:[0.85,0.96] };
const LEVEL_REDLINE_PCT = { 1:[0.55,0.68], 2:[0.65,0.78], 3:[0.75,0.85] };
const LEVEL_PRICE_MULT = { 1:1, 2:2.3, 3:5.0 };
const LEVEL_REVENUE_MULT = { 1:1, 2:2.1, 3:4.6 };
const LEVEL_TAG = { 1:'', 2:' — Regional Operation', 3:' — Corporate Division' };
const LEVEL_BLURB_SUFFIX = { 1:'', 2:' A larger, more established operation than a typical first deal.',
  3:' An institutional seller — expect a data-driven, less personal negotiation.' };

function generateOpportunities(s){
  const opps = [];
  const tierCap = netWorth(s);
  const n = 3 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const roll = Math.random();
    if(roll < 0.5){
      opps.push(makeBusinessOpportunity(s, tierCap));
    } else if(roll < 0.7){
      opps.push(makeRealEstateOpportunity(s, tierCap));
    } else if(roll < 0.9){
      opps.push(makeSecurityOpportunity(s));
    } else {
      opps.push(makeFinancingOpportunity(s));
    }
  }
  return opps.filter(Boolean).concat(generateLevelUpOpportunities(s));
}

function makeBusinessOpportunity(s, tierCap){
  const cfg = modeCfg(s);
  const scale = tierScale(s);
  const level = pickBusinessLevel(s);
  const tmpl = pick(BUSINESS_TEMPLATES);
  const priceScale = scale * cfg.priceMult * (cfg.tierScaleOn ? rnd(0.75, 1.3) : 1) * LEVEL_PRICE_MULT[level];
  const revScale = scale * cfg.revenueMult * (cfg.tierScaleOn ? rnd(0.8, 1.2) : 1) * LEVEL_REVENUE_MULT[level];
  const price = Math.round(rnd(tmpl.priceRange[0], tmpl.priceRange[1]) * priceScale);
  const revenue = Math.round(rnd(tmpl.revRange[0], tmpl.revRange[1]) * revScale);
  const margin = rnd(tmpl.marginRange[0], tmpl.marginRange[1]);
  const cost = Math.round(revenue*(1-margin) * cfg.costMult);
  const concDamp = level===1?1:level===2?0.8:0.5;
  const custConc = rnd(tmpl.custConc[0], tmpl.custConc[1]) * concDamp;
  const depDamp = level===1?1:level===2?0.7:0.4;
  const ownerDep = clamp(tmpl.ownerDep*depDamp, 0.05, 0.95);
  const archetype = pick(NEGOTIATOR_ARCHETYPES.filter(a=>LEVEL_ARCHETYPE_POOLS[level].includes(a.id)));
  const [rMin,rMax] = LEVEL_RESERVATION_PCT[level];
  const [dMin,dMax] = LEVEL_REDLINE_PCT[level];
  return {
    id: uid(), kind:'acquisition', assetType:'business', templateId: tmpl.id, level,
    name: `${tmpl.name} — ${pick(['Riverside','Ashford','Maple Street','Harbor View','Elm Corner','Northgate'])}${LEVEL_TAG[level]}`,
    price, revenue, cost, margin, custConc,
    ownerDep, equipmentCondition: rnd(0.4,0.9),
    industry: tmpl.industry, inputTags: tmpl.inputTags, outputTags: tmpl.outputTags, capabilityTags: tmpl.capabilityTags,
    expiresIn: 1+Math.floor(Math.random()*3),
    counterparty: { archetypeId: archetype.id, role:'seller',
      reservationPrice: Math.round(price*rnd(rMin,rMax)), urgency: clamp(archetype.urgency+rnd(-0.1,0.1),0.1,0.95),
      trust: archetype.trust, riskTolerance: archetype.riskTolerance, concessionStyle: archetype.concessionStyle,
      preferredTerms: archetype.respondsTo, redLine: Math.round(price*rnd(dMin,dMax)),
      hiddenInfo: pick(['the owner has a health issue and wants a fast close','a top customer may not renew next year','there is deferred maintenance not reflected in the asking price','a key employee is considering leaving']) },
    diligenceDone:false,
    blurb: tmpl.blurb + LEVEL_BLURB_SUFFIX[level],
  };
}

// Major upgrade opportunities for a business that's matured (3+ Improvements since its last level).
// These move a business from one Level to the next by shifting its baseline significantly.
// Guaranteed once eligible (not a rare random drop) — this is a milestone reward, not a lottery.
function generateLevelUpOpportunities(s){
  const opps = [];
  s.portfolio.businesses.forEach(b=>{
    if((b.level||1) >= 3) return;
    if((b.improvementsApplied||[]).length < 3) return;
    if(s.opportunities.some(o=>o.assetType==='levelup' && o.businessId===b.id)) return;
    const tmpl = pick(LEVEL_UP_TEMPLATES);
    const basePrice = tmpl.costFrac ? Math.round(b.valuation*tmpl.costFrac) : Math.round(b.valuation*rnd(0.7,1.1));
    let counterparty = null;
    if(tmpl.requiresNegotiation){
      const archetype = NEGOTIATOR_ARCHETYPES.find(a=>a.id===tmpl.counterpartyArchetype);
      counterparty = { archetypeId: archetype.id, role:'seller',
        reservationPrice: Math.round(basePrice*rnd(0.85,0.95)), urgency: archetype.urgency, trust: archetype.trust,
        riskTolerance: archetype.riskTolerance, concessionStyle: archetype.concessionStyle, preferredTerms: archetype.respondsTo,
        redLine: Math.round(basePrice*rnd(0.75,0.85)), hiddenInfo: tmpl.hiddenInfo };

      levelUpTemplate: tmpl, counterparty, diligenceDone:false, expiresIn: 3,
      blurb: tmpl.note });
  });
  return opps;
}

// ---- Urgent relationship problems ----
// Relationship health drifts each turn based on market conditions and the business's own exposure
// (customer concentration). Crisis odds are driven off health + a cooldown after any crisis (resolved
// or not), rather than an independent flat roll every turn — so problems don't pile up back-to-back.
function updateRelationshipHealth(s){
  s.portfolio.businesses.forEach(b=>{
    if(b.clientHealth==null) b.clientHealth = 72;
    if(b.supplierHealth==null) b.supplierHealth = 72;
    if(b.clientCooldown==null) b.clientCooldown = 0;
    if(b.supplierCooldown==null) b.supplierCooldown = 0;

    const demandAdj = s.marketState.consumerDemand==='weak' ? -4 : s.marketState.consumerDemand==='strong' ? 3 : 0;
    const custConcDrag = -(b.custConc*12);
    b.clientHealth = clamp(b.clientHealth + demandAdj + custConcDrag + rnd(-2,3), 0, 100);

    const inflationAdj = s.marketState.inflation==='high' ? -4 : s.marketState.inflation==='low' ? 2 : -1;
    const confAdj = s.marketState.businessConfidence==='contraction' ? -3 : s.marketState.businessConfidence==='expansion' ? 2 : 0;
    b.supplierHealth = clamp(b.supplierHealth + inflationAdj + confAdj + rnd(-2,3), 0, 100);

    if(b.clientCooldown>0) b.clientCooldown -= 1;
    if(b.supplierCooldown>0) b.supplierCooldown -= 1;
  });
}

function generateUrgentProblems(s){
  const cfg = modeCfg(s);
  const problems = [];
  s.portfolio.businesses.forEach(b=>{
    if(!b.clientState) b.clientState = 'stable';
    if(!b.supplierState) b.supplierState = 'stable';
    const careMult = b.crisisMult ?? 1;

    const clientChance = b.clientCooldown>0 ? 0 : clamp((100-b.clientHealth)/100, 0, 1) * 0.35 * cfg.urgentFreqMult * careMult;
    if(Math.random() < clientChance){
      b.clientState = b.clientState==='stable' ? 'strained' : 'at_risk';
      b.clientHealth = clamp(b.clientHealth - 15, 0, 100);
      b.clientCooldown = 2;
      problems.push({ id: uid(), type:'client', businessId:b.id,
        text:`${b.name}: your largest client is ${b.clientState==='at_risk'?'threatening to leave':'pushing back on price/terms'}.`,
        counterparty: { archetypeId: pick(['skeptical_buyer','relationship_owner']), role:'client',
          reservationPrice:null, urgency:0.6, trust:0.4, riskTolerance:0.3, concessionStyle:'medium',
          preferredTerms:['service guarantee','flexible payment'], redLine:null, hiddenInfo:'they received a competing offer' } });
    }

    const supplierChance = b.supplierCooldown>0 ? 0 : clamp((100-b.supplierHealth)/100, 0, 1) * 0.3 * cfg.urgentFreqMult * careMult;
    if(Math.random() < supplierChance){
      b.supplierState = b.supplierState==='stable' ? 'strained' : 'at_risk';
      b.supplierHealth = clamp(b.supplierHealth - 15, 0, 100);
      b.supplierCooldown = 2;
      problems.push({ id: uid(), type:'supplier', businessId:b.id,
        text:`${b.name}: a critical supplier wants a price increase or new terms.`,
        counterparty: { archetypeId: pick(['aggressive_banker','proud_founder']), role:'supplier',
          reservationPrice:null, urgency:0.5, trust:0.45, riskTolerance:0.25, concessionStyle:'slow',
          preferredTerms:['volume commitment','faster payment'], redLine:null, hiddenInfo:'their own input costs rose' } });
    }
  });
  s.loans.forEach(l=>{
    if(l.type==='business' && Math.random()<0.05*cfg.urgentFreqMult){
      problems.push({ id: uid(), type:'lender', loanId:l.id,
        text:`Your lender has flagged coverage concerns on a business loan.`,
        counterparty: { archetypeId:'aggressive_banker', role:'lender', reservationPrice:null, urgency:0.5,
          trust:0.4, riskTolerance:0.15, concessionStyle:'medium', preferredTerms:['collateral','covenants'], redLine:null,
          hiddenInfo:'they are under internal pressure to reduce risk exposure' } });
    }
  });
  return problems;
}

// ---- Market events ----
function maybeTriggerMarketEvent(s){
  const cfg = modeCfg(s);
  if(Math.random() > 0.35*cfg.eventFreqMult || s.portfolio.businesses.length===0) return null;
  const ev = pick(MARKET_EVENTS);
  const biz = s.portfolio.businesses.length ? pick(s.portfolio.businesses) : null;
  const result = ev.apply(biz || {});
  if(result.cashHit) s.cash -= result.cashHit;
  if(result.revenueMult && biz) biz.revenuePerTurn *= result.revenueMult;
  if(result.costMult && biz) biz.operatingCosts *= result.costMult;
  if(result.reputationBonus) s.reputation += result.reputationBonus;
  return { label: ev.label, note: result.note, exposes: ev.exposes };
}

// ---- Milestone check ----
function checkMilestone(s){
  const nw = netWorth(s);
  const stage = MILESTONE_STAGES.find(m=> nw>=m.min && nw<m.max) || MILESTONE_STAGES[MILESTONE_STAGES.length-1];
  if(stage.id !== s.milestoneStage && !s.milestonesHit.includes(stage.id)){
    s.milestoneStage = stage.id;
    s.milestonesHit.push(stage.id);
    if(stage.id !== 'survival'){
      return stage;
    }
  }
  s.milestoneStage = stage.id;
  return null;
}

// ---- Negotiation utility engine (deterministic, authoritative) ----
function evaluateOfferUtility(offer, counterparty, context){
  const askPrice = context.price;
  const cashAtClosing = offer.cashAtClosing ?? offer.totalPrice ?? 0;
  const totalPrice = offer.totalPrice ?? 0;
  let value = 0;

  if(counterparty.role==='seller' || counterparty.role==='lender'){
    const priceScore = counterparty.reservationPrice ? (totalPrice - counterparty.reservationPrice) / Math.max(1,counterparty.reservationPrice) : 0;
    value += priceScore * 40;
    const closingSpeedScore = { fast:1, standard:0.5, extended:0 }[offer.closingSpeed || 'standard'];
    value += closingSpeedScore * counterparty.urgency * 20;
    const certainty = (cashAtClosing / Math.max(1,totalPrice||1));
    value += certainty * 15;
  } else {
    // client / supplier: value is about price/terms favorable to them, inverse of player concession
    value += (offer.priceAdjustment||0) * -30; // negative adjustment (discount to them) increases their utility
    value += (offer.concessionSize||0) * 25;
  }

  offer.preferredTermsHit = (offer.termsOffered||[]).filter(t=> counterparty.preferredTerms.some(p=>t.toLowerCase().includes(p.split(' ')[0])));
  value += offer.preferredTermsHit.length * 8;
  value += counterparty.trust * 10;
  value -= (1-counterparty.riskTolerance) * (offer.riskToCounterparty||10);

  if(counterparty.redLine && totalPrice && totalPrice < counterparty.redLine){
    value -= 100; // hard violation
  }
  return value;
}

function negotiationDecision(utility, round, maxRounds){
  if(utility >= 18) return 'accept';
  if(utility <= -40) return 'reject';
  if(round >= maxRounds) return utility > -10 ? 'accept' : 'reject';
  return 'counter';
}

function dealQualityScore(offer, counterparty, context){
  let score = 60;
  if(context.price && offer.totalPrice) score += clamp((context.price - offer.totalPrice)/context.price,-0.3,0.3)*60;
  if(offer.closingSpeed==='fast') score += 5;
  if((offer.termsOffered||[]).length>0) score += 5;
  return Math.round(clamp(score,0,100));
}

    supplier: [`Costs are up on our end. We need to revisit pricing or volume commitments.`,

function walkAway(){

async function sendNegotiationMessage(){
  const input = document.getElementById('negInput');
  const text = (input.value||'').trim();
  if(!text || negBusy) return;
  const n = S.negotiation;
  n.messages.push({ who:'player', text });
  negBusy = true;
  renderModal();

  let parsed;
  try{
    parsed = await callNegotiationAI(n, text);
  }catch(e){
    parsed = fallbackExtractOffer(text, n);
  }
  negBusy = false;

  n.round += 1;

  // Only trust an "offer" if the model explicitly flagged it AND the player's own message actually
  // contains a number — guards against the model hallucinating the asking price into the offer
  // schema on a plain question or small talk.
  const mentionsFigure = /\d/.test(text) || /\bpercent\b|%/i.test(text);
  let offer = null;
  let intent = parsed.intent;
  if(intent === 'offer'){
    offer = normalizeOffer(parsed.offer, n);
    if(!offer || !mentionsFigure || (!offer.totalPrice && offer.priceAdjustment==null && offer.concessionSize==null)){
      offer = null;
      intent = 'question';
    }
  }

  let utility = null, decision;
  if(intent==='offer' && offer){
    utility = evaluateOfferUtility(offer, n.counterparty, n.context);
    decision = negotiationDecision(utility, n.round, n.maxRounds);
    n.lastOffer = offer;
  } else if(intent==='accept' && n.lastOffer){
    decision = 'accept';
    offer = n.lastOffer;
  } else if(intent==='walk'){
    decision = 'reject';
  } else {
    decision = 'ongoing'; // just a question / dialogue turn — no offer on the table changes
  }

  let dialogue = parsed.dialogue || fallbackDialogue(decision, n.counterparty);
  let offerSummary = offer ? summarizeOffer(offer) : null;

  if(decision==='accept'){
    // The counterparty is willing — but the player decides when to actually close via the button.
    n.readyToClose = true;
    n.pendingOffer = offer;
    n.messages.push({ who:'counterparty', text: dialogue + " — I'd be glad to close on that whenever you're ready.", offerSummary });
  } else if(decision==='reject'){
    n.readyToClose = false; n.pendingOffer = null;
    const redlineHit = offer && n.counterparty.redLine && offer.totalPrice && offer.totalPrice < n.counterparty.redLine;
    n.messages.push({ who:'counterparty', text: redlineHit ? `${dialogue} That's below what I can accept — no deal.` : `${dialogue} I don't think we can make this work.` });
    n.status = 'rejected';
    n.debriefNote = redlineHit ? 'The offer fell below the counterparty\'s red line and was rejected outright.' : 'The counterparty declined to continue.';
    addLog(`Negotiation with ${NEGOTIATOR_ARCHETYPES.find(a=>a.id===n.counterparty.archetypeId).name} ended without a deal.`);
  } else if(decision==='counter'){
    n.readyToClose = false; n.pendingOffer = null;
    const counter = buildCounterOffer(n, offer);
    n.lastOffer = counter;
    n.messages.push({ who:'counterparty', text: dialogue, offerSummary: summarizeOffer(counter) });
  } else {
    n.messages.push({ who:'counterparty', text: dialogue });
  }

  if(n.round >= n.maxRounds && n.status==='ongoing' && !n.readyToClose){
    // force resolution on next message if still ongoing; nudge player
    n.messages.push({ who:'counterparty', text: '(This is close to my final position — we should wrap this up soon.)' });
  }

  render();
}

function closeDealNow(){
  const n = S.negotiation;
  if(!n || !n.readyToClose || !n.pendingOffer) return;
  n.messages.push({ who:'player', text:'Let\'s close on those terms.' });
  finalizeDeal(n, n.pendingOffer);
  render();
}

function normalizeOffer(raw, n){
  if(!raw) return null;
  const o = {};
  if(raw.totalPrice!=null) o.totalPrice = Number(raw.totalPrice)||0;
  if(raw.cashAtClosing!=null) o.cashAtClosing = Number(raw.cashAtClosing)||0;
  o.closingSpeed = raw.closingSpeed || 'standard';
  o.termsOffered = Array.isArray(raw.termsOffered) ? raw.termsOffered : [];
  if(raw.priceAdjustment!=null) o.priceAdjustment = Number(raw.priceAdjustment)||0;
  if(raw.concessionSize!=null) o.concessionSize = Number(raw.concessionSize)||0;
  o.riskToCounterparty = o.termsOffered.some(t=>/earnout|contingent/i.test(t)) ? 14 : 8;
  if(o.totalPrice && o.cashAtClosing==null) o.cashAtClosing = o.totalPrice;
  return o;
}

function summarizeOffer(o){
  if(o.totalPrice!=null){
    return `Total ${fmt(o.totalPrice)} · Cash at closing ${fmt(o.cashAtClosing||0)} · Closing: ${o.closingSpeed}${o.termsOffered.length? ' · '+o.termsOffered.join(', ') : ''}`;
  }
  if(o.priceAdjustment!=null || o.concessionSize!=null){
    return `Price adjustment ${o.priceAdjustment||0}% · Concession size ${o.concessionSize||0}`;
  }
  return '';
}

function buildCounterOffer(n, playerOffer){
  const c = n.counterparty;
  const factor = c.concessionStyle==='fast' ? 0.55 : c.concessionStyle==='slow' ? 0.25 : 0.4;
  if(n.context.price){
    const anchor = c.reservationPrice || Math.round(n.context.price*0.85);
    const base = playerOffer && playerOffer.totalPrice ? playerOffer.totalPrice : Math.round(n.context.price*0.9);
    const total = Math.round(base + (anchor - base) * (1-factor));
    return { totalPrice: total, cashAtClosing: Math.round(total*0.4), closingSpeed:'standard', termsOffered:[], riskToCounterparty:8 };
  }
  const adj = playerOffer && playerOffer.priceAdjustment!=null ? playerOffer.priceAdjustment : 5;
  return { priceAdjustment: Math.round(adj*0.6), concessionSize: 0, termsOffered:[] };
}

function fallbackDialogue(decision, counterparty){
  if(decision==='accept') return 'Alright, that works for me.';
  if(decision==='reject') return 'I appreciate the offer, but';
  if(decision==='counter') return 'I hear you, but I need something closer to my number.';
  return 'Go on, I\'m listening.';
}

function fallbackExtractOffer(text, n){
  const lower = text.toLowerCase();
  const nums = (text.match(/\$?\d[\d,]{2,}/g)||[]).map(x=>Number(x.replace(/[$,]/g,'')));
  let intent = 'question';
  if(/\baccept\b|\bdeal\b|agreed|sounds good/.test(lower)) intent='accept';
  else if(/walk|no thanks|withdraw|never mind/.test(lower)) intent='walk';
  else if(nums.length) intent='offer';
  const offer = nums.length ? { totalPrice: nums[0], cashAtClosing: nums[1]||Math.round(nums[0]*0.4), closingSpeed:/fast|quick|thirty|30 day/.test(lower)?'fast':'standard', termsOffered: /employee|staff/.test(lower)?['employee retention']:[] } : null;
  return { dialogue:null, intent, offer };
}

function callNegotiationAI(n, playerMessage){
  const c = n.counterparty;
  const archetype = NEGOTIATOR_ARCHETYPES.find(a=>a.id===c.archetypeId);
  const sys = `You are role-playing a counterparty in a business negotiation game.
Role: ${c.role}. Personality: ${archetype.name} (${archetype.flavor}).
${n.context.price ? `Asking/reference price: ${n.context.price}.` : ''}
You privately know (do not state outright unless it becomes relevant): ${c.hiddenInfo}.
You respond to: ${c.preferredTerms.join(', ')}.
Stay in character, be concise (1-3 sentences), never break the fourth wall, never reveal you are an AI.
Conversation so far:
${n.messages.map(m=>`${m.who.toUpperCase()}: ${m.text}`).join('\n')}
PLAYER: ${playerMessage}

Classify the PLAYER's latest message carefully:
- "question": they asked something, made small talk, or said anything that is not a concrete numeric proposal or explicit agreement. This is the default — most messages are this.
- "offer": ONLY if the player explicitly proposed specific numeric terms (a price, a split, a percentage) in this message.
- "accept": ONLY if the player explicitly agreed to accept the specific terms currently on the table.
- "walk": ONLY if the player explicitly said they are ending the negotiation.
Never invent numbers the player did not say. If intent is "question", every field inside "offer" must be null and termsOffered must be [].

Reply with ONLY a raw JSON object (no markdown fences, no extra text) matching exactly:
{"dialogue": "in-character reply, 1-3 sentences", "intent": "question|offer|accept|walk", "offer": {"totalPrice": number|null, "cashAtClosing": number|null, "closingSpeed": "fast|standard|extended", "termsOffered": [string], "priceAdjustment": number|null, "concessionSize": number|null}}`;

  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:400, messages:[{role:'user', content: sys}] })
  }).then(res=>res.json()).then(data=>{
    const text = (data.content||[]).map(b=>b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  });
}

function finalizeDeal(n, offer){
  n.status = 'accepted';
  if(n.kind==='acquisition'){
    const o = n.context.opp;
    finalizeBusinessPurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    n.dealQuality = dealQualityScore(offer, n.counterparty, n.context);
    n.relationshipImpact = 5;
    n.strengths = buildStrengths(n, offer);
    n.missed = buildMissed(n, offer);
    addLog(`Acquired ${o.name} for ${fmt(offer.totalPrice)} (deal quality ${n.dealQuality}/100).`);
  } else if(n.kind==='realestate'){
    const o = n.context.opp;
    finalizeRealEstatePurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    n.dealQuality = dealQualityScore(offer, n.counterparty, n.context);
    n.relationshipImpact = 4;
    n.strengths = buildStrengths(n, offer);
    n.missed = buildMissed(n, offer);
    addLog(`Acquired ${o.name} for ${fmt(offer.totalPrice)} (deal quality ${n.dealQuality}/100).`);
  } else if(n.kind==='relationship'){
    const p = n.context.problem;
    resolveRelationshipDeal(p, offer);
    S.urgentProblems = S.urgentProblems.filter(x=>x.id!==p.id);
    n.dealQuality = 70;
    n.relationshipImpact = 6;
    n.strengths = ['Kept a portfolio relationship from breaking.'];
    n.missed = [];
    addLog(`Resolved relationship issue: ${p.text}`);
  } else if(n.kind==='levelup'){
    const o = n.context.opp;
    const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
    settleAcquisitionFinance(o.price, offer, 'levelup');
    applyLevelUpEffects(b, o.levelUpTemplate);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    n.dealQuality = dealQualityScore(offer, n.counterparty, n.context);
    n.relationshipImpact = 4;
    n.strengths = buildStrengths(n, offer);
    n.missed = buildMissed(n, offer);
    addLog(`${o.levelUpTemplate.name} secured at ${b.name} for ${fmt(offer.totalPrice)} — now Level ${b.level}.`);
  }
  S.contracts.push({ turn:S.turn, kind:n.kind, quality:n.dealQuality });
}

function resolveRelationshipDeal(p, offer){
  if(p.type==='client'){
    const b = S.portfolio.businesses.find(x=>x.id===p.businessId);
    if(b){ b.clientState = 'stable'; b.revenuePerTurn *= 0.97; b.clientHealth = clamp((b.clientHealth??50)+25, 0, 100); b.clientCooldown = 3; }
  } else if(p.type==='supplier'){
    const b = S.portfolio.businesses.find(x=>x.id===p.businessId);
    if(b){ b.supplierState = 'stable'; b.operatingCosts *= 1.03; b.supplierHealth = clamp((b.supplierHealth??50)+25, 0, 100); b.supplierCooldown = 3; }
  } else if(p.type==='lender'){
    const l = S.loans.find(x=>x.id===p.loanId);
    if(l){ l.paymentPerTurn *= 1.02; }
  }
}

function buildStrengths(n, offer){
  const s = [];
  if(offer.closingSpeed==='fast') s.push('Recognized that closing speed mattered to the counterparty.');
  if((offer.termsOffered||[]).length) s.push(`Used non-price terms (${offer.termsOffered.join(', ')}) to close the gap.`);
  if(n.round<=2) s.push('Reached agreement efficiently, in few rounds.');
  if(!s.length) s.push('Reached an accepted deal without violating a red line.');
  return s;
}
function buildMissed(n, offer){
  const m = [];
  if(!(offer.termsOffered||[]).length) m.push('Did not propose any non-price terms (e.g. earn-out, employee retention).');
  if(offer.cashAtClosing === offer.totalPrice) m.push('Paid entirely in cash at closing — no financing structure used.');
  if(n.round>=n.maxRounds-1) m.push('Took most of the available rounds to reach agreement.');
  return m;
}

function shuffleCopy(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function pickEdge(id){ selectedEdge = id; render(); }
function pickMode(m){ selectedMode = m; render(); }

function startRun(){
  setupEdgePool = null;
  S = newRunState();
  S.mode = selectedMode;
  initSecurityPrices(S);
  S.strategicEdges = [selectedEdge];
  S.opportunities = generateOpportunities(S);
  S.urgentProblems = [];
  S.log.unshift({ type:'system', text:`Run started in ${GAME_MODES[S.mode].label} mode. Strategic Edge: ${STRATEGIC_EDGES.find(e=>e.id===selectedEdge).name}.` });
  snapshotTurn(S, {revenueTotal:0,costTotal:0,debtService:0,netCashFlow:0});
  screen = 'playing';
  render();
}

      <select id="improveReTypeSelect" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">

      </select>

    <h2 style="margin-top:20px">Sell an Asset</h2>
    ${(S.portfolio.businesses.length+S.portfolio.realEstate.length)===0 ? '<div class="empty-hint">Nothing to sell yet.</div>' :
      `<select id="sellAssetSelect" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">
        ${S.portfolio.businesses.map(b=>`<option value="biz:${b.id}">${b.name} — sell for ~${fmt(b.valuation)}</option>`).join('')}
        ${S.portfolio.realEstate.map(r=>`<option value="re:${r.id}">${r.name} — sell for ~${fmt(r.valuation)}</option>`).join('')}
      </select>
      <button class="mini-btn primary" ${S.actionPoints<1?'disabled':''} onclick="doSell()">Sell (1 AP)</button>`}

let selImproveBiz = null;
let selImproveType = null;

function onImproveBizChange(bizId){ selImproveBiz = bizId; selImproveType = null; renderRightPanel(); }
function onImproveTypeChange(typeId){ selImproveType = typeId; renderRightPanel(); }

function renderImproveBusinessPanel(){
  const bizId = (selImproveBiz && S.portfolio.businesses.some(x=>x.id===selImproveBiz)) ? selImproveBiz : S.portfolio.businesses[0].id;
  const b = S.portfolio.businesses.find(x=>x.id===bizId);
  const applied = b.improvementsApplied || [];
  const firstAvailable = IMPROVEMENTS.find(i=>!applied.includes(i.id));
  const typeId = (selImproveType && IMPROVEMENTS.some(i=>i.id===selImproveType) && !applied.includes(selImproveType))
    ? selImproveType : (firstAvailable ? firstAvailable.id : IMPROVEMENTS[0].id);
  const imp = IMPROVEMENTS.find(i=>i.id===typeId);
  const cost = Math.round(b.valuation*imp.cost*0.3);
  const allDone = applied.length >= IMPROVEMENTS.length;
  const alreadyApplied = applied.includes(typeId);

  return `
    <select id="improveBizSelect" onchange="onImproveBizChange(this.value)" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">
      ${S.portfolio.businesses.map(x=>`<option value="${x.id}" ${x.id===bizId?'selected':''}>${x.name} — Lv${x.level||1}, ${(x.improvementsApplied||[]).length}/${IMPROVEMENTS.length} applied</option>`).join('')}
    </select>
    <select id="improveTypeSelect" onchange="onImproveTypeChange(this.value)" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">
      ${IMPROVEMENTS.map(i=>`<option value="${i.id}" ${i.id===typeId?'selected':''} ${applied.includes(i.id)?'disabled':''}>${applied.includes(i.id)?'✓ ':''}${i.name}${applied.includes(i.id)?' — already applied':' — '+i.note}</option>`).join('')}
    </select>
    <div class="improve-cost-line">${allDone ? 'All improvements applied at this level.' : alreadyApplied ? 'Already applied — pick another.' : `Cost: ${fmt(cost)}`}</div>
    <button class="mini-btn primary" ${S.actionPoints<1||allDone||alreadyApplied?'disabled':''} onclick="doImprove()">Improve (1 AP + cash)</button>
  `;
}

function renderApBar(){
  const dots = [];
  for(let i=0;i<2;i++) dots.push(`<div class="ap-dot ${i<S.actionPoints?'filled':''}"></div>`);
  document.getElementById('apBar').innerHTML = `
    <div class="ap-bar">

      ${dots.join('')}

      <button class="advance-btn" onclick="advanceTurn()">Advance Turn →</button>
    </div>`;
}

// ---------------- ACTIONS ----------------
function spendAP(n=1){ S.actionPoints = Math.max(0, S.actionPoints - n); }

function doHold(){ addLog('Held position this turn.'); render(); }

function investigate(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || S.actionPoints<1) return;
  spendAP(1);
  o.diligenceDone = true;
  if(o.assetType==='business'){
    o.margin = clamp(o.margin + rnd(-0.02,0.02), 0.05, 0.6);
    addLog(`Diligence on ${o.name}: normalized margin narrows to ${fmtPct(o.margin)}. Hidden note: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  } else if(o.assetType==='realestate'){
    addLog(`Inspection on ${o.name}: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  } else if(o.assetType==='levelup' && o.counterparty){
    addLog(`Diligence on ${o.name}: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  }
  render();
}

function buySecurity(ticker, price, oppId){
  if(S.actionPoints<1) return;
  const input = document.getElementById('qty-'+oppId);
  let qty = input ? parseInt(input.value,10) : 10;
  if(!qty || qty<10) qty = 10;
  qty = Math.round(qty/10)*10;
  const cost = qty*price;
  if(S.cash < cost){ addLog(`Not enough cash to buy ${qty} shares of ${ticker} (need ${fmt(cost)}).`); render(); return; }
  S.cash -= cost;
  spendAP(1);
  let holding = S.portfolio.securities.find(s=>s.ticker===ticker);
  if(holding){
    holding.costBasis = (holding.costBasis*holding.shares + cost) / (holding.shares+qty);
    holding.shares += qty;
  } else {
    S.portfolio.securities.push({ticker, shares:qty, price, costBasis:price});
  }
  addLog(`Bought ${qty} shares of ${ticker} for ${fmt(cost)}.`);
  if(oppId) S.opportunities = S.opportunities.filter(o=>o.id!==oppId);
  render();
}

function sellSecurity(ticker){
  const holding = S.portfolio.securities.find(s=>s.ticker===ticker);
  if(!holding) return;
  const proceeds = holding.shares*holding.price;
  S.cash += proceeds;
  S.portfolio.securities = S.portfolio.securities.filter(s=>s.ticker!==ticker);
  addLog(`Sold ${holding.shares} shares of ${ticker} for ${fmt(proceeds)}.`);
  render();
}

function takeLoan(maxAmount, rate, oppId){
  if(S.actionPoints<1) return;
  spendAP(1);
  S.cash += maxAmount;
  const terms = computeLoanTerms(maxAmount, rate, 10);
  S.loans.push({ id: uid(), label:'Bank Line of Credit', type:'personal', principal:maxAmount, rate,
    principalPerTurn: terms.principalPerTurn, paymentPerTurn: terms.paymentPerTurn, turnsRemaining:10 });
  S.opportunities = S.opportunities.filter(o=>o.id!==oppId);
  addLog(`Drew ${fmt(maxAmount)} line of credit at ${fmtPct(rate)}/turn — ${fmt(terms.paymentPerTurn)}/qtr for 10 quarters, ${fmt(terms.totalReturn)} total.`);
  render();
}

function buyOutright(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || S.actionPoints<1) return;
  spendAP(1);
  const offer = { totalPrice:o.price, cashAtClosing:o.price, closingSpeed:'standard', termsOffered:[], riskToCounterparty:8 };
  if(o.assetType==='business'){
    finalizeBusinessPurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    addLog(`Bought ${o.name} outright at asking price ${fmt(o.price)} — no negotiation.`);
  } else if(o.assetType==='realestate'){
    finalizeRealEstatePurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    addLog(`Bought ${o.name} outright at asking price ${fmt(o.price)} — no negotiation.`);
  } else if(o.assetType==='levelup' && o.requiresNegotiation){
    const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
    if(!b) return;
    settleAcquisitionFinance(o.price, offer, 'levelup');
    applyLevelUpEffects(b, o.levelUpTemplate);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    addLog(`${o.levelUpTemplate.name} secured outright at ${b.name} for ${fmt(o.price)} — now Level ${b.level}.`);
  }
  render();
}

function doImprove(){
  const bizId = document.getElementById('improveBizSelect').value;
  const impId = document.getElementById('improveTypeSelect').value;
  const b = S.portfolio.businesses.find(x=>x.id===bizId);
  const imp = IMPROVEMENTS.find(x=>x.id===impId);
  if(!b || !imp || S.actionPoints<1) return;
  if((b.improvementsApplied||[]).includes(imp.id)){ addLog(`${imp.name} has already been applied at ${b.name} this level.`); render(); return; }
  const cost = Math.round(b.valuation*imp.cost*0.3);
  if(S.cash < cost){ addLog(`Not enough cash to fund ${imp.name} at ${b.name}.`); render(); return; }
  S.cash -= cost;
  spendAP(1);
  if(imp.effect==='revenue') b.revenuePerTurn *= imp.mult;
  if(imp.effect==='ownerDep') b.ownerDependence = clamp(b.ownerDependence*imp.mult,0.05,0.95);
  if(imp.effect==='condition') b.equipmentCondition = clamp(b.equipmentCondition+0.25,0,1);
  if(imp.effect==='costs') b.operatingCosts *= imp.mult;
  if(imp.effect==='churnGuard') b.custConc = clamp(b.custConc*0.9,0.02,0.9);
  if(imp.effect==='care'){
    b.crisisMult = clamp((b.crisisMult??1)*imp.mult, 0.15, 1);
    b.clientHealth = clamp((b.clientHealth??72)+20, 0, 100);
    b.supplierHealth = clamp((b.supplierHealth??72)+20, 0, 100);
  }
  b.valuation = valuateBusiness(b);
  b._improvedThisTurn = true;
  b.improvementsApplied = [...(b.improvementsApplied||[]), imp.id];
  let msg = `${imp.name} at ${b.name}: ${imp.note} (cost ${fmt(cost)})`;

  if(b.improvementsApplied.length >= IMPROVEMENTS.length){
    if((b.level||1) < 3){
      applyLevelUpEffects(b, AUTO_LEVEL_TEMPLATE);
      msg += ` Every improvement has now been applied — ${b.name} has fully matured and automatically advances to Level ${b.level}! Revenue, costs, and value all step up substantially. Improvements reset for the new level.`;
    } else {
      b.revenuePerTurn = Math.round(b.revenuePerTurn * AUTO_LEVEL_TEMPLATE.revenueMult);
      b.operatingCosts = Math.round(b.operatingCosts * AUTO_LEVEL_TEMPLATE.costMult);
      b.valuation = valuateBusiness(b);
      b.improvementsApplied = [];
      msg += ` Every improvement has been applied at ${b.name}'s max level — revenue, costs, and value step up again, and options reset for further fine-tuning.`;
    }
  } else if(b.improvementsApplied.length >= 3 && (b.level||1) < 3){
    msg += ` ${b.name} has matured enough for a major upgrade opportunity — watch for one in Opportunities.`;
  }
  addLog(msg);
  render();
}

function applyLevelUpEffects(b, tmpl){
  b.revenuePerTurn = Math.round(b.revenuePerTurn * (tmpl.revenueMult||1));
  b.operatingCosts = Math.round(b.operatingCosts * (tmpl.costMult||1));
  if(tmpl.ownerDepMult) b.ownerDependence = clamp(b.ownerDependence*tmpl.ownerDepMult, 0.05, 0.95);
  if(tmpl.conditionBoost) b.equipmentCondition = 1;
  if(tmpl.custConcAdd) b.custConc = clamp(b.custConc + tmpl.custConcAdd, 0.02, 0.9);
  b.level = (b.level||1) + 1;
  b.improvementsApplied = [];
  b.levelUpsApplied = b.levelUpsApplied || [];
  b.levelUpsApplied.push(tmpl.id);
  b.valuation = valuateBusiness(b);
}

function doLevelUp(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || o.assetType!=='levelup' || S.actionPoints<1) return;
  const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
  if(!b) return;
  if(S.cash < o.price){ addLog(`Not enough cash to invest in ${o.name}.`); render(); return; }
  S.cash -= o.price;
  spendAP(1);
  applyLevelUpEffects(b, o.levelUpTemplate);
  S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
  addLog(`${o.levelUpTemplate.name} completed at ${b.name} — now Level ${b.level}.`);
  render();
}

function doImproveRealEstate(){
  const reId = document.getElementById('improveReSelect').value;
  const impId = document.getElementById('improveReTypeSelect').value;
  const r = S.portfolio.realEstate.find(x=>x.id===reId);
  const imp = REAL_ESTATE_IMPROVEMENTS.find(x=>x.id===impId);
  if(!r || !imp || S.actionPoints<1) return;
  const cost = Math.round(r.valuation*imp.cost);
  if(S.cash < cost){ addLog(`Not enough cash to fund ${imp.name} at ${r.name}.`); render(); return; }
  S.cash -= cost;
  spendAP(1);
  r.valuation = Math.round(r.valuation * (1+imp.valBoost));
  r.rentPerTurn = Math.round(r.rentPerTurn * (1+imp.rentBoost));
  addLog(`${imp.name} at ${r.name}: ${imp.note} (cost ${fmt(cost)}, value +${fmtPct(imp.valBoost)}, rent +${fmtPct(imp.rentBoost)})`);
  render();
}

function doSell(){
  const sel = document.getElementById('sellAssetSelect').value;
  const [kind, id] = sel.split(':');
  if(S.actionPoints<1) return;
  spendAP(1);
  if(kind==='biz'){
    const b = S.portfolio.businesses.find(x=>x.id===id);
    const price = Math.round(b.valuation*rnd(0.92,1.08));
    S.cash += price;
    S.portfolio.businesses = S.portfolio.businesses.filter(x=>x.id!==id);
    addLog(`Sold ${b.name} for ${fmt(price)}.`);
  } else {
    const r = S.portfolio.realEstate.find(x=>x.id===id);
    const price = Math.round(r.valuation*rnd(0.95,1.05));
    S.cash += price;
    S.portfolio.realEstate = S.portfolio.realEstate.filter(x=>x.id!==id);
    addLog(`Sold ${r.name} for ${fmt(price)}.`);
  }
  render();
}

function valuateBusiness(b){
  const cfg = modeCfg(S);
  const normProfit = b.revenuePerTurn - b.operatingCosts;
  const multiple = 4 - b.ownerDependence*1.2 - b.custConc*1.5 + (1-b.equipmentCondition)*-0.5;
  let val = Math.max(1000, normProfit*4*clamp(multiple/2.5,0.6,1.6));
  if(hasEdge(S,'recurring_revenue_focus') && b.custConc<0.15) val *= 1.08;
  val *= cfg.valuationMult;
  return Math.round(val);
}

function addLog(text, type='normal'){ S.log.unshift({type, text}); }

function revalueAssets(s){
  // Businesses intentionally do NOT re-value automatically — valuation only moves when the
  // player takes an Improve action. This keeps the appreciation signal tied to player decisions.
  s.portfolio.realEstate.forEach(r=>{
    const appreciation = clamp(rnd(0.05, 0.10) - r.vacancyRisk*0.03, 0.03, 0.10);
    r.valuation = Math.round(r.valuation * (1 + appreciation));
    r.rentPerTurn = Math.round(r.rentPerTurn * 1.03);
  });
}

function payoffLoan(loanId){
  const l = S.loans.find(x=>x.id===loanId);
  if(!l) return;
  if(S.cash < l.principal){ addLog(`Not enough cash to pay off ${l.label} (need ${fmt(l.principal)}).`); render(); return; }
  const remainingInterest = Math.max(0, l.paymentPerTurn*l.turnsRemaining - l.principal);
  S.cash -= l.principal;
  S.loans = S.loans.filter(x=>x.id!==loanId);
  addLog(`Paid off ${l.label} early for ${fmt(l.principal)} — saved ${fmt(remainingInterest)} in future interest.`);
  render();
}

// ---------------- SYNERGY/RELATIONSHIP HELPERS ----------------
function finalizeBusinessPurchase(o, offer){
  const b = {
    id: uid(), templateId:o.templateId, name:o.name,
    revenuePerTurn:o.revenue, operatingCosts:o.cost, ownerDependence:o.ownerDep,
    equipmentCondition:o.equipmentCondition, custConc:o.custConc, industry:o.industry,
    inputTags:o.inputTags, outputTags:o.outputTags, capabilityTags:o.capabilityTags,
    clientState:'stable', supplierState:'stable', activeSynergies:[],
    clientHealth:72, supplierHealth:72, clientCooldown:0, supplierCooldown:0, crisisMult:1,
    level: o.level||1, improvementsApplied:[], levelUpsApplied:[],
  };
  b.valuation = valuateBusiness(b);
  if(hasEdge(S,'contrarian') && S.marketState.sectorMomentum[o.industry]==='negative') b.valuation = Math.round(b.valuation*1.10);
  b.baselineValuation = b.valuation;
  S.portfolio.businesses.push(b);
  settleAcquisitionFinance(o.price, offer, 'business');
}

function finalizeRealEstatePurchase(o, offer){
  const r = {
    id: uid(), templateId:o.templateId, name:o.name,
    rentPerTurn:o.rent, operatingExpenses: Math.round(o.rent*o.opexPct), vacancyRisk:o.vacancyRisk,
  };
  r.valuation = Math.round(o.price*rnd(0.98,1.05));
  r.baselineValuation = r.valuation;
  S.portfolio.realEstate.push(r);
  settleAcquisitionFinance(o.price, offer, 'realestate');
}

// Default seller-note rate when a deal closes with an unfinanced gap — deliberately higher than a
// pre-arranged bank line of credit, so securing financing before negotiating is the better play.
function sellerNoteRate(s){
  const cfg = modeCfg(s);
  return clamp(0.12 - (hasEdge(s,'seller_financing_specialist')?0.015:0) + cfg.rateAdj, 0.03, 0.16);
}

function settleAcquisitionFinance(askPrice, offer, kind){
  const cfg = modeCfg(S);
  const totalPrice = offer.totalPrice || askPrice;
  const cashAtClosing = Math.min(S.cash, offer.cashAtClosing ?? totalPrice);
  S.cash -= cashAtClosing;
  const financed = Math.max(0, totalPrice - cashAtClosing);
  if(financed>0){
    const rate = sellerNoteRate(S);
    const terms = computeLoanTerms(financed, rate, 8);
    const label = kind==='levelup' ? 'Expansion Financing' : `Seller Note (${kind})`;
    S.loans.push({ id:uid(), label, type:kind, principal:Math.round(financed),
      rate, principalPerTurn: terms.principalPerTurn, paymentPerTurn: terms.paymentPerTurn, turnsRemaining:8 });
  }
  S.reputation += hasEdge(S,'relationship_capital') ? 3 : 2;
}

// ---------------- TURN ADVANCE ----------------
function advanceTurn(){
  if(S.negotiation){ addLog('Close the current negotiation before advancing.'); render(); return; }
  const cf = resolveCashFlow(S);
  const ev = maybeTriggerMarketEvent(S);
  if(ev) addLog(`Market event — ${ev.label}: ${ev.note}`, 'event');
  addLog(`Turn ${S.turn} closed. Net cash flow ${fmt(cf.netCashFlow)}. Cash now ${fmt(S.cash)}.`);

  // insolvency check
  const availableCredit = S.reputation*1500*(modeCfg(S).tierScaleOn?1.6:1);
  if(S.cash < 0 && Math.abs(S.cash) > availableCredit){
    S.gameOver = { result:'loss', reason:'insolvency' };
    screen='report'; render(); return;
  }

  const milestone = checkMilestone(S);
  if(milestone){
    addLog(`Milestone reached: ${milestone.name}. ${milestone.pressure}`, 'milestone');
    S.edgeChoicesPending = shuffleCopy(STRATEGIC_EDGES.filter(e=>!S.strategicEdges.includes(e.id))).slice(0,3);
  }

  resolveMarketUpdate(S);
  revalueAssets(S);
  S.turn += 1;
  S.actionPoints = 2;

  if(S.turn > S.maxTurns){
    S.gameOver = { result: netWorth(S)>=10000000 ? 'win':'timeout', reason:'turn_limit' };
    screen='report'; render(); return;
  }
  if(netWorth(S) >= 10000000){
    S.gameOver = { result:'win', reason:'target_reached' };
    screen='report'; render(); return;
  }

  // Decrement/filter survivors from the outgoing list first, before generating anything new.
  const survivors = S.opportunities.filter(o=>{ o.expiresIn -= 1; return o.expiresIn>0 && o.assetType!=='security'; });
  const survivingLevelUps = survivors.filter(o=>o.assetType==='levelup');
  const survivingRegular = survivors.filter(o=>o.assetType!=='levelup');

  const freshBatch = generateOpportunities(S);
  const freshLevelUps = freshBatch.filter(o=>o.assetType==='levelup');
  const freshRegular = freshBatch.filter(o=>o.assetType!=='levelup');

  // Survivors get priority over fresh rolls for the capped regular slots, so an opportunity already
  // in progress can't get silently bumped by a brand-new random one. Level-ups are never capped —
  // once eligible, they persist until acted on or truly expired.
  const regularCombined = survivingRegular.concat(freshRegular).slice(0,6);
  S.opportunities = regularCombined.concat(survivingLevelUps).concat(freshLevelUps);

  updateRelationshipHealth(S);
  S.urgentProblems = generateUrgentProblems(S);
  snapshotTurn(S, cf);
  render();
}

function snapshotTurn(s, cf){
  s.turnHistory.push({
    turn:s.turn, cash:s.cash, netWorth:netWorth(s),
    debt:s.loans.reduce((a,l)=>a+l.principal,0),
    revenue:cf.revenueTotal||0, costs:cf.costTotal||0,
  });
}

function renderEdgeChoiceModal(){
  if(!S.edgeChoicesPending) return '';
  return `<div class="modal-backdrop"><div class="modal">
    <h2>New Strategic Edge Available</h2>
    <div class="sub">Choose one to add to your active build</div>
    <div class="edge-grid" style="grid-template-columns:1fr;">
      ${S.edgeChoicesPending.map(e=>`
        <div class="edge-card" onclick="chooseNewEdge('${e.id}')">
          <div class="build-tag">${e.build}</div><h4>${e.name}</h4><p>${e.effect}</p>
        </div>`).join('')}
    </div>
    <button class="mini-btn" style="margin-top:10px" onclick="S.edgeChoicesPending=null; render();">Skip</button>
  </div></div>`;
}
function chooseNewEdge(id){ S.strategicEdges.push(id); S.edgeChoicesPending=null; addLog(`New Strategic Edge acquired: ${STRATEGIC_EDGES.find(e=>e.id===id).name}.`); render(); }

// ---------------- GRAPH ----------------
function drawGraph(){
  const ctx = document.getElementById('graphCanvas');
  if(!ctx) return;
  const hist = S.turnHistory;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels: hist.map(h=>'T'+h.turn),
      datasets:[
        { label:'Net Worth', data:hist.map(h=>h.netWorth), borderColor:'#c79a3a', backgroundColor:'transparent', tension:0.25 },
        { label:'Cash', data:hist.map(h=>h.cash), borderColor:'#7fbf9e', backgroundColor:'transparent', tension:0.25 },
        { label:'Debt', data:hist.map(h=>h.debt), borderColor:'#a1483a', backgroundColor:'transparent', tension:0.25 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'#a9a08a', font:{size:10} } } },
      scales:{
        x:{ ticks:{ color:'#6b7686', font:{size:9} }, grid:{ color:'#1e2833' } },
        y:{ ticks:{ color:'#6b7686', font:{size:9}, callback:(v)=>'$'+(v/1000)+'k' }, grid:{ color:'#1e2833' } },
      }
    }
  });
}

function renderModal(){
  const m = document.getElementById('modalRoot');
  if(S.negotiation){ m.innerHTML = renderNegotiationModal(); }
  else if(S.edgeChoicesPending){ m.innerHTML = renderEdgeChoiceModal(); }
  else { m.innerHTML = ''; }
}
// ============ END-OF-RUN REPORT ============

function renderReport(){
  const nw = netWorth(S);
  const go = S.gameOver;
  const title = go.result==='win' ? 'Target Reached' : go.reason==='insolvency' ? 'Insolvency' : 'Run Complete';
  const dominant = computeDominantStrategy();
  const avgQuality = S.contracts.length ? Math.round(S.contracts.reduce((a,c)=>a+c.quality,0)/S.contracts.length) : null;
  const bestTurn = bestAndWorstTurn();

  root().innerHTML = `
  <div class="report-screen">
    <div class="report-card">
      <span class="stamp">${title}</span>
      <h1 style="margin-top:14px">${fmt(nw)} net worth</h1>
      <p style="color:#544c38;">Turn ${Math.min(S.turn,S.maxTurns)} of ${S.maxTurns} · Reputation ${Math.round(S.reputation)}</p>

      <div class="stat-grid">
        <div class="stat-box"><div class="lbl">Cash</div><div class="val">${fmt(S.cash)}</div></div>
        <div class="stat-box"><div class="lbl">Debt</div><div class="val">${fmt(S.loans.reduce((a,l)=>a+l.principal,0))}</div></div>
        <div class="stat-box"><div class="lbl">Liquidity Ratio</div><div class="val">${liquidityRatio(S).toFixed(2)}x</div></div>
        <div class="stat-box"><div class="lbl">Businesses</div><div class="val">${S.portfolio.businesses.length}</div></div>
        <div class="stat-box"><div class="lbl">Real Estate</div><div class="val">${S.portfolio.realEstate.length}</div></div>
        <div class="stat-box"><div class="lbl">Securities</div><div class="val">${S.portfolio.securities.length}</div></div>
      </div>

      <h3 style="font-family:var(--serif);margin-top:10px;">Dominant Strategy</h3>
      <p>${dominant}</p>

      ${avgQuality!=null ? `<h3 style="font-family:var(--serif);">Negotiation Performance</h3><p>Average deal quality across ${S.contracts.length} negotiated deal(s): <strong>${avgQuality}/100</strong>.</p>` : ''}

      ${bestTurn ? `<h3 style="font-family:var(--serif);">Best Capital-Allocation Moment</h3><p>${bestTurn}</p>` : ''}

      <h3 style="font-family:var(--serif);">Strategic Edges Used</h3>
      <p>${S.strategicEdges.map(id=>STRATEGIC_EDGES.find(e=>e.id===id).name).join(', ') || 'None'}</p>

      <div class="graph-wrap" style="margin-top:20px;"><canvas id="reportGraph" height="200"></canvas></div>

      <button class="big-btn" style="margin-top:20px" onclick="restartGame()">Start a New Run →</button>
    </div>
  </div>`;

  const ctx = document.getElementById('reportGraph');
  new Chart(ctx, {
    type:'line',
    data:{ labels:S.turnHistory.map(h=>'T'+h.turn), datasets:[
      { label:'Net Worth', data:S.turnHistory.map(h=>h.netWorth), borderColor:'#c79a3a', backgroundColor:'transparent' },
      { label:'Cash', data:S.turnHistory.map(h=>h.cash), borderColor:'#2f6a52', backgroundColor:'transparent' },
      { label:'Debt', data:S.turnHistory.map(h=>h.debt), borderColor:'#a1483a', backgroundColor:'transparent' },
    ]},
    options:{ responsive:true, plugins:{legend:{labels:{color:'#544c38'}}},
      scales:{ x:{ticks:{color:'#544c38'}}, y:{ticks:{color:'#544c38', callback:v=>'$'+(v/1000)+'k'}} } }
  });
}

function computeDominantStrategy(){
  const tagCount = {};
  S.portfolio.businesses.forEach(b=>{ tagCount[b.industry] = (tagCount[b.industry]||0)+1; });
  const synergyCount = S.portfolio.businesses.reduce((a,b)=>a+(b.activeSynergies||[]).length,0);
  const reCount = S.portfolio.realEstate.length;
  const secCount = S.portfolio.securities.length;
  if(synergyCount>=2) return 'Vertical/horizontal integrator — you built connected supply chains that lowered costs across multiple businesses.';
  if(reCount > S.portfolio.businesses.length) return 'Real estate-weighted portfolio — you favored leveraged, stable cash-flowing property over operating businesses.';
  if(secCount > S.portfolio.businesses.length + reCount) return 'Liquid-market investor — you leaned on public securities for diversification over illiquid private deals.';
  if(S.loans.reduce((a,l)=>a+l.principal,0) > S.cash*2) return 'Leveraged operator — you financed growth aggressively with seller notes and credit.';
  return 'Balanced operator — a mix of private acquisitions, moderate leverage, and opportunistic deals.';
}

function bestAndWorstTurn(){
  if(S.turnHistory.length<2) return null;
  let best = S.turnHistory[1], bestDelta = -Infinity;
  for(let i=1;i<S.turnHistory.length;i++){
    const delta = S.turnHistory[i].netWorth - S.turnHistory[i-1].netWorth;
    if(delta>bestDelta){ bestDelta = delta; best = S.turnHistory[i]; }
  }
  if(bestDelta<=0) return null;
  return `Turn ${best.turn} produced the largest single-turn net-worth gain: +${fmt(bestDelta)}.`;
}

function restartGame(){
  S = null; screen='setup'; selectedEdge=null; selectedMode=null; setupEdgePool=null; render();
}

document.addEventListener('DOMContentLoaded', function(){ render(); });
</script>
