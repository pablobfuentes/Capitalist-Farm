  const negTitle = isRival ? 'Three-Way Contest — ' + n.context.name : (n.kind==='relationship' ? 'Relationship Negotiation' : 'Negotiation — ' + n.context.name);
  const inputPh = isRival
    ? "Your turn — counter-offer, talk to the seller, or address Rowe directly (e.g. '$108,000 with $40k at closing')"
    : "Type your message or offer, e.g. '$105,000: $30,000 at closing, rest as a seller note over two years.'";
  return `<div class="modal-backdrop"><div class="modal">
    <div class="modal-head-row">
      <div>
        <h2 style="margin:0">${negTitle}</h2>
        <div class="sub" style="margin-bottom:0">${archetype.name} · ${archetype.flavor}${n.context.price? ' · Asking '+fmt(n.context.price):''}${n.stakesLabel? ' · '+n.stakesLabel:''}</div>
      </div>
      ${renderAiStatusPill(n)}
    </div>
    ${n.stakesNote ? `<div class="sub" style="margin-top:8px;font-style:italic;text-transform:none;">${n.stakesNote}</div>` : ''}
    ${isRival ? renderRivalIdentity(n) + renderRivalBidBar(n) + renderContestPackageCompare(n) : renderListingFactsBar(n)}
    ${identity}
    ${renderIntelPanel(n)}
    ${done ? `<div class="result-banner ${n.status==='accepted'?'accepted':'rejected'}">${n.status==='accepted'?'Deal accepted.':'No deal.'}</div>` : ''}
    <div class="chat-log" id="chatLog">
      ${n.messages.map(m=>`
        <div class="chat-msg ${aiMessageClass(m.who)}">
          <span class="who">${aiSpeakerLabel(m.who, npcLabel, n)}</span>
          ${m.text}
          ${m.offerSummary ? `<div class="offer-box">${m.offerSummary}</div>` : ''}
        </div>`).join('')}
      ${negBusy ? (isRival
        ? `<div class="chat-msg counterparty"><span class="who">${npcLabel}</span><em>…considering your message…</em></div>`
          + (n.rivalConceded ? '' : `<div class="chat-msg rival"><span class="who">${rname}</span><em>…considering your message…</em></div>`)
        : `<div class="chat-msg counterparty"><span class="who">${npcLabel}</span><em>…considering…</em></div>`) : ''}
    </div>
    ${done ? renderDebrief(n) : `
      ${n.readyToClose && n.pendingOffer ? `
        <div class="close-deal-box">
          <div class="close-deal-label">They're willing to close on these terms</div>
          <div class="offer-box">${summarizeOffer(n.pendingOffer)}</div>
          <button class="mini-btn close-deal-btn" onclick="closeDealNow()">✅ Close Deal</button>
        </div>` : ''}
      <textarea class="neg-input" id="negInput" placeholder="${inputPh}" ${negBusy?'disabled':''}></textarea>
      <div class="neg-controls">
        <span class="rounds-left">Round ${n.round}/${n.maxRounds}</span>
        <div>
          <button class="mini-btn" onclick="walkAway()" ${negBusy?'disabled':''}>Walk Away</button>
          <button class="mini-btn primary" onclick="sendNegotiationMessage()" ${negBusy?'disabled':''}>Send</button>
        </div>
      </div>`}
    ${done ? `<button class="mini-btn" style="margin-top:10px" onclick="closeNegotiation()">Close</button>` : ''}
  </div></div>`;
}

function renderDebrief(n){
  if(n.status!=='accepted') return `<div class="debrief"><p>${n.debriefNote||'You ended the negotiation without a deal.'}</p></div>`;
  return `<div class="debrief">
    ${renderDealCloseGrid(n.dealCloseReport)}
    <p><strong>Deal quality: ${n.dealQuality}/100</strong> · Relationship impact: +${n.relationshipImpact||0}</p>
    <p>Strengths</p><ul>${(n.strengths||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
    <p>Missed issues</p><ul>${(n.missed||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
  </div>`;
}

function walkAway(){
  const n = S.negotiation;
  if(n.kind === 'rival_contest'){
    rivalWinsContest(n);
    addLog(`Walked away from the three-way contest — ${rivalDisplayName(n.rival)} takes the listing.`);
    render();
    return;
  }
  n.status = 'rejected';
  n.debriefNote = 'You walked away. No terms were accepted, no money moved.';
  recordFarmNpcOutcome(n, false);
  if(n.kind==='relationship'){
    S.reputation = Math.max(0, S.reputation - 3);
    addLog('Walking away from an urgent relationship issue cost reputation.', 'event');
  }
  const who = n.counterparty.npcName || NEGOTIATOR_ARCHETYPES.find(a=>a.id===n.counterparty.archetypeId).name;
  addLog(`Walked away from negotiation with ${who}.`);
  render();
}

async function sendNegotiationMessage(){
  const input = document.getElementById('negInput');
  const text = (input.value||'').trim();
  if(!text || negBusy) return;
  const n = S.negotiation;
  n.messages.push({ who:'player', text });
  negBusy = true;
  renderModal();

  if(n.kind === 'rival_contest'){
    let parsed;
    try{
      parsed = await callNegotiationAI(n, text);
    }catch(e){
      if(typeof EconGameAI !== 'undefined') EconGameAI.noteOffline(n);
      else { n.aiOfflineNoted = true; n.messages.push({ who:'system', text:'AI offline — using basic replies.' }); }
      parsed = null;
    }
    negBusy = false;
    processRivalContestTurn(n, text, parsed);
    input.value = '';
    render();
    return;
  }

  let parsed;
  try{
    parsed = await callNegotiationAI(n, text);
  }catch(e){
    if(typeof EconGameAI !== 'undefined') EconGameAI.noteOffline(n);
    else { n.aiOfflineNoted = true; n.messages.push({ who:'system', text:'AI offline — using basic replies.' }); }
    parsed = fallbackExtractOffer(text, n);
  }
  negBusy = false;

  n.round += 1;

  const resolved = resolvePlayerPurchaseOffer(text, n, parsed);
  let offer = resolved.offer;
  let intent = resolved.intent;

  let utility = null, decision;
  if(intent==='offer' && offer){
    utility = evaluateOfferUtility(offer, n.counterparty, n.context);
    decision = negotiationDecision(utility, n.round, n.maxRounds);
    n.playerLastOffer = offer;
  } else if(intent==='walk'){
    decision = 'reject';
  } else {
    decision = 'ongoing';
  }

  let dialogue = sanitizeSellerDialogue(parsed.dialogue, decision) || fallbackDialogue(decision === 'ongoing' ? 'question' : decision, n.counterparty);
  const playerOfferSummary = offer ? summarizeOffer(offer) : null;

  if(decision==='accept'){
    n.readyToClose = true;
    n.pendingOffer = offer;
    n.lastOffer = offer;
    const closeLine = fallbackDialogue('accept', n.counterparty);
    n.messages.push({ who:'counterparty', text: closeLine + " I'd be glad to close on that whenever you're ready.", offerSummary: playerOfferSummary });
  } else if(decision==='reject'){
    n.readyToClose = false; n.pendingOffer = null;
    const redlineHit = offer && n.counterparty.redLine && offer.totalPrice && offer.totalPrice < n.counterparty.redLine;
    n.messages.push({ who:'counterparty', text: redlineHit ? `${dialogue} That's below what I can accept — no deal.` : `${dialogue} I don't think we can make this work.` });
    n.status = 'rejected';
    n.debriefNote = redlineHit ? 'The offer fell below the counterparty\'s red line and was rejected outright.' : 'The counterparty declined to continue.';
    recordFarmNpcOutcome(n, false);
    const who = n.counterparty.npcName || NEGOTIATOR_ARCHETYPES.find(a=>a.id===n.counterparty.archetypeId).name;
    addLog(`Negotiation with ${who} ended without a deal.`);
  } else if(decision==='counter'){
    n.readyToClose = false; n.pendingOffer = null;
    const counter = buildCounterOffer(n, offer);
    n.lastOffer = counter;
    n.messages.push({ who:'counterparty', text: dialogue, offerSummary: summarizeOffer(counter) });
    if(playerOfferSummary){
      n.messages.push({ who:'system', text: `Your offer on the table: ${playerOfferSummary}` });
    }
  } else {
    n.messages.push({ who:'counterparty', text: dialogue });
    if(playerOfferSummary){
      n.messages.push({ who:'system', text: `Your offer on the table: ${playerOfferSummary}` });
    }
  }

  if(n.round >= n.maxRounds && n.status==='ongoing' && !n.readyToClose){
    // force resolution on next message if still ongoing; nudge player
    n.messages.push({ who:'counterparty', text: '(This is close to my final position — we should wrap this up soon.)' });
  }

  render();
}

function closeDealNow(){
  const n = S.negotiation;
  if(!n || !n.readyToClose || !n.pendingOffer) return;
  if(n.kind === 'rival_contest'){
    const { playerU: pu, rivalU: ru } = typeof RivalFarmer !== 'undefined'
      ? RivalFarmer.contestUtilities(n, contestHelpers())
      : { playerU: evaluateOfferUtility(n.pendingOffer, n.counterparty, n.context), rivalU: n.rivalConceded ? -Infinity : evaluateOfferUtility(n.rivalLastOffer, n.counterparty, n.context) };
    if(pu < ru || pu < 18){
      n.messages.push({ who:'counterparty', text: "I'm going with the other buyer — their package was stronger." });
      rivalWinsContest(n);
      render();
      return;
    }
  }
  let offer = n.pendingOffer;
  if(n.playerLastOfferText && typeof RivalFarmer !== 'undefined' && RivalFarmer.buildPlayerOfferFromMessage){
    const rebuilt = RivalFarmer.buildPlayerOfferFromMessage(n.playerLastOfferText, { intent:'offer' }, n, contestHelpers());
    if(rebuilt.offer && rebuilt.offer.totalPrice) offer = rebuilt.offer;
  }
  if(n.kind === 'rival_contest' && typeof RivalFarmer !== 'undefined' && RivalFarmer.rivalLoseLine){
    n.messages.push({ who:'rival', text: RivalFarmer.rivalLoseLine(n) });
  }
  n.messages.push({ who:'player', text:'Let\'s close on those terms.' });
  finalizeDeal(n, offer);
  render();
}

function normalizeOffer(raw, n){
  if(!raw) return null;
  const o = {};
  if(raw.totalPrice!=null) o.totalPrice = Number(raw.totalPrice)||0;
  if(raw.cashAtClosing!=null) o.cashAtClosing = Number(raw.cashAtClosing)||0;
  o.closingSpeed = raw.closingSpeed || 'standard';
  o.termsOffered = Array.isArray(raw.termsOffered) ? raw.termsOffered.slice() : [];
  if(raw.priceAdjustment!=null) o.priceAdjustment = Number(raw.priceAdjustment)||0;
  if(raw.concessionSize!=null) o.concessionSize = Number(raw.concessionSize)||0;
  if(raw._capped) o._capped = true;
  if(o.totalPrice && o.cashAtClosing && o.cashAtClosing > o.totalPrice){
    const hi = Math.max(o.totalPrice, o.cashAtClosing);
    const lo = Math.min(o.totalPrice, o.cashAtClosing);
    o.totalPrice = hi;
    o.cashAtClosing = lo;
  }
  o.riskToCounterparty = o.termsOffered.some(t=>/earnout|contingent|seller note/i.test(t)) ? 14 : 8;
  if(o.totalPrice && (o.cashAtClosing==null || o.cashAtClosing===0)){
    o.cashAtClosing = raw._allCash ? o.totalPrice : Math.round(o.totalPrice * 0.45);
  }
  if(raw._allCash || (o.totalPrice && o.cashAtClosing === o.totalPrice && !o.termsOffered.some(t=>/seller note|payment schedule|earnout/i.test(t)))){
    o.cashAtClosing = o.totalPrice;
    o.termsOffered = o.termsOffered.filter(t=>!/seller note|payment schedule|earnout/i.test(t));
  }
  return o;
}

function summarizeOffer(o){
  if(o.totalPrice!=null){
    const allCash = o.cashAtClosing === o.totalPrice && !(o.termsOffered||[]).some(t=>/seller note|payment schedule|earnout/i.test(t));
    const cashLine = allCash
      ? `All cash ${fmt(o.totalPrice)}`
      : `Total ${fmt(o.totalPrice)} · Cash at closing ${fmt(o.cashAtClosing||0)}`;
    return `${cashLine} · Closing: ${o.closingSpeed}${o.termsOffered.length? ' · '+o.termsOffered.join(', ') : ''}`;
  }
  if(o.priceAdjustment!=null || o.concessionSize!=null){
    return `Price adjustment ${o.priceAdjustment||0}% · Concession size ${o.concessionSize||0}`;
  }
  return '';
}

function buildCounterOffer(n, playerOffer){
  const c = n.counterparty;
  const factor = c.concessionStyle==='fast' ? 0.55 : c.concessionStyle==='slow' ? 0.25 : 0.4;
  if(n.context.price){
    const anchor = c.reservationPrice || Math.round(n.context.price*0.85);
    const base = playerOffer && playerOffer.totalPrice ? playerOffer.totalPrice : Math.round(n.context.price*0.9);
    const total = Math.round(base + (anchor - base) * (1-factor));
    return { totalPrice: total, cashAtClosing: Math.round(total*0.4), closingSpeed:'standard', termsOffered:[], riskToCounterparty:8 };
  }
  const adj = playerOffer && playerOffer.priceAdjustment!=null ? playerOffer.priceAdjustment : 5;
  return { priceAdjustment: Math.round(adj*0.6), concessionSize: 0, termsOffered:[] };
}

function fallbackDialogue(decision, counterparty){
  if(modeCfg(S).farmTheme && counterparty?.speciesId && typeof FarmAnimalNPC !== 'undefined'){
    return FarmAnimalNPC.fallbackDialogueFarm(decision, counterparty);
  }
  if(decision==='accept') return 'Alright, that works for me.';
  if(decision==='reject') return 'I appreciate the offer, but';
  if(decision==='counter') return 'I hear you, but I need something closer to my number.';
  return 'Go on, I\'m listening.';
}

function fallbackExtractOffer(text, n){
  const lower = text.toLowerCase();
  let intent = 'question';
  if(/\baccept\b|\bdeal\b|agreed|sounds good/.test(lower)) intent='accept';
  else if(/walk|no thanks|withdraw|never mind/.test(lower)) intent='walk';
  else if(typeof RivalFarmer !== 'undefined' ? RivalFarmer.messageHasOfferFigures?.(text) ?? /\d/.test(text) : /\d/.test(text)) intent='offer';

  let offer = null;
  if(intent === 'offer'){
    if(typeof RivalFarmer !== 'undefined' && RivalFarmer.extractPurchaseOfferFromText){
      offer = RivalFarmer.extractPurchaseOfferFromText(text, n || S.negotiation, contestHelpers());
    }
    if(!offer && typeof RivalFarmer !== 'undefined' && RivalFarmer.buildPlayerOfferFromMessage){
      const built = RivalFarmer.buildPlayerOfferFromMessage(text, { intent:'offer' }, n || S.negotiation, contestHelpers());
      offer = built.offer;
    }
    if(!offer){
      const amounts = typeof RivalFarmer !== 'undefined' && RivalFarmer.parseOfferAmountsFromText
        ? RivalFarmer.parseOfferAmountsFromText(text)
        : null;
      const nums = (text.match(/\$?\d[\d,]{2,}/g)||[]).map(x=>Number(x.replace(/[$,]/g,'')));
      if(amounts){
        offer = normalizeOffer({
          totalPrice: amounts.totalPrice,
          cashAtClosing: amounts.cashAtClosing,
          closingSpeed:/fast|quick|thirty|30 day/.test(lower)?'fast':'standard',
          termsOffered: typeof RivalFarmer !== 'undefined' ? RivalFarmer.extractTermsFromText(text) : [],
        }, n);
      } else if(nums.length){
        offer = normalizeOffer({
          totalPrice: nums.length >= 2 ? Math.max(nums[0], nums[1]) : nums[0],
          cashAtClosing: nums.length >= 2 ? Math.min(nums[0], nums[1]) : Math.round(nums[0]*0.4),
          closingSpeed:/fast|quick|thirty|30 day/.test(lower)?'fast':'standard',
          termsOffered: typeof RivalFarmer !== 'undefined' ? RivalFarmer.extractTermsFromText(text) : (/employee|staff/.test(lower)?['employee retention']:[]),
        }, n);
      }
    }
  }
  return { dialogue:null, intent, offer };
}

function callNegotiationAI(n, playerMessage){
  if(typeof EconGameAI === 'undefined') throw new Error('EconGameAI not loaded');
  const archetype = NEGOTIATOR_ARCHETYPES.find(a=>a.id===n.counterparty.archetypeId);
  if(n.context && n.context.opp) n.context.diligenceDone = !!n.context.opp.diligenceDone;
  attachPortfolioFactsToContext(n.context);
  const opts = { archetype };
  if(n.kind === 'rival_contest' && typeof RivalFarmer !== 'undefined'){
    opts.buildPrompt = RivalFarmer.buildThreeWayPrompt;
  } else if(n.counterparty.speciesId && typeof FarmAnimalNPC !== 'undefined'){
    opts.buildPrompt = FarmAnimalNPC.buildPrompt;
  }
  return EconGameAI.negotiate(n, playerMessage, opts);
}

function recordFarmNpcOutcome(n, accepted){
  if(typeof FarmAnimalNPC === 'undefined' || !n || !n.counterparty || !n.counterparty.speciesId) return;
  FarmAnimalNPC.recordOutcome(S, n.counterparty, {
    accepted,
    dealQuality: n.dealQuality,
    grievance: accepted ? null : 'deal collapsed or walked away',
  });
}

function finalizeDeal(n, offer){
  n.status = 'accepted';
  if(n.kind==='acquisition' || n.kind==='realestate' || n.kind==='rival_contest'){
    const o = n.context.opp;
    const before = captureSynergyState(S);
    const fin = o.assetType==='realestate' ? finalizeRealEstatePurchase(o, offer) : finalizeBusinessPurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    S.activeRivalContestOppId = null;
    n.dealQuality = dealQualityScore(offer, n.counterparty, n.context);
    n.relationshipImpact = n.kind==='rival_contest' ? 5 : (n.kind==='realestate' ? 4 : 5);
    n.strengths = buildStrengths(n, offer);
    if(n.kind==='rival_contest') n.strengths.unshift(`Outbid ${rivalDisplayName(n.rival)} in a three-way contest.`);
    n.missed = buildMissed(n, offer);
    n.dealCloseReport = buildDealCloseReport(o, offer, fin);
    processSynergyChanges(before, S);
    trackRunDeal(S, n, o, fin);
    addLog(formatDealCloseLog(n.dealCloseReport, n.dealQuality) + (n.kind==='rival_contest' ? ` · Beat ${rivalDisplayName(n.rival)}` : ''), 'deal');
  } else if(n.kind==='relationship'){
    const p = n.context.problem;
    resolveRelationshipDeal(p, offer);
    S.urgentProblems = S.urgentProblems.filter(x=>x.id!==p.id);
    n.dealQuality = 70;
    n.relationshipImpact = 6;
    n.strengths = ['Kept a portfolio relationship from breaking.'];
    n.missed = [];
    S.reputation += hasEdge(S,'relationship_capital') ? 5 : 4;
    addLog(`Resolved relationship issue: ${p.text} · Reputation +${hasEdge(S,'relationship_capital') ? 5 : 4}`, 'deal');
  } else if(n.kind==='levelup'){
    const o = n.context.opp;
    const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
    const fin = settleAcquisitionFinance(o.price, offer, 'levelup');
    applyLevelUpEffects(b, o.levelUpTemplate);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    n.dealQuality = dealQualityScore(offer, n.counterparty, n.context);
    n.relationshipImpact = 4;
    n.strengths = buildStrengths(n, offer);
    n.missed = buildMissed(n, offer);
    n.dealCloseReport = buildDealCloseReport(o, offer, fin);
    trackRunDeal(S, n, o, fin);
    addLog(formatDealCloseLog(n.dealCloseReport, n.dealQuality) + ` · ${b.name} now Level ${b.level}`, 'deal');
  }
  recordFarmNpcOutcome(n, true);
  S.contracts.push({ turn:S.turn, kind:n.kind, quality:n.dealQuality });
}

function resolveRelationshipDeal(p, offer){
  if(p.type==='client'){
    const b = S.portfolio.businesses.find(x=>x.id===p.businessId);
    if(b){ b.clientState = 'stable'; b.revenuePerTurn *= 0.97; b.clientHealth = clamp((b.clientHealth??50)+25, 0, 100); b.clientCooldown = 3; }
  } else if(p.type==='supplier'){
    const b = S.portfolio.businesses.find(x=>x.id===p.businessId);
    if(b){ b.supplierState = 'stable'; b.operatingCosts *= 1.03; b.supplierHealth = clamp((b.supplierHealth??50)+25, 0, 100); b.supplierCooldown = 3; }
  } else if(p.type==='lender'){
    const l = S.loans.find(x=>x.id===p.loanId);
    if(l){ l.paymentPerTurn *= 1.02; }
  }
}

function buildStrengths(n, offer){
  const s = [];
  if(offer.closingSpeed==='fast') s.push('Recognized that closing speed mattered to the counterparty.');
  if((offer.termsOffered||[]).length) s.push(`Used non-price terms (${offer.termsOffered.join(', ')}) to close the gap.`);
  if(n.round<=2) s.push('Reached agreement efficiently, in few rounds.');
  if(!s.length) s.push('Reached an accepted deal without violating a red line.');
  return s;
}
function buildMissed(n, offer){
  const m = [];
  if(!(offer.termsOffered||[]).length) m.push('Did not propose any non-price terms (e.g. earn-out, employee retention).');
  if(offer.cashAtClosing === offer.totalPrice) m.push('Paid entirely in cash at closing — no financing structure used.');
  if(n.round>=n.maxRounds-1) m.push('Took most of the available rounds to reach agreement.');
  return m;
}

function openFieldGuide(page){
  fieldGuidePage = page != null ? Math.max(0, Math.min(page, NEGOTIATION_FIELD_GUIDE.length - 1)) : 0;
  fieldGuideOpen = true;
  renderModal();
}

function closeFieldGuide(){
  fieldGuideOpen = false;
  renderModal();
}

function fieldGuideGoTo(page){
  fieldGuidePage = Math.max(0, Math.min(page, NEGOTIATION_FIELD_GUIDE.length - 1));
  renderModal();
}

function fieldGuideNav(delta){
  fieldGuideGoTo(fieldGuidePage + delta);
}

function renderFieldGuideModal(){
  const total = NEGOTIATION_FIELD_GUIDE.length;
  const page = NEGOTIATION_FIELD_GUIDE[fieldGuidePage];
  const dots = NEGOTIATION_FIELD_GUIDE.map((_, i) =>
    `<button type="button" class="fg-dot ${i === fieldGuidePage ? 'active' : ''}" onclick="fieldGuideGoTo(${i})" aria-label="Page ${i + 1}"></button>`
  ).join('');
  return `<div class="field-guide-backdrop" onclick="if(event.target===this)closeFieldGuide()">
    <div class="field-guide-modal" role="dialog" aria-labelledby="fgTitle">
      <div class="field-guide-head">
        <div class="fg-sub">Negotiation Field Guide · Mechanics reference</div>
        <h2 id="fgTitle">${page.title}</h2>
        <div class="fg-sub">${page.subtitle}</div>
      </div>
      <div class="field-guide-body">${page.html}</div>
      <div class="field-guide-foot">
        <div class="fg-nav">
          <button type="button" class="mini-btn" onclick="fieldGuideNav(-1)" ${fieldGuidePage <= 0 ? 'disabled' : ''}>← Prev</button>
          <button type="button" class="mini-btn" onclick="fieldGuideNav(1)" ${fieldGuidePage >= total - 1 ? 'disabled' : ''}>Next →</button>
        </div>
        <div class="fg-page-dots">${dots}</div>
        <span class="rounds-left">${fieldGuidePage + 1} / ${total}</span>
        <button type="button" class="mini-btn" onclick="closeFieldGuide()">Close</button>
      </div>
    </div>
  </div>`;
}

async function refreshAiSetupNote(){
  const el = document.getElementById('aiSetupNote');
  if(!el) return;
  const fileHint = (typeof location !== 'undefined' && location.protocol === 'file:')
    ? ' Do not open the HTML file directly — use the server URL below.'
    : '';
  if(typeof EconGameAI === 'undefined'){
    el.innerHTML = `<strong>AI module missing.</strong> Ensure <code>js/ollama-negotiate.js</code> loads next to this HTML.${fileHint}`;
    return;
  }
  el.textContent = 'Checking Ollama proxy…';
  try {
    const res = await fetch(`${EconGameAI.getProxyUrl()}/health`, { signal: AbortSignal.timeout(2500) });
    const data = await res.json().catch(()=>({}));
    if(res.ok && data.ok){
      el.innerHTML = `<strong>AI ready</strong> — ${data.model || 'Ollama'} via ${EconGameAI.getProxyUrl()}. Negotiations use live NPC dialogue.${fileHint}`;
    } else {
      el.innerHTML = `<strong>AI offline.</strong> From repo root run <code>npm start</code>, then open <a href="http://127.0.0.1:8787/" target="_blank" rel="noopener">http://127.0.0.1:8787/</a>. Keep Ollama running.${fileHint}`;
    }
  } catch {
    el.innerHTML = `<strong>AI offline.</strong> From repo root run <code>npm start</code>, then open <a href="http://127.0.0.1:8787/" target="_blank" rel="noopener">http://127.0.0.1:8787/</a>. Keep Ollama running.${fileHint}`;
  }
}

function shuffleCopy(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function pickEdge(id){ selectedEdge = id; render(); }
function pickMode(m){ selectedMode = m; render(); }

function startRun(){
  setupEdgePool = null;
  S = newRunState();
  S.mode = selectedMode;
  initSecurityPrices(S);
  S.strategicEdges = [selectedEdge];
  S.opportunities = generateOpportunities(S);
  S.urgentProblems = [];
  S.wildcardEvent = pick(WILDCARD_EVENTS);
  S.wildcardTriggered = false;
  if(modeCfg(S).farmTheme) S.actionPoints = maxActionPoints(S);
  S.log.unshift({ type:'system', text:`Run started in ${GAME_MODES[S.mode].label} mode. Strategic Edge: ${STRATEGIC_EDGES.find(e=>e.id===selectedEdge).name}.` });
  snapshotTurn(S, {revenueTotal:0,costTotal:0,debtService:0,netCashFlow:0});
  S.periodSnapshot = snapshotPeriodState(S);
  S._synergySnapshot = captureSynergyState(S);
  S.lastAdvanceReport = null;
  S.pendingTurnDebriefModal = null;
  S.debriefExpanded = false;
  S.pendingMilestoneFanfare = null;
  screen = 'playing';
  render();
}

    S.urgentProblems.forEach(p=>{

      html += `<div class="urgent-card"><div class="tag">${p.type}</div><div>${p.text}</div>
        ${renderCompactNpc(p.counterparty)}
        ${stakeLine}
        <div class="opp-actions" style="margin-top:8px">
          <button class="mini-btn primary" ${S.actionPoints<1?'disabled':''} onclick="openRelationshipNegotiation('${p.id}')">Negotiate (1 AP)</button>
        </div></div>`;
    });
  }

  html += `<h2 style="margin-top:18px">Opportunities</h2>`;
  if(S.opportunities.length===0) html += `<div class="empty-hint">No opportunities remain this turn.</div>`;
  S.opportunities.forEach(o=> html += renderOpportunityCard(o));

  html += `<h2 style="margin-top:18px">Activity Log</h2>`;
  S.log.slice(0,12).forEach(l=>{
    html += `<div class="log-entry ${l.type==='event'?'event':l.type==='milestone'?'milestone':l.type==='synergy'?'synergy':l.type==='deal'?'deal':l.type==='feedback'?'feedback':''}">${l.text}</div>`;
  });

  c.innerHTML = html;
}

function financingGapHint(price){
  if(S.cash >= price) return '';
  const gap = price - S.cash;
  const rate = sellerNoteRate(S);
  return `<div class="facts" style="color:#a1483a;">Financing gap ~${fmt(gap)} — if unfinanced at closing, this defaults to a seller note at ~${fmtPct(rate)}/qtr. A pre-arranged Line of Credit is usually cheaper.</div>`;
}

}

function renderImproveBusinessPanel(){
  const bizId = (selImproveBiz && S.portfolio.businesses.some(x=>x.id===selImproveBiz)) ? selImproveBiz : S.portfolio.businesses[0].id;
  const b = S.portfolio.businesses.find(x=>x.id===bizId);
  const applied = b.improvementsApplied || [];
  const firstAvailable = IMPROVEMENTS.find(i=>!applied.includes(i.id));
  const typeId = (selImproveType && IMPROVEMENTS.some(i=>i.id===selImproveType) && !applied.includes(selImproveType))
    ? selImproveType : (firstAvailable ? firstAvailable.id : IMPROVEMENTS[0].id);
  const imp = IMPROVEMENTS.find(i=>i.id===typeId);
  const cost = businessImproveCost(b, imp);
  const allDone = applied.length >= IMPROVEMENTS.length;
  const alreadyApplied = applied.includes(typeId);
  const canAct = !allDone && !alreadyApplied && S.actionPoints >= 1;
  const canAfford = S.cash >= cost;
  const statusLine = allDone ? 'All improvements applied at this level.'
    : alreadyApplied ? 'Already applied — pick another.' : '';

  return `
    <select id="improveBizSelect" onchange="onImproveBizChange(this.value)" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">
      ${S.portfolio.businesses.map(x=>`<option value="${x.id}" ${x.id===bizId?'selected':''}>${x.name} — Lv${x.level||1}, ${(x.improvementsApplied||[]).length}/${IMPROVEMENTS.length} applied</option>`).join('')}

    <select id="improveTypeSelect" onchange="onImproveTypeChange(this.value)" style="width:100%;margin-bottom:8px;background:#1a2430;color:#efe9d8;border:1px solid #2a3644;padding:6px;">
      ${IMPROVEMENTS.map(i=>`<option value="${i.id}" ${i.id===typeId?'selected':''} ${applied.includes(i.id)?'disabled':''}>${applied.includes(i.id)?'✓ ':''}${i.name}${applied.includes(i.id)?' — already applied':' — '+i.note}</option>`).join('')}
    </select>
    ${statusLine ? `<div class="improve-cost-line">${statusLine}</div>` : ''}
    <button class="mini-btn primary" ${!canAct || !canAfford?'disabled':''} onclick="doImprove()">${canAct ? improveButtonLabel(cost) : 'Improve (1 AP)'}</button>

// ---------------- ACTIONS ----------------
function spendAP(n=1){ S.actionPoints = Math.max(0, S.actionPoints - n); }

function doHold(){ addLog('Held position this turn.'); render(); }

function investigate(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || S.actionPoints<1) return;
  spendAP(1);
  o.diligenceDone = true;
  if(o.assetType==='business'){
    o.margin = clamp(o.margin + rnd(-0.02,0.02), 0.05, 0.6);
    addLog(`Diligence on ${o.name}: normalized margin narrows to ${fmtPct(o.margin)}. Hidden note: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  } else if(o.assetType==='realestate'){
    addLog(`Inspection on ${o.name}: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  } else if(o.assetType==='levelup' && o.counterparty){
    addLog(`Diligence on ${o.name}: ${o.counterparty.hiddenInfo}. Negotiation Intel unlocked.`);
  }
  render();
}

function buySecurity(ticker, price, oppId){
  if(S.actionPoints<1) return;
  const input = document.getElementById('qty-'+oppId);
  let qty = input ? parseInt(input.value,10) : 10;
  if(!qty || qty<10) qty = 10;
  qty = Math.round(qty/10)*10;
  const cost = qty*price;
  if(S.cash < cost){ addLog(`Not enough cash to buy ${qty} shares of ${ticker} (need ${fmt(cost)}).`); render(); return; }
  S.cash -= cost;
  spendAP(1);
  let holding = S.portfolio.securities.find(s=>s.ticker===ticker);
  if(holding){
    holding.costBasis = (holding.costBasis*holding.shares + cost) / (holding.shares+qty);
    holding.shares += qty;
  } else {
    S.portfolio.securities.push({ticker, shares:qty, price, costBasis:price});
  }
  addLog(`Bought ${qty} shares of ${ticker} for ${fmt(cost)}.`);
  if(oppId) S.opportunities = S.opportunities.filter(o=>o.id!==oppId);
  render();
}

function sellSecurity(ticker){
  const holding = S.portfolio.securities.find(s=>s.ticker===ticker);
  if(!holding) return;
  const proceeds = holding.shares*holding.price;
  S.cash += proceeds;
  S.portfolio.securities = S.portfolio.securities.filter(s=>s.ticker!==ticker);
  addLog(`Sold ${holding.shares} shares of ${ticker} for ${fmt(proceeds)}.`);
  render();
}

function takeLoan(maxAmount, rate, oppId){
  if(S.actionPoints<1) return;
  spendAP(1);
  S.cash += maxAmount;
  const terms = computeLoanTerms(maxAmount, rate, 10);
  S.loans.push({ id: uid(), label:'Bank Line of Credit', type:'personal', principal:maxAmount, rate,
    principalPerTurn: terms.principalPerTurn, paymentPerTurn: terms.paymentPerTurn, turnsRemaining:10 });
  S.opportunities = S.opportunities.filter(o=>o.id!==oppId);
  addLog(`Drew ${fmt(maxAmount)} line of credit at ${fmtPct(rate)}/turn — ${fmt(terms.paymentPerTurn)}/qtr for 10 quarters, ${fmt(terms.totalReturn)} total.`);
  render();
}

function buyOutright(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || S.actionPoints<1) return;
  spendAP(1);
  const offer = { totalPrice:o.price, cashAtClosing:o.price, closingSpeed:'standard', termsOffered:[], riskToCounterparty:8 };
  if(o.assetType==='business'){
    const before = captureSynergyState(S);
    const fin = finalizeBusinessPurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    processSynergyChanges(before, S);
    const report = buildDealCloseReport(o, offer, fin);
    addLog(formatDealCloseLog(report, null) + ' · Buy Now (no negotiation)', 'deal');
  } else if(o.assetType==='realestate'){
    const before = captureSynergyState(S);
    const fin = finalizeRealEstatePurchase(o, offer);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    processSynergyChanges(before, S);
    const report = buildDealCloseReport(o, offer, fin);
    addLog(formatDealCloseLog(report, null) + ' · Buy Now (no negotiation)', 'deal');
  } else if(o.assetType==='levelup' && o.requiresNegotiation){
    const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
    if(!b) return;
    const fin = settleAcquisitionFinance(o.price, offer, 'levelup');
    applyLevelUpEffects(b, o.levelUpTemplate);
    S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
    const report = buildDealCloseReport(o, offer, fin);
    addLog(formatDealCloseLog(report, null) + ` · ${b.name} now Level ${b.level} · Buy Now`, 'deal');
  }
  render();
}

function doImprove(){
  const bizId = document.getElementById('improveBizSelect').value;
  const impId = document.getElementById('improveTypeSelect').value;
  const b = S.portfolio.businesses.find(x=>x.id===bizId);
  const imp = IMPROVEMENTS.find(x=>x.id===impId);
  if(!b || !imp || S.actionPoints<1) return;
  if((b.improvementsApplied||[]).includes(imp.id)){ addLog(`${imp.name} has already been applied at ${b.name} this level.`); render(); return; }
  const cost = Math.round(b.valuation*imp.cost*0.3);
  if(S.cash < cost){ addLog(`Not enough cash to fund ${imp.name} at ${b.name}.`); render(); return; }
  const valBefore = b.valuation;
  const revBefore = b.revenuePerTurn;
  const costBefore = b.operatingCosts;
  S.cash -= cost;
  spendAP(1);
  if(imp.effect==='revenue') b.revenuePerTurn *= imp.mult;
  if(imp.effect==='ownerDep') b.ownerDependence = clamp(b.ownerDependence*imp.mult,0.05,0.95);
  if(imp.effect==='condition') b.equipmentCondition = clamp(b.equipmentCondition+0.25,0,1);
  if(imp.effect==='costs') b.operatingCosts *= imp.mult;
  if(imp.effect==='churnGuard') b.custConc = clamp(b.custConc*0.9,0.02,0.9);
  if(imp.effect==='care'){
    b.crisisMult = clamp((b.crisisMult??1)*imp.mult, 0.15, 1);
    b.clientHealth = clamp((b.clientHealth??72)+20, 0, 100);
    b.supplierHealth = clamp((b.supplierHealth??72)+20, 0, 100);
  }
  b.valuation = valuateBusiness(b);
  b._improvedThisTurn = true;
  b.improvementsApplied = [...(b.improvementsApplied||[]), imp.id];
  let msg = `${imp.name} at ${b.name}: ${imp.note} (cost ${fmt(cost)}) · Val ${fmt(valBefore)} → ${fmt(b.valuation)} (${b.valuation>=valBefore?'+':''}${fmt(b.valuation-valBefore)}) · Rev ${fmt(revBefore)} → ${fmt(Math.round(b.revenuePerTurn))}/qtr`;
  if(Math.round(b.operatingCosts) !== Math.round(costBefore)){
    msg += ` · Cost ${fmt(costBefore)} → ${fmt(Math.round(b.operatingCosts))}/qtr`;
  }

  if(b.improvementsApplied.length >= IMPROVEMENTS.length){
    if((b.level||1) < 3){
      applyLevelUpEffects(b, AUTO_LEVEL_TEMPLATE);
      msg += ` Every improvement has now been applied — ${b.name} has fully matured and automatically advances to Level ${b.level}! Revenue, costs, and value all step up substantially. Improvements reset for the new level.`;
    } else {
      b.revenuePerTurn = Math.round(b.revenuePerTurn * AUTO_LEVEL_TEMPLATE.revenueMult);
      b.operatingCosts = Math.round(b.operatingCosts * AUTO_LEVEL_TEMPLATE.costMult);
      b.valuation = valuateBusiness(b);
      b.improvementsApplied = [];
      msg += ` Every improvement has been applied at ${b.name}'s max level — revenue, costs, and value step up again, and options reset for further fine-tuning.`;
    }
  } else if(b.improvementsApplied.length >= 3 && (b.level||1) < 3){
    msg += ` ${b.name} has matured enough for a major upgrade opportunity — watch for one in Opportunities.`;
  }
  addLog(msg, 'feedback');
  render();
}

function applyLevelUpEffects(b, tmpl){
  b.revenuePerTurn = Math.round(b.revenuePerTurn * (tmpl.revenueMult||1));
  b.operatingCosts = Math.round(b.operatingCosts * (tmpl.costMult||1));
  if(tmpl.ownerDepMult) b.ownerDependence = clamp(b.ownerDependence*tmpl.ownerDepMult, 0.05, 0.95);
  if(tmpl.conditionBoost) b.equipmentCondition = 1;
  if(tmpl.custConcAdd) b.custConc = clamp(b.custConc + tmpl.custConcAdd, 0.02, 0.9);
  b.level = (b.level||1) + 1;
  b.improvementsApplied = [];
  b.levelUpsApplied = b.levelUpsApplied || [];
  b.levelUpsApplied.push(tmpl.id);
  b.valuation = valuateBusiness(b);
}

function doLevelUp(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || o.assetType!=='levelup' || S.actionPoints<1) return;
  const b = S.portfolio.businesses.find(x=>x.id===o.businessId);
  if(!b) return;
  if(S.cash < o.price){ addLog(`Not enough cash to invest in ${o.name}.`); render(); return; }
  S.cash -= o.price;
  spendAP(1);
  applyLevelUpEffects(b, o.levelUpTemplate);
  S.opportunities = S.opportunities.filter(x=>x.id!==o.id);
  addLog(`${o.levelUpTemplate.name} completed at ${b.name} — now Level ${b.level}.`);
  render();
}

function doImproveRealEstate(){
  const reId = document.getElementById('improveReSelect').value;
  const impId = document.getElementById('improveReTypeSelect').value;
  const r = S.portfolio.realEstate.find(x=>x.id===reId);
  const imp = realEstateImprovementsFor(S).find(x=>x.id===impId);
  if(!r || !imp || S.actionPoints<1) return;
  const cost = Math.round(r.valuation*imp.cost);
  if(S.cash < cost){ addLog(`Not enough cash to fund ${imp.name} at ${r.name}.`); render(); return; }
  const valBefore = r.valuation;
  const rentBefore = r.rentPerTurn;
  S.cash -= cost;
  spendAP(1);
  r.valuation = Math.round(r.valuation * (1+imp.valBoost));
  r.rentPerTurn = Math.round(r.rentPerTurn * (1+imp.rentBoost));
  addLog(`${imp.name} at ${r.name}: ${imp.note} (cost ${fmt(cost)}) · Val ${fmt(valBefore)} → ${fmt(r.valuation)} (${r.valuation>=valBefore?'+':''}${fmt(r.valuation-valBefore)}) · Rent ${fmt(rentBefore)} → ${fmt(r.rentPerTurn)}/qtr`, 'feedback');
  render();
}

function doSell(){
  const sel = document.getElementById('sellAssetSelect').value;
  const [kind, id] = sel.split(':');
  if(S.actionPoints<1) return;
  spendAP(1);
  if(kind==='biz'){
    const b = S.portfolio.businesses.find(x=>x.id===id);
    const price = Math.round(b.valuation*rnd(0.92,1.08));
    S.cash += price;
    S.portfolio.businesses = S.portfolio.businesses.filter(x=>x.id!==id);
    addLog(`Sold ${b.name} for ${fmt(price)}.`);
  } else {
    const r = S.portfolio.realEstate.find(x=>x.id===id);
    const price = Math.round(r.valuation*rnd(0.95,1.05));
    S.cash += price;
    S.portfolio.realEstate = S.portfolio.realEstate.filter(x=>x.id!==id);
    addLog(`Sold ${r.name} for ${fmt(price)}.`);
  }
  render();
}

function valuateBusiness(b){
  const cfg = modeCfg(S);
  const normProfit = b.revenuePerTurn - b.operatingCosts;
  const multiple = 4 - b.ownerDependence*1.2 - b.custConc*1.5 + (1-b.equipmentCondition)*-0.5;
  let val = Math.max(1000, normProfit*4*clamp(multiple/2.5,0.6,1.6));
  if(hasEdge(S,'recurring_revenue_focus') && b.custConc<0.15) val *= 1.08;
  val *= cfg.valuationMult;
  return Math.round(val);
}

function addLog(text, type='normal'){ S.log.unshift({type, text}); }

// ---- Phase A: feedback helpers ----
function synergyKey(y){
  return `${y.connectionId||y.chainId}|${y.supplierId}|${y.customerId}`;
}

function captureSynergyState(s){
  const farm = modeCfg(s).farmTheme && typeof FarmSupplyChain !== 'undefined';
  const syns = computeSynergies(s);
  if(farm){
    s.portfolio.businesses.forEach(b=>{
      FarmSupplyChain.applyToBusiness(b, syns, s, { supplyChainBuilderBonus: hasEdge(s,'supply_chain_builder') });
    });
  }
  return syns.map(y=>({
    key: synergyKey(y),
    label: y.label,
    flow: y.flow,
    strained: !!y.capacityStrained,
    saving: y.estimatedCostSaving || 0,
    lift: y.estimatedRevenueLift || y.estimatedSupplierLift || 0,
  }));
}

function enrichSynergyEstimates(s){
  const farm = modeCfg(s).farmTheme && typeof FarmSupplyChain !== 'undefined';
  if(!farm) return;
  const syns = computeSynergies(s);
  s.portfolio.businesses.forEach(b=>{
    FarmSupplyChain.applyToBusiness(b, syns, s, { supplyChainBuilderBonus: hasEdge(s,'supply_chain_builder') });
  });
}

function processSynergyChanges(beforeSnap, s){
  enrichSynergyEstimates(s);
  const afterSnap = captureSynergyState(s);
  const beforeMap = new Map(beforeSnap.map(x=>[x.key, x]));
  afterSnap.forEach(y=>{
    if(!beforeMap.has(y.key)){
      let detail = '';
      if(y.saving > 0) detail = ` — save ~${fmt(y.saving)}/qtr`;
      else if(y.lift > 0) detail = ` — lift ~${fmt(y.lift)}/qtr`;
      addLog(`⛓ Chain live: ${y.label}${y.flow?` (${y.flow})`:''}${detail}`, 'synergy');
    } else if(y.strained && !beforeMap.get(y.key).strained){
      addLog(`⚠ Capacity strain: ${y.label} — infrastructure stretched across too many links`, 'event');
    }
  });
  s._synergySnapshot = afterSnap;
}

function buildDealCloseReport(opp, offer, fin){
  const asking = opp.price || 0;
  const paid = offer.totalPrice ?? asking;
  const saved = asking - paid;
  return {
    name: opp.name,
    asking, paid, saved,
    savedPct: asking > 0 ? saved / asking : 0,
    cashAtClosing: fin.cashAtClosing ?? paid,
    financed: fin.financed ?? 0,
    loanLabel: fin.loanLabel || null,
    rate: fin.sellerNoteRate ?? null,
  };
}

function formatDealCloseLog(report, quality){
  const parts = [`Deal closed: ${report.name} — paid ${fmt(report.paid)} vs asking ${fmt(report.asking)}`];
  if(report.saved > 0) parts.push(`saved ${fmt(report.saved)} (${fmtPct(report.savedPct)})`);
  else if(report.saved < 0) parts.push(`${fmt(-report.saved)} over ask`);
  if(report.financed > 0){
    parts.push(`financed ${fmt(report.financed)} via ${report.loanLabel||'seller note'}${report.rate?` at ${fmtPct(report.rate)}/qtr`:''}`);
  } else {
    parts.push('all cash at closing');
  }
  if(quality != null) parts.push(`quality ${quality}/100`);
  return parts.join(' · ');
}

function portfolioStoryLine(s){
  const farm = modeCfg(s).farmTheme && typeof FarmSupplyChain !== 'undefined';
  if(farm){
    const owned = FarmSupplyChain.ownedIds(s);
    const nodes = FarmSupplyChain.portfolioNodes(s);
    if(!nodes.length) return 'Acquire an operating business or farm infrastructure to start building the supply chain.';
    let best = null;
    FarmSupplyChain.TEMPLATES.forEach(t=>{
      if(owned.has(t.id)) return;
      const wouldLink = FarmSupplyChain.CONNECTIONS.some(c=>
        (c.supplier===t.id && owned.has(c.customer)) || (c.customer===t.id && owned.has(c.supplier))
      );
      if(!wouldLink) return;
      const deps = (t.dependencyPartners||[]).filter(id=>!owned.has(id)).length;
      if(!best || deps < best.deps) best = { tmpl: t, deps };
    });
    if(best) return `You're one deal from a new link — ${best.tmpl.name} would connect to your current network.`;
    const infra = ['equipment_repair','delivery_cold_storage'].filter(id=>!owned.has(id));
    if(infra.length){
      const names = infra.map(id=>(FarmSupplyChain.templateById(id)||{}).name).filter(Boolean);
      return `Infrastructure gap: ${names.join(' or ')} grows like property and unlocks logistics/repair synergies.`;
    }
    const synCount = computeSynergies(s).length;
    if(synCount >= 4) return `${synCount} active chain links — prioritize improvements and urgent problems before the next shock.`;
    return 'Expand vertically (producer → processor → retail) or grab missing upstream dependencies.';
  }
  const biz = s.portfolio.businesses.length;
  const re = s.portfolio.realEstate.length;
  if(!biz && !re) return 'Acquire your first cash-flowing asset from Opportunities.';
  if(re > biz) return 'Property-heavy portfolio — quarterly appreciation and rent growth are your engine.';
  if(biz && !re) return 'Operating-heavy portfolio — Improve businesses to raise valuation; watch for level-up opportunities.';
  return 'Balance acquisitions, improvements, and financing before advancing the turn.';
}

function snapshotPeriodState(s){
  const run = computeQuarterlyRunRates(s, { mutate: false });
  return {
    turn: s.turn,
    cash: s.cash,
    netWorth: netWorth(s),
    debt: s.loans.reduce((a,l)=>a+l.principal, 0),
    revenue: run.revenue,
    costs: run.costs,
    debtService: run.debtService,
    costsPlusDebt: run.costsPlusDebt,
    profit: run.profit,
  };
}

function buildTurnDebrief(s, cf, opts){
  opts = opts || {};
  const before = opts.beforeSnap || snapshotPeriodState(s);
  const after = opts.afterSnap || snapshotPeriodState(s);
  const cashBefore = before.cash;
  const cashAfter = after.cash;
  const cashDelta = cashAfter - cashBefore;
  const nwBefore = before.netWorth;
  const nwAfter = after.netWorth;
  const nwDelta = nwAfter - nwBefore;
  const debtBefore = before.debt;
  const debtAfter = after.debt;
  const debtDelta = debtAfter - debtBefore;
  const revenueBefore = before.revenue;
  const revenueAfter = after.revenue;
  const costsDebtBefore = before.costsPlusDebt;
  const costsDebtAfter = after.costsPlusDebt;
  const profitRunBefore = before.profit;
  const profitRunAfter = after.profit;
  const highlights = [];
  if(opts.revalNotes && opts.revalNotes.count > 0){
    highlights.push(`Rent up 3% on ${opts.revalNotes.count} propert${opts.revalNotes.count===1?'y':'ies'}`);
    if(opts.revalNotes.avgAppreciation) highlights.push(`Property values +${fmtPct(opts.revalNotes.avgAppreciation)} avg`);
  }
  const synCount = computeSynergies(s).length;
  if(synCount > 0) highlights.push(`${synCount} active chain link${synCount===1?'':'s'}`);
  if(opts.strainAlerts && opts.strainAlerts.length){
    highlights.push(`${opts.strainAlerts.length} link${opts.strainAlerts.length===1?'':'s'} under capacity strain`);
  }
  if(opts.marketEvent) highlights.push(`Market: ${opts.marketEvent.label}`);
  let summary = cf.netCashFlow >= 0
    ? `This quarter added ${fmt(cf.netCashFlow)} to cash after operations and debt service.`
    : `This quarter drained ${fmt(-cf.netCashFlow)} from cash — watch liquidity.`;
  if(profitRunAfter > profitRunBefore + 100){
    summary += ` Ongoing run-rate profit rose from ${fmt(profitRunBefore)} to ${fmt(profitRunAfter)}/qtr.`;
  } else if(profitRunAfter < profitRunBefore - 100){
    summary += ` Ongoing run-rate profit fell from ${fmt(profitRunBefore)} to ${fmt(profitRunAfter)}/qtr — debt or costs may be catching up.`;
  }
  if(nwDelta > 500) summary = `Net worth grew ${fmt(nwDelta)} this turn. ${summary}`;
  else if(nwDelta < -500) summary = `Net worth fell ${fmt(-nwDelta)} this turn. ${summary}`;
  return {
    turnClosed: s.turn,
    netCashFlow: cf.netCashFlow,
    profitQuarterClosed: cf.netCashFlow,
    revenueTotal: cf.revenueTotal,
    costTotal: cf.costTotal,
    debtService: cf.debtService,
    revenueBefore, revenueAfter, revenueDelta: revenueAfter - revenueBefore,
    costsDebtBefore, costsDebtAfter, costsDebtDelta: costsDebtAfter - costsDebtBefore,
    profitRunBefore, profitRunAfter, profitRunDelta: profitRunAfter - profitRunBefore,
    nwBefore, nwAfter, nwDelta,
    cashBefore, cashAfter, cashDelta,
    debtBefore, debtAfter, debtDelta,
    highlights,
    summary,
    marketEvent: opts.marketEvent || null,
  };
}

function debriefDeltaClass(delta, invert){
  if(Math.abs(delta) < 1) return 'neutral';
  const good = invert ? delta < 0 : delta > 0;
  return good ? 'up' : 'down';
}

function debriefDeltaText(delta){
  if(Math.abs(delta) < 1) return '—';
  return (delta >= 0 ? '+' : '') + fmt(delta);
}

function renderDebriefCompareRow(label, before, after, invert){
  const delta = after - before;
  return `<tr>
    <td class="metric">${label}</td>
    <td>${fmt(before)}</td>
    <td>${fmt(after)}</td>
    <td class="delta ${debriefDeltaClass(delta, invert)}">${debriefDeltaText(delta)}</td>
  </tr>`;
}

function revalueAssets(s){
  // Businesses intentionally do NOT re-value automatically — valuation only moves when the
  // player takes an Improve action. This keeps the appreciation signal tied to player decisions.
  let count = 0;
  let appreciationSum = 0;
  s.portfolio.realEstate.forEach(r=>{
    const appreciation = clamp(rnd(0.05, 0.10) - r.vacancyRisk*0.03, 0.03, 0.10);
    r.valuation = Math.round(r.valuation * (1 + appreciation));
    r.rentPerTurn = Math.round(r.rentPerTurn * 1.03);
    count += 1;
    appreciationSum += appreciation;
  });
  return {
    count,
    avgAppreciation: count ? appreciationSum / count : 0,
  };
}

function payoffLoan(loanId){
  const l = S.loans.find(x=>x.id===loanId);
  if(!l) return;
  if(S.cash < l.principal){ addLog(`Not enough cash to pay off ${l.label} (need ${fmt(l.principal)}).`); render(); return; }
  const remainingInterest = Math.max(0, l.paymentPerTurn*l.turnsRemaining - l.principal);
  S.cash -= l.principal;
  S.loans = S.loans.filter(x=>x.id!==loanId);
  addLog(`Paid off ${l.label} early for ${fmt(l.principal)} — saved ${fmt(remainingInterest)} in future interest.`);
  render();
}

function finalizeBusinessPurchase(o, offer){
  const b = {

    equipmentCondition:o.equipmentCondition, custConc:o.custConc, industry:o.industry,
    layer:o.layer||null, riskTags:o.riskTags||[], dependencyPartners:o.dependencyPartners||[],
    inputTags:o.inputTags, outputTags:o.outputTags, capabilityTags:o.capabilityTags,

    clientHealth:72, supplierHealth:72, clientCooldown:0, supplierCooldown:0, crisisMult:1,

  };
  b.valuation = valuateBusiness(b);
  if(hasEdge(S,'contrarian') && S.marketState.sectorMomentum[o.industry]==='negative') b.valuation = Math.round(b.valuation*1.10);
  b.baselineValuation = b.valuation;
  S.portfolio.businesses.push(b);

function finalizeRealEstatePurchase(o, offer){
  const r = {
    id: uid(), templateId:o.templateId, name:o.name,
    rentPerTurn:o.rent, operatingExpenses: Math.round(o.rent*o.opexPct), vacancyRisk:o.vacancyRisk,
    industry:o.industry||null, layer:o.layer||null,
    inputTags:o.inputTags||null, outputTags:o.outputTags||null,

  };
  r.valuation = Math.round(o.price*rnd(0.98,1.05));

// Default seller-note rate when a deal closes with an unfinanced gap — deliberately higher than a
// pre-arranged bank line of credit, so securing financing before negotiating is the better play.
function sellerNoteRate(s){
  const cfg = modeCfg(s);
  return clamp(0.12 - (hasEdge(s,'seller_financing_specialist')?0.015:0) + cfg.rateAdj + reputationFinancingAdj(s), 0.03, 0.16);
}

function settleAcquisitionFinance(askPrice, offer, kind){
  const totalPrice = offer.totalPrice || askPrice;
  const cashAtClosing = Math.min(S.cash, offer.cashAtClosing ?? totalPrice);
  S.cash -= cashAtClosing;
  const financed = Math.max(0, totalPrice - cashAtClosing);
  let rate = null;
  let label = null;
  if(financed>0){
    rate = sellerNoteRate(S);
    const terms = computeLoanTerms(financed, rate, 8);
    label = kind==='levelup' ? 'Expansion Financing' : `Seller Note (${kind})`;
    S.loans.push({ id:uid(), label, type:kind, principal:Math.round(financed),
      rate, principalPerTurn: terms.principalPerTurn, paymentPerTurn: terms.paymentPerTurn, turnsRemaining:8 });
  }
  S.reputation += hasEdge(S,'relationship_capital') ? 3 : 2;
  return {
    askingPrice: askPrice,
    totalPrice,
    cashAtClosing,
    financed,
    sellerNoteRate: rate,
    loanLabel: label,
  };
}

// ---------------- TURN ADVANCE ----------------
function advanceTurn(){
  if(S.negotiation){ addLog('Close the current negotiation before advancing.'); render(); return; }

  resolveUncontestedRivalContests(S);

  if(S.urgentProblems.length){
    const repLoss = S.urgentProblems.length * 2;
    S.reputation = Math.max(0, S.reputation - repLoss);
    addLog(`${S.urgentProblems.length} urgent issue(s) left unresolved — reputation −${repLoss}.`, 'event');
  }

  const beforeSnap = S.periodSnapshot || snapshotPeriodState(S);
  const prevSynergySnap = S._synergySnapshot || [];

  const cf = resolveCashFlow(S);
  const ev = maybeTriggerMarketEvent(S);
  if(ev){
    trackRunShock(S, ev, ev.affectedCount ? 2.5 : 1);
    addLog(`Market event — ${ev.label}: ${ev.note}`, 'event');
  }

  resolveMarketUpdate(S);
  const revalNotes = revalueAssets(S);
  const afterSnap = snapshotPeriodState(S);

  enrichSynergyEstimates(S);
  const currSynergySnap = captureSynergyState(S);
  const strainAlerts = currSynergySnap.filter(y=> y.strained && !(prevSynergySnap.find(p=>p.key===y.key && p.strained)));
  strainAlerts.forEach(y=>{
    addLog(`⚠ Capacity strain: ${y.label} — infrastructure stretched across too many links`, 'event');
  });

  S.lastAdvanceReport = buildTurnDebrief(S, cf, {
    beforeSnap, afterSnap, revalNotes, strainAlerts, marketEvent: ev,
  });
  S.periodSnapshot = afterSnap;
  S.pendingTurnDebriefModal = S.lastAdvanceReport;
  S.debriefExpanded = false;
  S._synergySnapshot = currSynergySnap;

  // insolvency check
  const availableCredit = S.reputation*1500*(modeCfg(S).tierScaleOn?1.6:1);
  if(S.cash < 0 && Math.abs(S.cash) > availableCredit){
    S.gameOver = { result:'loss', reason:'insolvency' };
    screen='report'; render(); return;
  }

  const milestone = checkMilestone(S);
  if(milestone){
    S.pendingMilestoneFanfare = milestone;
    addLog(`Milestone reached: ${milestone.name}. ${milestone.pressure}`, 'milestone');
    S.edgeChoicesPending = shuffleCopy(STRATEGIC_EDGES.filter(e=>!S.strategicEdges.includes(e.id))).slice(0,3);
  }

  S.turn += 1;
  S.actionPoints = maxActionPoints(S);

  if(S.turn > S.maxTurns){
    S.gameOver = { result: netWorth(S)>=10000000 ? 'win':'timeout', reason:'turn_limit' };
    screen='report'; render(); return;
  }
  if(netWorth(S) >= 10000000){
    S.gameOver = { result:'win', reason:'target_reached' };
    screen='report'; render(); return;
  }

  // Decrement/filter survivors from the outgoing list first, before generating anything new.
  const survivors = S.opportunities.filter(o=>{ o.expiresIn -= 1; return o.expiresIn>0 && o.assetType!=='security'; });
  const survivingLevelUps = survivors.filter(o=>o.assetType==='levelup');
  const survivingRegular = survivors.filter(o=>o.assetType!=='levelup');

  const freshBatch = generateOpportunities(S);
  const freshLevelUps = freshBatch.filter(o=>o.assetType==='levelup');
  let freshRegular = freshBatch.filter(o=>o.assetType!=='levelup');
  const wildcard = maybeTriggerWildcard(S);
  if(wildcard) freshRegular = [wildcard].concat(freshRegular);

  // Survivors get priority over fresh rolls for the capped regular slots, so an opportunity already
  // in progress can't get silently bumped by a brand-new random one. Level-ups are never capped —
  // once eligible, they persist until acted on or truly expired.
  const regularCombined = survivingRegular.concat(freshRegular).slice(0,6);
  S.opportunities = regularCombined.concat(survivingLevelUps).concat(freshLevelUps);

  if(modeCfg(S).farmTheme && typeof RivalFarmer !== 'undefined'){
    const contest = RivalFarmer.applyContestToTurn(S, S.opportunities);
    if(contest) addLog(RivalFarmer.contestLogLine(contest.opp), 'event');
  }

  updateRelationshipHealth(S);
  S.urgentProblems = generateUrgentProblems(S);
  snapshotTurn(S, cf);
  render();
}

function snapshotTurn(s, cf){
  s.turnHistory.push({
    turn:s.turn, cash:s.cash, netWorth:netWorth(s),
    debt:s.loans.reduce((a,l)=>a+l.principal,0),
    revenue:cf.revenueTotal||0, costs:cf.costTotal||0,
  });
}

// ---------------- STRATEGIC EDGE CHOICE (post-milestone) ----------------
function renderEdgeChoiceModal(){
  if(!S.edgeChoicesPending) return '';
  return `<div class="modal-backdrop"><div class="modal">
    <h2>New Strategic Edge Available</h2>
    <div class="sub">Choose one to add to your active build</div>
    <div class="edge-grid" style="grid-template-columns:1fr;">
      ${S.edgeChoicesPending.map(e=>`
        <div class="edge-card" onclick="chooseNewEdge('${e.id}')">
          <div class="build-tag">${e.build}</div><h4>${e.name}</h4><p>${e.effect}</p>
        </div>`).join('')}
    </div>
    <button class="mini-btn" style="margin-top:10px" onclick="S.edgeChoicesPending=null; render();">Skip</button>
  </div></div>`;
}
function chooseNewEdge(id){ S.strategicEdges.push(id); S.edgeChoicesPending=null; addLog(`New Strategic Edge acquired: ${STRATEGIC_EDGES.find(e=>e.id===id).name}.`); render(); }

// ---------------- GRAPH ----------------
function drawGraph(){
  const ctx = document.getElementById('graphCanvas');
  if(!ctx) return;
  const hist = S.turnHistory;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels: hist.map(h=>'T'+h.turn),
      datasets:[
        { label:'Net Worth', data:hist.map(h=>h.netWorth), borderColor:'#c79a3a', backgroundColor:'transparent', tension:0.25 },
        { label:'Cash', data:hist.map(h=>h.cash), borderColor:'#7fbf9e', backgroundColor:'transparent', tension:0.25 },
        { label:'Debt', data:hist.map(h=>h.debt), borderColor:'#a1483a', backgroundColor:'transparent', tension:0.25 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'#a9a08a', font:{size:10} } } },
      scales:{
        x:{ ticks:{ color:'#6b7686', font:{size:9} }, grid:{ color:'#1e2833' } },
        y:{ ticks:{ color:'#6b7686', font:{size:9}, callback:(v)=>'$'+(v/1000)+'k' }, grid:{ color:'#1e2833' } },
      }
    }
  });
}

function renderModal(){
  const m = document.getElementById('modalRoot');
  let html = '';
  if(S.negotiation){ html = renderNegotiationModal(); }
  else if(S.pendingTurnDebriefModal){ html = renderTurnDebriefModal(S.pendingTurnDebriefModal); }
  else if(S.edgeChoicesPending){ html = renderEdgeChoiceModal(); }
  if(fieldGuideOpen){ html += renderFieldGuideModal(); }
  m.innerHTML = html;
}
// ============ END-OF-RUN REPORT ============

function renderReport(){
  const nw = netWorth(S);
  const go = S.gameOver;
  const title = go.result==='win' ? 'Target Reached' : go.reason==='insolvency' ? 'Insolvency' : 'Run Complete';
  const extras = buildRunReportExtras(S);
  const avgQuality = S.contracts.length ? Math.round(S.contracts.reduce((a,c)=>a+c.quality,0)/S.contracts.length) : null;
  const bestTurn = bestAndWorstTurn();
  const repT = reputationTier(S);

  root().innerHTML = `
  <div class="report-screen">
    <div class="report-card">
      <span class="stamp">${title}</span>
      <h1 style="margin-top:14px">${fmt(nw)} net worth</h1>
      <p style="color:#544c38;">Turn ${Math.min(S.turn,S.maxTurns)} of ${S.maxTurns} · Reputation ${Math.round(S.reputation)} (${repT.label})</p>

      <div class="stat-grid">
        <div class="stat-box"><div class="lbl">Cash</div><div class="val">${fmt(S.cash)}</div></div>
        <div class="stat-box"><div class="lbl">Debt</div><div class="val">${fmt(S.loans.reduce((a,l)=>a+l.principal,0))}</div></div>
        <div class="stat-box"><div class="lbl">Liquidity Ratio</div><div class="val">${liquidityRatio(S).toFixed(2)}x</div></div>
        <div class="stat-box"><div class="lbl">Businesses</div><div class="val">${S.portfolio.businesses.length}</div></div>
        <div class="stat-box"><div class="lbl">Real Estate</div><div class="val">${S.portfolio.realEstate.length}</div></div>
        <div class="stat-box"><div class="lbl">Securities</div><div class="val">${S.portfolio.securities.length}</div></div>
      </div>

      <h3 style="font-family:var(--serif);margin-top:10px;">Dominant Strategy</h3>
      <div class="report-highlight">
        <strong>${extras.dominant}</strong>
        <div class="report-oneliner">${extras.oneLiner}</div>
      </div>

      ${extras.chain ? `<h3 style="font-family:var(--serif);">Strongest Chain</h3><p>${extras.chain}</p>` : ''}

      ${extras.bestDeal ? `<h3 style="font-family:var(--serif);">Best Deal</h3><div class="report-highlight">${extras.bestDeal.name} — quality ${extras.bestDeal.quality}/100${extras.bestDeal.savings>0?`, saved ${fmt(extras.bestDeal.savings)} vs asking`:''} (Turn ${extras.bestDeal.turn})</div>` : ''}

      ${extras.worstShock ? `<h3 style="font-family:var(--serif);">Worst Shock</h3><div class="report-highlight">${extras.worstShock.label} (Turn ${extras.worstShock.turn}) — ${extras.worstShock.note}</div>` : ''}

      ${extras.wildcard ? `<h3 style="font-family:var(--serif);">Wildcard Event</h3><p>${extras.wildcard.label} on Turn ${extras.wildcard.turn}: ${extras.wildcard.name}</p>` : ''}

      ${avgQuality!=null ? `<h3 style="font-family:var(--serif);">Negotiation Performance</h3><p>Average deal quality across ${S.contracts.length} negotiated deal(s): <strong>${avgQuality}/100</strong>.</p>` : ''}

      ${bestTurn ? `<h3 style="font-family:var(--serif);">Best Capital-Allocation Moment</h3><p>${bestTurn}</p>` : ''}

      <h3 style="font-family:var(--serif);">Strategic Edges Used</h3>
      <p>${S.strategicEdges.map(id=>STRATEGIC_EDGES.find(e=>e.id===id).name).join(', ') || 'None'}</p>

      <div class="graph-wrap" style="margin-top:20px;"><canvas id="reportGraph" height="200"></canvas></div>

      <button class="big-btn" style="margin-top:20px" onclick="restartGame()">Start a New Run →</button>
    </div>
  </div>`;

  const ctx = document.getElementById('reportGraph');
  new Chart(ctx, {
    type:'line',
    data:{ labels:S.turnHistory.map(h=>'T'+h.turn), datasets:[
      { label:'Net Worth', data:S.turnHistory.map(h=>h.netWorth), borderColor:'#c79a3a', backgroundColor:'transparent' },
      { label:'Cash', data:S.turnHistory.map(h=>h.cash), borderColor:'#2f6a52', backgroundColor:'transparent' },
      { label:'Debt', data:S.turnHistory.map(h=>h.debt), borderColor:'#a1483a', backgroundColor:'transparent' },
    ]},
    options:{ responsive:true, plugins:{legend:{labels:{color:'#544c38'}}},
      scales:{ x:{ticks:{color:'#544c38'}}, y:{ticks:{color:'#544c38', callback:v=>'$'+(v/1000)+'k'}} } }
  });
}

function computeDominantStrategy(){
  if(modeCfg(S).farmTheme && typeof FarmSupplyChain !== 'undefined' && FarmSupplyChain.portfolioNodes(S).length){
    return FarmSupplyChain.classifyStrategy(S);
  }
  const synergyCount = S.portfolio.businesses.reduce((a,b)=>a+(b.activeSynergies||[]).length,0);
  const reCount = S.portfolio.realEstate.length;
  const secCount = S.portfolio.securities.length;
  if(synergyCount>=2) return 'Vertical/horizontal integrator — you built connected supply chains that lowered costs across multiple businesses.';
  if(reCount > S.portfolio.businesses.length) return 'Real estate-weighted portfolio — you favored leveraged, stable cash-flowing property over operating businesses.';
  if(secCount > S.portfolio.businesses.length + reCount) return 'Liquid-market investor — you leaned on public securities for diversification over illiquid private deals.';
  if(S.loans.reduce((a,l)=>a+l.principal,0) > S.cash*2) return 'Leveraged operator — you financed growth aggressively with seller notes and credit.';
  return 'Balanced operator — a mix of private acquisitions, moderate leverage, and opportunistic deals.';
}

function bestAndWorstTurn(){
  if(S.turnHistory.length<2) return null;
  let best = S.turnHistory[1], bestDelta = -Infinity;
  for(let i=1;i<S.turnHistory.length;i++){
    const delta = S.turnHistory[i].netWorth - S.turnHistory[i-1].netWorth;
    if(delta>bestDelta){ bestDelta = delta; best = S.turnHistory[i]; }
  }
  if(bestDelta<=0) return null;
  return `Turn ${best.turn} produced the largest single-turn net-worth gain: +${fmt(bestDelta)}.`;
}

function restartGame(){
  S = null; screen='setup'; selectedEdge=null; selectedMode=null; setupEdgePool=null; render();
}

document.addEventListener('DOMContentLoaded', function(){ render(); });
</script>
