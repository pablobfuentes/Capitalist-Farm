<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EconomyGame — MVP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --ink: #12181f;
  --ink-soft: #1a2430;
  --panel: #e9e2cf;
  --panel-line: #c7bb9c;
  --panel-dim: #d9cfb4;
  --brass: #c79a3a;
  --brass-dim: #8a6f2b;
  --forest: #2f6a52;
  --brick: #a1483a;
  --text-light: #efe9d8;
  --text-dim: #a9a08a;
  --text-dark: #201c14;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Fraunces', serif;
  --sans: 'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text-light);font-family:var(--sans);}
body{font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--sans);cursor:pointer;}
::selection{background:var(--brass);color:var(--text-dark);}

#app{display:flex;flex-direction:column;min-height:100vh;}

.setup-screen{max-width:760px;margin:0 auto;padding:60px 24px;}
.setup-title{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:-0.01em;color:var(--brass);margin:0 0 4px;}
.setup-sub{font-family:var(--mono);color:var(--text-dim);font-size:13px;margin-bottom:32px;letter-spacing:0.04em;text-transform:uppercase;}
.setup-card{background:var(--panel);color:var(--text-dark);border-radius:2px;padding:28px;margin-bottom:20px;position:relative;}
.setup-card h3{font-family:var(--serif);margin:0 0 10px;font-size:20px;}
.setup-card p{margin:0;line-height:1.55;color:#4a4331;}
.edge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;}
.edge-card{border:1px solid var(--panel-line);padding:16px;border-radius:2px;cursor:pointer;transition:all .15s ease;background:#f2ecdc;}
.edge-card:hover{border-color:var(--brass);transform:translateY(-2px);}
.edge-card.selected{border-color:var(--brass);background:#f7edd2;box-shadow:0 0 0 2px var(--brass);}
.edge-card h4{margin:0 0 6px;font-family:var(--serif);font-size:16px;}
.edge-card .build-tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass-dim);}
.edge-card p{font-size:12.5px;color:#544c38;margin-top:8px;}
.big-btn{background:var(--brass);color:var(--text-dark);border:none;padding:14px 26px;font-family:var(--serif);font-weight:600;font-size:16px;border-radius:2px;letter-spacing:.02em;}
.big-btn:disabled{opacity:.4;cursor:not-allowed;}
.big-btn:hover:not(:disabled){background:#d6ab48;}

/* ---- Top status ledger bar ---- */
.status-bar{display:flex;align-items:stretch;background:var(--ink-soft);border-bottom:2px solid var(--brass-dim);padding:0 18px;position:sticky;top:0;z-index:20;}
.status-item{padding:12px 18px;border-right:1px solid #2a3644;font-family:var(--mono);}
.status-item:last-child{border-right:none;}
.status-label{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px;}
.status-value{font-size:16px;font-weight:600;color:var(--text-light);}
.status-value.money{color:var(--brass);}
.status-value.debt{color:var(--brick);}
.status-value.good{color:#7fbf9e;}
.turn-badge{margin-left:auto;display:flex;align-items:center;font-family:var(--serif);font-size:18px;color:var(--brass);padding:0 10px;}

/* ---- Layout ---- */
.game-shell{display:flex;flex-direction:column;height:100vh;max-height:100vh;overflow:hidden;width:100%;}
.game-layout{display:grid;grid-template-columns:260px 1fr 320px;gap:0;flex:1;min-height:0;overflow:hidden;}
.panel{padding:16px;overflow-y:auto;height:100%;}
.panel-left{background:var(--ink-soft);border-right:1px solid #263243;}
.panel-center{background:var(--ink);}
.panel-right{background:var(--ink-soft);border-left:1px solid #263243;}
.panel h2{font-family:var(--serif);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin:0 0 12px;border-bottom:1px solid #2a3644;padding-bottom:8px;}

.asset-row{background:#20293480;border:1px solid #2a3644;border-radius:2px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.asset-row .name{font-weight:600;color:var(--text-light);margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.asset-row .meta{color:var(--text-dim);font-family:var(--mono);font-size:11px;}
.change-indicator{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;}
.change-indicator.up{color:#7fbf9e;background:#2f6a5226;}
.change-indicator.down{color:#e29a8f;background:#a1483a26;}
.qty-input{width:64px;padding:6px;font-family:var(--mono);font-size:12px;border:1px solid var(--panel-line);border-radius:2px;background:#fff;color:var(--text-dark);}
.loan-detail{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);line-height:1.6;margin-top:4px;}
.improve-cost-line{font-family:var(--mono);font-size:12px;color:var(--brass);margin-bottom:8px;}
.save-tag{color:#7fbf9e;font-family:var(--mono);font-size:10.5px;}
.synergy-tag{display:inline-block;background:#2f6a5233;color:#8fd6b3;border:1px solid #2f6a5266;font-size:10px;padding:1px 6px;border-radius:8px;margin-top:5px;margin-right:4px;font-family:var(--mono);}
.level-badge{display:inline-block;background:var(--brass);color:var(--text-dark);font-size:10px;padding:1px 7px;border-radius:8px;font-family:var(--mono);font-weight:700;letter-spacing:.03em;}
.level-up-card{border:2px solid var(--brass);background:#f4ecd6;}
.risk-tag{display:inline-block;background:#a1483a26;color:#e29a8f;border:1px solid #a1483a55;font-size:10px;padding:1px 6px;border-radius:8px;margin-top:5px;margin-right:4px;font-family:var(--mono);}
.rel-state-stable{color:#7fbf9e;}
.rel-state-strained{color:#e0c265;}
.rel-state-at_risk{color:#e29a8f;}

.log-entry{border-left:2px solid var(--brass-dim);padding:8px 12px;margin-bottom:10px;background:#171f27;font-size:13px;line-height:1.5;}
.log-entry.event{border-left-color:var(--brick);}
.log-entry.milestone{border-left-color:var(--brass);background:#2a2312;}

.opp-card{background:var(--panel);color:var(--text-dark);border-radius:2px;padding:14px 16px;margin-bottom:12px;}
.opp-card .opp-head{display:flex;justify-content:space-between;align-items:baseline;}
.opp-card h3{font-family:var(--serif);font-size:16px;margin:0;}
.opp-card .exp{font-family:var(--mono);font-size:10.5px;color:var(--brick);text-transform:uppercase;}
.opp-card .exp-urgent{color:#fff;background:var(--brick);padding:2px 8px;border-radius:2px;font-weight:600;letter-spacing:.04em;}
.opp-card .exp-soon{color:#c45a2a;font-weight:600;}
.opp-card.chain-hint-card{border:2px solid var(--forest);}
.opp-card.starter-deal-card{border:2px solid var(--brass);}
.action-priority-hint{font-family:var(--mono);font-size:11px;color:#8fd6b3;margin-left:12px;max-width:420px;line-height:1.45;}
.opp-card.wildcard-card{border:2px solid #8a4b2a;background:#faf6ee;}
.opp-card.rival-contest-card{border:2px solid #7a3a8a;background:#faf5fc;}
.chat-msg.rival .who{color:#7a3a8a;}
.rival-bid-bar{font-family:var(--mono);font-size:11px;background:#f0e8f5;border:1px solid #7a3a8a;border-radius:2px;padding:8px 10px;margin-bottom:10px;line-height:1.55;}
.rival-identity{font-family:var(--mono);font-size:11px;color:#5a3a6a;margin-bottom:10px;padding:8px 10px;background:#f7f0fa;border:1px dashed #7a3a8a;border-radius:2px;}
.contest-compare{font-family:var(--mono);font-size:11px;background:#f8f4ef;border:1px solid var(--panel-line);border-radius:2px;padding:8px 10px;margin-bottom:10px;}
.contest-compare-head{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-bottom:6px;}
.contest-compare-table{width:100%;border-collapse:collapse;font-size:11px;}
.contest-compare-table th,.contest-compare-table td{padding:4px 6px;text-align:left;border-bottom:1px dashed #ddd5c4;}
.contest-compare-table th{font-size:10px;text-transform:uppercase;color:var(--text-dim);font-weight:600;}
.contest-compare-table .pkg-label{color:#5a5341;width:28%;}
.contest-compare-table .pkg-you{color:var(--forest);}
.contest-compare-table .pkg-rival{color:#7a3a8a;}
.contest-compare-table .pkg-better{font-weight:600;}
.listing-facts-bar{font-family:var(--mono);font-size:10.5px;background:#eef3ea;border:1px solid #8aab7a;border-radius:2px;padding:6px 10px;margin-bottom:10px;color:#3a4a32;}
.listing-facts-note{color:#6b7a62;font-style:italic;}
.season-badge{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8fd6b3;background:#1a2e28;padding:3px 8px;border-radius:2px;}
.rep-tier{font-family:var(--mono);font-size:10px;color:#c79a3a;margin-left:4px;}
.npc-compact{font-family:var(--mono);font-size:11px;color:#8fd6b3;margin-top:6px;}
.contact-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #2a3644;font-size:12px;}
.contact-row:last-child{border-bottom:none;}
.contact-emoji{font-size:18px;line-height:1;}
.contact-meta{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:2px;}
.report-highlight{background:#f2ecdc;border:1px solid var(--panel-line);border-radius:2px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.55;}
.report-oneliner{font-style:italic;color:#544c38;margin-top:4px;}
.opp-card .facts{font-family:var(--mono);font-size:12px;color:#4a4331;margin:8px 0;line-height:1.6;}
.opp-card .blurb{font-size:12.5px;color:#5a5341;font-style:italic;margin-bottom:10px;}
.opp-actions{display:flex;gap:8px;flex-wrap:wrap;}
.mini-btn{background:transparent;border:1px solid var(--text-dark);color:var(--text-dark);padding:6px 12px;font-size:12px;border-radius:2px;font-family:var(--mono);}
.mini-btn:hover{background:var(--text-dark);color:var(--panel);}
.mini-btn.primary{background:var(--brick);border-color:var(--brick);color:#fff;}
.mini-btn.primary:hover{background:#8a3a2f;}
.mini-btn:disabled{opacity:.35;cursor:not-allowed;}
.buy-now-btn{border-color:var(--brass-dim);color:#6b5a20;}
.buy-now-btn:hover{background:var(--brass);border-color:var(--brass);color:var(--text-dark);}
.buy-now-note{font-family:var(--mono);font-size:10px;color:#8a7d5e;margin-top:6px;font-style:italic;}

.urgent-card{background:#3a2420;border:1px solid var(--brick);border-radius:2px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
.urgent-card .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:#e29a8f;letter-spacing:.05em;}
.stake-line{font-family:var(--mono);font-size:11.5px;color:#e0a86f;margin-top:6px;padding-top:6px;border-top:1px dashed #5a3530;}

.ap-bar-footer{flex-shrink:0;z-index:30;background:var(--ink-soft);}
.ap-bar{display:flex;align-items:center;gap:10px;background:var(--ink-soft);border-top:2px solid var(--brass-dim);padding:12px 18px;box-shadow:0 -6px 24px rgba(0,0,0,.4);}
.ap-dot{width:14px;height:14px;border-radius:50%;background:#2a3644;border:1px solid var(--brass-dim);}
.ap-dot.filled{background:var(--brass);}
.advance-btn{margin-left:auto;background:var(--brass);color:var(--text-dark);border:none;padding:10px 22px;font-family:var(--serif);font-weight:600;font-size:14px;border-radius:2px;}
.advance-btn:hover{background:#d6ab48;}
.hold-btn{background:transparent;border:1px solid var(--text-dim);color:var(--text-dim);padding:10px 16px;border-radius:2px;font-family:var(--mono);font-size:12px;}
.hint-btn{background:transparent;border:1px solid var(--brass-dim);color:var(--brass);padding:10px 14px;border-radius:2px;font-family:var(--mono);font-size:12px;cursor:pointer;}
.hint-btn:hover{background:rgba(199,154,58,.12);}
.field-guide-backdrop{position:fixed;inset:0;background:rgba(10,14,18,.82);display:flex;align-items:center;justify-content:center;z-index:110;}
.field-guide-modal{background:var(--panel);color:var(--text-dark);width:640px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;border-radius:3px;box-shadow:0 12px 40px rgba(0,0,0,.45);}
.field-guide-head{padding:20px 24px 12px;border-bottom:1px solid var(--panel-line);flex-shrink:0;}
.field-guide-head h2{font-family:var(--serif);margin:0 0 4px;font-size:22px;}
.field-guide-head .fg-sub{font-family:var(--mono);font-size:10.5px;color:#6b6248;text-transform:uppercase;letter-spacing:.05em;}
.field-guide-body{padding:20px 24px;overflow-y:auto;flex:1;min-height:200px;}
.field-guide-body h3{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--text-dark);}
.field-guide-body p,.field-guide-body li{font-size:13px;line-height:1.6;color:#3a3428;}
.field-guide-body ul{margin:8px 0 12px;padding-left:20px;}
.field-guide-body li{margin-bottom:6px;}
.fg-lead{font-size:14px;line-height:1.65;color:#544c38;margin-bottom:14px;}
.fg-section-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--forest);font-weight:600;margin:14px 0 6px;}
.fg-callout{background:#eef3ea;border-left:3px solid var(--forest);padding:10px 12px;margin:12px 0;font-size:12.5px;line-height:1.55;color:#33402f;border-radius:0 2px 2px 0;}
.fg-callout em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:#1f5c3d;}
.fg-ratio-table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12px;}
.fg-ratio-table th,.fg-ratio-table td{border:1px solid var(--panel-line);padding:7px 10px;text-align:left;}
.fg-ratio-table th{background:#f2ecdc;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:#6b6248;}
.fg-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.fg-tag{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px;background:#f2ecdc;border:1px solid var(--panel-line);color:#544c38;}
.fg-checklist{list-style:none;padding:0;margin:10px 0;}
.fg-checklist li{padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed #e3dcc2;}
.fg-checklist li:before{content:'?';position:absolute;left:0;font-family:var(--mono);font-size:11px;color:var(--brass-dim);}
.field-guide-foot{padding:14px 24px 18px;border-top:1px solid var(--panel-line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.fg-page-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;flex:1;}
.fg-dot{width:7px;height:7px;border-radius:50%;background:#d4cbb0;border:none;padding:0;cursor:pointer;}
.fg-dot.active{background:var(--brass);}
.fg-nav{display:flex;gap:8px;}

/* graph */
.graph-wrap{background:#0d1319;border:1px solid #263243;border-radius:2px;padding:10px;margin-bottom:16px;}
.overlay-toggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.overlay-toggle{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #2a3644;background:transparent;color:var(--text-dim);}
.overlay-toggle.active{background:var(--brass);color:var(--text-dark);border-color:var(--brass);}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,18,.75);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--panel);color:var(--text-dark);width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;border-radius:3px;padding:24px;}
.modal h2{font-family:var(--serif);margin:0 0 4px;font-size:20px;}
.modal .sub{font-family:var(--mono);font-size:11px;color:#6b6248;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;}
.chat-log{max-height:260px;overflow-y:auto;background:#f2ecdc;border:1px solid var(--panel-line);border-radius:2px;padding:10px;margin-bottom:12px;}
.intel-box{background:#eef3ea;border:1px solid var(--forest);border-radius:2px;padding:10px 14px;margin-bottom:14px;}
.intel-box.locked{background:#f2ede2;border:1px dashed var(--brass-dim);}
.intel-title{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--forest);margin-bottom:6px;font-weight:600;}
.intel-box.locked .intel-title{color:var(--brass-dim);}
.intel-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55;color:#33402f;}
.intel-list li{margin-bottom:5px;}
.intel-locked-text{margin:0;font-size:12.5px;color:#6b6248;font-style:italic;}
.chat-msg{margin-bottom:10px;font-size:13px;line-height:1.5;}
.chat-msg .who{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass-dim);display:block;margin-bottom:2px;}
.chat-msg.player{text-align:right;}
.chat-msg.player .who{color:var(--forest);}
.chat-msg.system{opacity:.85;font-style:italic;}
.chat-msg.system .who{color:#8a4b2a;}
.npc-identity{background:#f2ecdc;border:1px solid var(--panel-line);border-radius:2px;padding:10px 12px;margin-bottom:12px;}
.npc-identity-main{display:flex;gap:10px;align-items:flex-start;}
.npc-emoji{font-size:28px;line-height:1;}
.npc-name{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text-dark);}
.npc-meta{font-family:var(--mono);font-size:10.5px;color:#6b6248;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.npc-desc{font-size:12.5px;color:#544c38;margin-top:4px;font-style:italic;}
.npc-arch{font-size:11.5px;color:#6b5a20;margin-top:4px;line-height:1.4;}
.npc-rel{font-family:var(--mono);font-size:11px;color:#6b6248;margin-top:8px;padding-top:6px;border-top:1px dashed var(--panel-line);}
.ai-status-pill{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:2px;margin-left:auto;white-space:nowrap;}
.ai-status-pill.ai-online{background:#e8f2ec;color:var(--forest);border:1px solid var(--forest);}
.ai-status-pill.ai-checking{background:#f2ecdc;color:#6b6248;border:1px dashed var(--brass-dim);}
.ai-status-pill.ai-offline{background:#3a2420;color:#e29a8f;border:1px solid var(--brick);}
.modal-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.ai-setup-note{font-family:var(--mono);font-size:11px;color:#6b6248;background:#f2ecdc;border:1px dashed var(--brass-dim);padding:10px 12px;margin-bottom:14px;line-height:1.55;}
.ai-setup-note code{font-size:10.5px;}
.offer-box{background:#e3dcc2;border:1px dashed var(--brass-dim);padding:8px 10px;font-family:var(--mono);font-size:11.5px;border-radius:2px;margin-top:6px;}
.close-deal-box{background:#e8f2ec;border:1px solid var(--forest);border-radius:2px;padding:12px 14px;margin-bottom:12px;}
.close-deal-label{font-family:var(--serif);font-weight:600;font-size:13.5px;color:#1f5c3d;margin-bottom:6px;}
.close-deal-btn{width:100%;margin-top:8px;background:var(--forest);border-color:var(--forest);color:#fff;padding:10px;font-size:13px;}
.close-deal-btn:hover{background:#255a44;}
.neg-input{width:100%;padding:10px;border:1px solid var(--panel-line);border-radius:2px;font-family:var(--sans);font-size:13px;resize:vertical;min-height:60px;}
.neg-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.rounds-left{font-family:var(--mono);font-size:11px;color:#6b6248;}
.result-banner{padding:12px 14px;border-radius:2px;font-family:var(--serif);font-weight:600;margin-bottom:12px;}
.result-banner.accepted{background:#dcefe2;color:#1f5c3d;border:1px solid #2f6a52;}
.result-banner.rejected{background:#f2ded9;color:#7a3327;border:1px solid #a1483a;}
.debrief ul{margin:6px 0 12px 18px;padding:0;font-size:13px;}
.debrief-deal-grid{font-family:var(--mono);font-size:12px;background:#f2ecdc;padding:10px 12px;border-radius:2px;margin:10px 0;line-height:1.75;color:#4a4331;}

  const rep = s?.reputation ?? 0;

function renderKnownContactsPanel(s){
  if(!modeCfg(s).farmTheme || typeof FarmAnimalNPC === 'undefined') return '';
  const mem = s.npcMemory || {};
  const rows = Object.keys(mem).map(k=>{
    const m = mem[k];
    const colon = k.indexOf(':');
    const speciesId = colon >= 0 ? k.slice(0, colon) : k;
    const name = colon >= 0 ? k.slice(colon + 1) : k;
    const sp = FarmAnimalNPC.SPECIES[speciesId];
    if(!sp || (m.encounters || 0) < 1) return null;
    return { name, sp, m, role: m.lastRole || 'contact' };
  }).filter(Boolean).sort((a,b)=>(b.m.encounters||0)-(a.m.encounters||0)).slice(0,6);
  if(!rows.length) return '';
  return `<h2 style="margin-top:20px">Known Contacts</h2>
    ${rows.map(r=>`<div class="contact-row">
      <span class="contact-emoji">${r.sp.emoji}</span>
      <div><div>${r.name}</div>
      <div class="contact-meta">${r.sp.label} · ${r.role} · ${r.m.encounters} meeting${r.m.encounters===1?'':'s'}${r.m.lastDealQuality!=null?` · last deal ${r.m.lastDealQuality}/100`:''}</div></div>
    </div>`).join('')}`;
}

function maybeTriggerWildcard(s){
  if(s.wildcardTriggered || !s.wildcardEvent) return null;
  if(s.turn < 7 || s.turn > 22) return null;
  if(Math.random() > 0.42) return null;
  s.wildcardTriggered = true;
  const ev = s.wildcardEvent;
  if(ev.cashBonus) s.cash += ev.cashBonus;
  const opp = makeWildcardOpportunity(s, ev);
  if(opp){
    s.runStats = s.runStats || {};
    s.runStats.wildcard = { label: ev.label, turn: s.turn, name: opp.name };
    addLog(`⚡ Wildcard — ${ev.label}: ${opp.name}. ${ev.tagline}${ev.cashBonus?` (+${fmt(ev.cashBonus)} cash)`:''}`, 'event');
  }
  return opp;
}

function makeWildcardOpportunity(s, ev){
  const tierCap = netWorth(s);
  let o = null;
  if(ev.assetType === 'realestate'){
    o = makeRealEstateOpportunity(s, tierCap, { expiresIn: ev.expiresIn });
  } else {
    o = makeBusinessOpportunity(s, tierCap, { expiresIn: ev.expiresIn, priceMult: ev.priceMult });
  }
  if(!o) return null;
  if(ev.priceMult && ev.assetType === 'realestate') o.price = Math.round(o.price * ev.priceMult);
  if(ev.marginAdj) o.margin = clamp((o.margin || 0.2) + ev.marginAdj, 0.05, 0.55);
  o.wildcardDeal = true;
  o.name = `${ev.label}: ${o.name}`;
  o.blurb = `${ev.tagline}. ${o.blurb || ''}`.trim();
  o.expiresIn = ev.expiresIn;
  return o;
}

function trackRunDeal(s, n, o, fin){
  if(!s.runStats) return;
  const asking = fin?.askingPrice ?? o?.price ?? 0;
  const paid = fin?.totalPrice ?? asking;
  s.runStats.deals.push({
    turn: s.turn, name: o?.name || n.context?.name || 'Deal',
    quality: n.dealQuality ?? 0,
    savings: Math.max(0, asking - paid),
    kind: n.kind,
  });
}

function trackRunShock(s, ev, severity){
  if(!s.runStats || !ev) return;
  s.runStats.shocks.push({ turn: s.turn, label: ev.label, note: ev.note, severity: severity || 1 });
}

function strategyOneLiner(dominantText){
  if(!dominantText) return '';
  if(dominantText.includes('Field-to-table')) return 'You ate the margin from seed to service plate — glorious until someone inspects the walk-in.';
  if(dominantText.includes('Farm retail')) return 'You built the storefront network — pricing power with spoilage lurking in every crate.';

  if(dominantText.includes('Protein chain')) return 'Feed in, protein out — recurring demand with vet bills as the shadow CFO.';

function dominantChainLabel(s){
  if(!modeCfg(s).farmTheme || typeof FarmSupplyChain === 'undefined') return null;
  const syn = FarmSupplyChain.computeSynergies(s);
  if(!syn.length) return 'No active supply-chain links yet';
  const best = [...syn].sort((a,b)=>(b.estimatedCostSaving||0)-(a.estimatedCostSaving||0))[0];
  return best ? `${best.label}${best.estimatedCostSaving?` (~${fmt(best.estimatedCostSaving)}/qtr saved)`:''}` : null;
}

function buildRunReportExtras(s){
  const rs = s.runStats || {};
  const deals = rs.deals || [];
  const shocks = rs.shocks || [];
  const bestDeal = deals.length
    ? [...deals].sort((a,b)=> (b.quality - a.quality) || (b.savings - a.savings))[0]
    : null;
  const worstShock = shocks.length
    ? [...shocks].sort((a,b)=>(b.severity||0)-(a.severity||0))[0]
    : null;
  const dominant = computeDominantStrategy();
  return { bestDeal, worstShock, dominant, oneLiner: strategyOneLiner(dominant), chain: dominantChainLabel(s), wildcard: rs.wildcard || null };
}

function computeActionPriorityHint(s){
  if(!s || s.actionPoints <= 0) return 'No action points left — advance the turn or hold.';
  const parts = [];
  let maxStake = 0;
  let topUrgent = null;
  (s.urgentProblems || []).forEach(p=>{
    const amt = p.stake?.amount || 0;
    if(amt >= maxStake){ maxStake = amt; topUrgent = p; }
  });
  const acq = (s.opportunities || []).filter(o=> o.assetType==='business' || o.assetType==='realestate');
  const expiring = acq.filter(o=> o.expiresIn === 1);
  const chainOpp = acq.find(o=> o.chainHintDeal);
  if(topUrgent && maxStake > 0){
    parts.push(`Urgent ${topUrgent.type} (~${fmt(maxStake)}/qtr at stake) — negotiate before advancing if you can.`);
  }
  if(expiring.length){
    const name = expiring[0].name.split('—')[0].trim();
    parts.push(`${name} expires this turn.`);
  } else if(chainOpp){
    parts.push(`Chain opportunity: ${chainOpp.name.split('—')[0].trim()} completes a strategic link.`);
  }
  if(!parts.length){
    if(s.actionPoints >= 2) return 'Two actions available — Investigate (1 AP) before negotiating pays off on bigger deals.';
    return 'One action left — spend it on your highest-value move, then advance.';
  }
  return parts.slice(0, 2).join(' ');
}

function fmt(n){

  n = Math.abs(Math.round(n));

function computeLoanTerms(amount, rate, term=10){
  const principalPerTurn = amount/term;
  const paymentPerTurn = principalPerTurn + amount*rate;
  return { principalPerTurn, paymentPerTurn, totalReturn: paymentPerTurn*term, term };
}

function changeIndicatorHTML(current, baseline){
  if(baseline==null || baseline===0 || !isFinite(current)) return '';
  const pct = (current-baseline)/baseline;
  const up = pct>=0;
  const arrow = up ? '▲' : '▼';
  return `<span class="change-indicator ${up?'up':'down'}">${arrow} ${Math.abs(pct*100).toFixed(1)}%</span>`;
}

function netWorth(s){
  const bizVal = s.portfolio.businesses.reduce((a,b)=>a+b.valuation,0);
  const reVal = s.portfolio.realEstate.reduce((a,b)=>a+b.valuation,0);
  const secVal = s.portfolio.securities.reduce((a,b)=>a+b.shares*b.price,0);
  const debt = s.loans.reduce((a,l)=>a+l.principal,0);
  return s.cash + bizVal + reVal + secVal - debt;
}

function liquidityRatio(s){
  const mandatory = mandatoryPaymentsThisTurn(s) || 1;
  const liquid = s.cash + s.portfolio.securities.reduce((a,b)=>a+b.shares*b.price,0);
  return liquid / mandatory;
}

function mandatoryPaymentsThisTurn(s){
  return s.loans.reduce((a,l)=>a+l.paymentPerTurn,0);
}

function hasEdge(s, id){ return s.strategicEdges.includes(id); }

// ---- Synergy detection & application ----
function computeSynergies(s){
  if(modeCfg(s).farmTheme && typeof FarmSupplyChain !== 'undefined'){
    return FarmSupplyChain.computeSynergies(s);
  }
  const active = [];
  SYNERGY_CHAINS.forEach(chain=>{
    const anchors = s.portfolio.businesses.filter(b=>b.templateId===chain.anchor);
    anchors.forEach(anchor=>{
      const partner = s.portfolio.businesses.find(b => b.id!==anchor.id && b.outputTags && b.outputTags.includes(chain.partnerTag));
      if(partner){
        active.push({ chainId:chain.id, anchorId:anchor.id, partnerId:partner.id, customerId:anchor.id, supplierId:partner.id,
          label:`${chain.partnerName} → ${anchor.name}`, costReduction:chain.costReduction,
          addedRiskLabel:chain.addedRiskLabel, addedCostPerTurn:chain.addedCostPerTurn });
      }
    });
  });
  return active;
}

// ---- Turn cash-flow resolution ----
/** Quarterly revenue, operating costs, debt service, and profit (read-only unless mutate:true). */
function computeQuarterlyRunRates(s, opts){
  opts = opts || {};
  const mutate = opts.mutate === true;
  const synergies = computeSynergies(s);
  const farm = modeCfg(s).farmTheme && typeof FarmSupplyChain !== 'undefined';
  const season = farm ? farmSeason(s) : null;

  if(mutate){
    s.portfolio.businesses.forEach(b=>{
      b.activeSynergies = farm
        ? synergies.filter(y=> y.customerId===b.id || y.supplierId===b.id)
        : synergies.filter(y=>y.anchorId===b.id);
    });
  }

  let revenueTotal = 0, costTotal = 0;

  s.portfolio.businesses.forEach(b=>{
    let rev = b.revenuePerTurn;
    let cost = b.operatingCosts;
    const bizSyns = farm
      ? synergies.filter(y=> y.customerId===b.id || y.supplierId===b.id)
      : synergies.filter(y=>y.anchorId===b.id || y.customerId===b.id);

    if(farm){
      const applied = FarmSupplyChain.applyToBusiness(b, synergies, s, {
        supplyChainBuilderBonus: hasEdge(s,'supply_chain_builder'),
      });
      rev = applied.rev;
      cost = applied.cost;
      if(mutate){
        b.crisisMult = applied.crisisMult;
        b._synergySavings = applied.savings;
        b._lastRevenue = rev;
        b._lastCost = cost;
      }
    } else {
      const activeSyns = mutate ? (b.activeSynergies || bizSyns) : bizSyns;
      activeSyns.filter(y=>y.anchorId===b.id || y.customerId===b.id).forEach(syn=>{
        const bonus = hasEdge(s,'supply_chain_builder') && !b._firstSynergyBonusUsed ? syn.costReduction*1.05 : syn.costReduction;
        cost *= (1-bonus);
        cost += syn.addedCostPerTurn||0;
        if(mutate) b._firstSynergyBonusUsed = true;
      });
    }
    if(hasEdge(s,'roll_up_strategy')){
      const sameIndustry = s.portfolio.businesses.filter(x=>x.industry===b.industry).length;
      if(sameIndustry>1) cost *= 0.95;
    }
    if(season){
      if(SEASON_HARVEST_TEMPLATES.has(b.templateId)) rev *= season.harvestRevMult;
      if(SEASON_PERISHABLE_TEMPLATES.has(b.templateId) && season.perishableCostMult > 1) cost *= season.perishableCostMult;
    }
    revenueTotal += rev;
    costTotal += cost;
  });

  let reRevenue = 0, reCost = 0;
  s.portfolio.realEstate.forEach(r=>{
    let rent = r.rentPerTurn * (1-r.vacancyRisk*0.4);
    const opex = r.operatingExpenses;
    if(farm && r.assetClass==='real_estate'){
      synergies.filter(y=> y.supplierId===r.id).forEach(y=>{
        if(y.revenueBonusSupplier) rent *= (1 + y.revenueBonusSupplier);
        if(y.demandStability) rent *= (1 + y.demandStability * 0.5);
      });
      if(mutate) r.activeSynergies = synergies.filter(y=> y.supplierId===r.id || y.customerId===r.id);
    }
    reRevenue += rent;
    reCost += opex;
    if(mutate){
      r._lastRevenue = Math.round(rent);
      r._lastCost = opex;
    }
  });

  const revenue = Math.round(revenueTotal + reRevenue);
  const costs = Math.round(costTotal + reCost);
  const debtService = mandatoryPaymentsThisTurn(s);
  const costsPlusDebt = costs + debtService;
  const profit = revenue - costsPlusDebt;

  return { revenue, costs, debtService, costsPlusDebt, profit };
}

function resolveCashFlow(s){
  const rates = computeQuarterlyRunRates(s, { mutate: true });
  s.cash += rates.profit;

  s.loans.forEach(l=>{ l.turnsRemaining -= 1; l.principal = Math.max(0, l.principal - l.principalPerTurn); });
  s.loans = s.loans.filter(l=> l.turnsRemaining>0 && l.principal>0);

  return {
    revenueTotal: rates.revenue,
    costTotal: rates.costs,
    debtService: rates.debtService,
    netCashFlow: rates.profit,
    notes: [],
  };
}

// ---- Market update ----
function resolveMarketUpdate(s){
  const drift = (val, states)=>{
    const idx = states.indexOf(val);
    const r = Math.random();
    if(r<0.2 && idx>0) return states[idx-1];
    if(r>0.8 && idx<states.length-1) return states[idx+1];
    return val;
  };
  s.marketState.interestRates = drift(s.marketState.interestRates, ['falling','stable','rising','restrictive']);
  s.marketState.creditAvailability = drift(s.marketState.creditAvailability, ['loose','normal','selective','frozen']);
  s.marketState.consumerDemand = drift(s.marketState.consumerDemand, ['weak','stable','strong']);
  s.marketState.businessConfidence = drift(s.marketState.businessConfidence, ['contraction','neutral','expansion']);
  s.marketState.inflation = drift(s.marketState.inflation, ['low','moderate','high']);
  Object.keys(s.marketState.sectorMomentum).forEach(k=>{
    s.marketState.sectorMomentum[k] = drift(s.marketState.sectorMomentum[k], ['negative','neutral','positive']);
  });

  // security price movement
  s.portfolio.securities.forEach(sec=>{
    const tmpl = SECURITIES.find(x=>x.ticker===sec.ticker);
    const momentum = s.marketState.sectorMomentum[tmpl.sector] || 'neutral';
    const drift2 = momentum==='positive'?0.02:momentum==='negative'?-0.02:0;
    sec.price = Math.max(5, sec.price * (1 + drift2 + rnd(-tmpl.volatility, tmpl.volatility)));
  });
}

function currentSecurityPrice(ticker, s){
  let sec = s.portfolio.securities.find(x=>x.ticker===ticker);
  if(sec) return sec.price;
  const tmpl = SECURITIES.find(x=>x.ticker===ticker);
  return s._secPrices?.[ticker] ?? tmpl.basePrice;
}

function initSecurityPrices(s){
  s._secPrices = {};
  SECURITIES.forEach(t=> s._secPrices[t.ticker] = t.basePrice);
}

// ---- Opportunity generation ----
function maxOwnedLevel(s){
  if(!s.portfolio.businesses.length) return 1;
  return Math.max(...s.portfolio.businesses.map(b=>b.level||1));
}

// Once the player owns a Level 2+ business, bigger acquisition targets start appearing at that
// scale too — more expensive, and negotiated with tougher, less personal counterparties.
function pickBusinessLevel(s){
  const maxLvl = maxOwnedLevel(s);
  const r = Math.random();
  if(maxLvl>=3){ if(r<0.4) return 1; if(r<0.75) return 2; return 3; }
  if(maxLvl>=2){ if(r<0.6) return 1; return 2; }
  return 1;
}

const LEVEL_ARCHETYPE_POOLS = {
  1: ['desperate_seller','proud_founder','proud_founder','relationship_owner'],
  2: ['skeptical_buyer','meticulous_investor','relationship_owner'],
  3: ['meticulous_investor','aggressive_banker','corporate_seller','corporate_seller'],
};
const LEVEL_RESERVATION_PCT = { 1:[0.72,0.9], 2:[0.8,0.93], 3:[0.85,0.96] };
const LEVEL_REDLINE_PCT = { 1:[0.55,0.68], 2:[0.65,0.78], 3:[0.75,0.85] };
const LEVEL_PRICE_MULT = { 1:1, 2:2.3, 3:5.0 };
const LEVEL_REVENUE_MULT = { 1:1, 2:2.1, 3:4.6 };
const LEVEL_TAG = { 1:'', 2:' — Regional Operation', 3:' — Corporate Division' };
const LEVEL_BLURB_SUFFIX = { 1:'', 2:' A larger, more established operation than a typical first deal.',
  3:' An institutional seller — expect a data-driven, less personal negotiation.' };

function generateOpportunities(s){
  const cfg = modeCfg(s);
  const opps = [];
  const tierCap = netWorth(s);
  const earlyFarm = cfg.farmTheme && s.turn <= 5;
  const n = earlyFarm ? 4 + Math.floor(Math.random()*2) : 3 + Math.floor(Math.random()*3);

  if(cfg.farmTheme && typeof FarmSupplyChain !== 'undefined' && !s.starterDealOffered
      && s.turn <= 2 && FarmSupplyChain.portfolioNodes(s).length === 0){
    const starter = makeStarterFarmOpportunity(s, tierCap);
    if(starter){ opps.push(starter); s.starterDealOffered = true; }
  }

  if(cfg.farmTheme && typeof FarmSupplyChain !== 'undefined' && FarmSupplyChain.hasCriticalChainGap(s)
      && s.turn >= 2 && (s.turn - (s.lastChainHintTurn||0) >= CHAIN_HINT_INTERVAL || s.turn === 2)){
    const hint = makeChainHintOpportunity(s, tierCap);
    if(hint){ opps.push(hint); s.lastChainHintTurn = s.turn; }
  }

  for(let i=0;i<n;i++){
    const roll = Math.random();
    let opp = null;
    if(roll < 0.5) opp = makeBusinessOpportunity(s, tierCap);
    else if(roll < 0.7) opp = makeRealEstateOpportunity(s, tierCap);
    else if(roll < 0.9) opp = makeSecurityOpportunity(s);
    else opp = makeFinancingOpportunity(s);
    if(opp) opps.push(opp);
  }
  return opps.filter(Boolean).concat(generateLevelUpOpportunities(s));
}

function makeStarterFarmOpportunity(s, tierCap){
  const tmpl = FarmSupplyChain.templateById(pick(STARTER_FARM_TEMPLATES));
  if(!tmpl) return null;
  const o = makeBusinessOpportunity(s, tierCap, { templateId: tmpl.id, priceMult: 0.82, expiresIn: 3, starterDeal: true });
  if(o) o.blurb = (o.blurb || '') + ' Motivated local seller — discounted first foothold for new farm operators.';
  return o;
}

function makeChainHintOpportunity(s, tierCap){
  const tmpl = FarmSupplyChain.pickCriticalMissingTemplate(s);
  if(!tmpl) return null;
  if(tmpl.assetClass === 'real_estate'){
    const o = makeRealEstateOpportunity(s, tierCap, { templateId: tmpl.id, expiresIn: 2, chainHint: true });
    return o;
  }
  return makeBusinessOpportunity(s, tierCap, { templateId: tmpl.id, expiresIn: 2, chainHint: true });
}

function makeBusinessOpportunity(s, tierCap, opts){
  opts = opts || {};
  const cfg = modeCfg(s);
  const scale = tierScale(s);
  const level = pickBusinessLevel(s);
  let tmpl;
  if(opts.templateId && cfg.farmTheme && typeof FarmSupplyChain !== 'undefined'){
    tmpl = FarmSupplyChain.templateById(opts.templateId);
  }
  if(!tmpl){
    tmpl = (cfg.farmTheme && typeof FarmSupplyChain !== 'undefined')
      ? FarmSupplyChain.pickTemplate(s)
      : pick(businessTemplatesFor(s));
  }
  if(!tmpl) return null;
  const priceScale = scale * cfg.priceMult * (cfg.tierScaleOn ? rnd(0.75, 1.3) : 1) * LEVEL_PRICE_MULT[level];
  const revScale = scale * cfg.revenueMult * (cfg.tierScaleOn ? rnd(0.8, 1.2) : 1) * LEVEL_REVENUE_MULT[level];
  let price = Math.round(rnd(tmpl.priceRange[0], tmpl.priceRange[1]) * priceScale);
  if(opts.priceMult) price = Math.round(price * opts.priceMult);
  const revenue = Math.round(rnd(tmpl.revRange[0], tmpl.revRange[1]) * revScale);
  const margin = rnd(tmpl.marginRange[0], tmpl.marginRange[1]);
  const cost = Math.round(revenue*(1-margin) * cfg.costMult);
  const concDamp = level===1?1:level===2?0.8:0.5;
  const custConc = rnd(tmpl.custConc[0], tmpl.custConc[1]) * concDamp;
  const depDamp = level===1?1:level===2?0.7:0.4;
  const ownerDep = clamp(tmpl.ownerDep*depDamp, 0.05, 0.95);
  const archetype = pick(NEGOTIATOR_ARCHETYPES.filter(a=>LEVEL_ARCHETYPE_POOLS[level].includes(a.id)));
  const [rMin,rMax] = LEVEL_RESERVATION_PCT[level];
  const [dMin,dMax] = LEVEL_REDLINE_PCT[level];
  return {
    id: uid(), kind:'acquisition', assetType:'business', templateId: tmpl.id, level,
    name: `${tmpl.name} — ${pick(cfg.farmTheme
      ? ['North Field','Willow Creek','Red Barn Road','Meadowgate','Hearthstead','Copper Silo']
      : ['Riverside','Ashford','Maple Street','Harbor View','Elm Corner','Northgate'])}${LEVEL_TAG[level]}`,
    price, revenue, cost, margin, custConc,
    ownerDep, equipmentCondition: rnd(0.4,0.9),
    industry: tmpl.industry, layer: tmpl.layer||null,
    inputTags: tmpl.inputTags, outputTags: tmpl.outputTags, capabilityTags: tmpl.capabilityTags,
    riskTags: tmpl.riskTags||[], dependencyPartners: tmpl.dependencyPartners||[],
    expiresIn: opts.expiresIn ?? (1+Math.floor(Math.random()*3)),
    starterDeal: !!opts.starterDeal,
    chainHintDeal: !!opts.chainHint,
    counterparty: withFarmNpc({ archetypeId: archetype.id, role:'seller',
      reservationPrice: Math.round(price*rnd(rMin,rMax)), urgency: clamp(archetype.urgency+rnd(-0.1,0.1),0.1,0.95),
      trust: archetype.trust, riskTolerance: archetype.riskTolerance, concessionStyle: archetype.concessionStyle,
      preferredTerms: archetype.respondsTo, redLine: Math.round(price*rnd(dMin,dMax)),
      hiddenInfo: pickHiddenInfoForArchetype(archetype.id) },
      { orgName: `${tmpl.name}` }, s),
    diligenceDone:false,
    blurb: tmpl.blurb + LEVEL_BLURB_SUFFIX[level],
    strategicHint: (cfg.farmTheme && typeof FarmSupplyChain !== 'undefined')
      ? FarmSupplyChain.strategicHint(s, tmpl.id)
      : '',
  };
}

// Major upgrade opportunities for a business that's matured (3+ Improvements since its last level).
// These move a business from one Level to the next by shifting its baseline significantly.
// Guaranteed once eligible (not a rare random drop) — this is a milestone reward, not a lottery.
function generateLevelUpOpportunities(s){
  const opps = [];
  s.portfolio.businesses.forEach(b=>{
    if((b.level||1) >= 3) return;
    if((b.improvementsApplied||[]).length < 3) return;
    if(s.opportunities.some(o=>o.assetType==='levelup' && o.businessId===b.id)) return;
    const tmpl = pick(LEVEL_UP_TEMPLATES);
    const basePrice = tmpl.costFrac ? Math.round(b.valuation*tmpl.costFrac) : Math.round(b.valuation*rnd(0.7,1.1));
    let counterparty = null;
    if(tmpl.requiresNegotiation){
      const archetype = NEGOTIATOR_ARCHETYPES.find(a=>a.id===tmpl.counterpartyArchetype);
      counterparty = withFarmNpc({ archetypeId: archetype.id, role:'seller',
        reservationPrice: Math.round(basePrice*rnd(0.85,0.95)), urgency: archetype.urgency, trust: archetype.trust,
        riskTolerance: archetype.riskTolerance, concessionStyle: archetype.concessionStyle, preferredTerms: archetype.respondsTo,
        redLine: Math.round(basePrice*rnd(0.75,0.85)), hiddenInfo: tmpl.hiddenInfo },
        { orgName: b.name }, s);
    }
    opps.push({ id: uid(), kind:'levelup', assetType:'levelup', businessId:b.id, templateId:tmpl.id,
      name: `${tmpl.name} — ${b.name}`, price:basePrice, requiresNegotiation: tmpl.requiresNegotiation,
      levelUpTemplate: tmpl, counterparty, diligenceDone:false, expiresIn: 3,
      blurb: tmpl.note });
  });
  return opps;
}

function makeRealEstateOpportunity(s, tierCap, opts){
  opts = opts || {};
  const cfg = modeCfg(s);
  const scale = tierScale(s);
  const farmRe = cfg.farmTheme && typeof FarmSupplyChain !== 'undefined';
  let tmpl = null;
  if(opts.templateId && farmRe) tmpl = FarmSupplyChain.templateById(opts.templateId);
  if(!tmpl){
    tmpl = farmRe ? FarmSupplyChain.pickRealEstateTemplate(s) : pick(REAL_ESTATE_TEMPLATES);
  }
  if(!tmpl) return null;
  const priceScale = scale * cfg.priceMult * (cfg.tierScaleOn ? rnd(0.8, 1.25) : 1);
  const revScale = scale * cfg.revenueMult * (cfg.tierScaleOn ? rnd(0.85, 1.15) : 1);
  const rentRange = tmpl.rentRange || tmpl.revRange;
  const price = Math.round(rnd(tmpl.priceRange[0], tmpl.priceRange[1]) * priceScale);
  const rent = Math.round(rnd(rentRange[0], rentRange[1]) * revScale);
  const archetype = pick(NEGOTIATOR_ARCHETYPES);
  const district = farmRe
    ? pick(['North Field','Willow Creek','Red Barn Road','Meadowgate','Hearthstead','Copper Silo'])
    : pick(['Oak Ave','Pine District','Riverside','Fifth & Main']);
  return {
    id: uid(), kind:'investment', assetType:'realestate', templateId: tmpl.id,
    name: `${tmpl.name} — ${district}`,
    price, downPct: clamp((tmpl.downPct||0.22)*cfg.downPctMult, 0.08, 0.5),
    rent, opexPct: (tmpl.opexPct||0.30)*cfg.costMult, vacancyRisk: tmpl.vacancyRisk||0.10,
    industry: tmpl.industry||null, layer: tmpl.layer||null,
    inputTags: tmpl.inputTags||null, outputTags: tmpl.outputTags||null,
    capabilityTags: tmpl.capabilityTags||null, riskTags: tmpl.riskTags||[],
    dependencyPartners: tmpl.dependencyPartners||[],
    assetClass: farmRe ? 'real_estate' : null,
    expiresIn: opts.expiresIn ?? (1+Math.floor(Math.random()*3)),
    chainHintDeal: !!opts.chainHint,
    counterparty: withFarmNpc({ archetypeId: archetype.id, role:'seller',
      reservationPrice: Math.round(price*rnd(0.85,0.95)), urgency: archetype.urgency, trust: archetype.trust,
      riskTolerance: archetype.riskTolerance, concessionStyle: archetype.concessionStyle,
      preferredTerms: archetype.respondsTo, redLine: Math.round(price*0.8),
      hiddenInfo: pickHiddenInfoForArchetype(archetype.id) },
      { orgName: tmpl.name }, s),
    diligenceDone:false,
    blurb: tmpl.blurb,
    strategicHint: farmRe ? FarmSupplyChain.strategicHint(s, tmpl.id) : '',
  };
}

function makeSecurityOpportunity(s){
  const tmpl = pick(SECURITIES);
  const price = currentSecurityPrice(tmpl.ticker, s);
  const momentum = s.marketState.sectorMomentum[tmpl.sector];
  return {
    id: uid(), kind:'investment', assetType:'security', ticker: tmpl.ticker, name: tmpl.name,
    price, sector: tmpl.sector, momentum, expiresIn: 1,
    blurb: `${momentum==='negative'?'Trading below recent levels':'Posted price, no negotiation'}; ${tmpl.sector} sector.`,
  };
}

function makeFinancingOpportunity(s){
  const cfg = modeCfg(s);
  const scale = tierScale(s);
  const repTier = reputationTier(s);
  let rate = s.marketState.interestRates==='rising'||s.marketState.interestRates==='restrictive' ? rnd(0.08,0.12): rnd(0.05,0.08);
  rate = clamp(rate + cfg.rateAdj + repTier.rateAdj, 0.015, 0.14);
  const repNote = repTier.min >= 35 ? ` ${repTier.label} reputation improves terms.` : '';
  return {
    id: uid(), kind:'financing', assetType:'loan',
    name: 'Bank Line of Credit Offer', maxAmount: Math.round(rnd(20000,80000) * scale * repTier.creditMult), rate, termTurns:10,
    expiresIn: 2,
    blurb: `Bank credit is arranged in advance, at a bank rate — typically cheaper than the seller note you default into if you close a deal short on cash.${repNote}`,
  };
}

// ---- Urgent relationship problems ----
// Relationship health drifts each turn based on market conditions and the business's own exposure
// (customer concentration). Crisis odds are driven off health + a cooldown after any crisis (resolved
// or not), rather than an independent flat roll every turn — so problems don't pile up back-to-back.
function updateRelationshipHealth(s){
  s.portfolio.businesses.forEach(b=>{
    if(b.clientHealth==null) b.clientHealth = 72;
    if(b.supplierHealth==null) b.supplierHealth = 72;
    if(b.clientCooldown==null) b.clientCooldown = 0;
    if(b.supplierCooldown==null) b.supplierCooldown = 0;

    const demandAdj = s.marketState.consumerDemand==='weak' ? -4 : s.marketState.consumerDemand==='strong' ? 3 : 0;
    const custConcDrag = -(b.custConc*12);
    b.clientHealth = clamp(b.clientHealth + demandAdj + custConcDrag + rnd(-2,3), 0, 100);

    const inflationAdj = s.marketState.inflation==='high' ? -4 : s.marketState.inflation==='low' ? 2 : -1;
    const confAdj = s.marketState.businessConfidence==='contraction' ? -3 : s.marketState.businessConfidence==='expansion' ? 2 : 0;
    b.supplierHealth = clamp(b.supplierHealth + inflationAdj + confAdj + rnd(-2,3), 0, 100);

    if(b.clientCooldown>0) b.clientCooldown -= 1;
    if(b.supplierCooldown>0) b.supplierCooldown -= 1;
  });
}

function generateUrgentProblems(s){
  const cfg = modeCfg(s);
  const problems = [];
  s.portfolio.businesses.forEach(b=>{
    if(!b.clientState) b.clientState = 'stable';
    if(!b.supplierState) b.supplierState = 'stable';
    const careMult = b.crisisMult ?? 1;

    const clientChance = b.clientCooldown>0 ? 0 : clamp((100-b.clientHealth)/100, 0, 1) * 0.35 * cfg.urgentFreqMult * careMult;
    if(Math.random() < clientChance){
      if(b.clientState === 'at_risk'){
        // Ignored through a second escalation — the client actually leaves. Real, permanent hit.
        const loss = Math.round(b.revenuePerTurn * b.custConc);
        b.revenuePerTurn = Math.max(0, b.revenuePerTurn - loss);
        b.clientState = 'stable';
        b.clientHealth = clamp(b.clientHealth + 10, 0, 100);
        b.clientCooldown = 3;
        addLog(`${b.name} lost its at-risk client — revenue drops ${fmt(loss)}/qtr, permanently.`, 'event');
      } else {
        b.clientState = b.clientState==='stable' ? 'strained' : 'at_risk';
        b.clientHealth = clamp(b.clientHealth - 15, 0, 100);
        b.clientCooldown = 2;
        const stakeAmount = Math.round(b.revenuePerTurn * b.custConc * (b.clientState==='at_risk' ? 1 : 0.55));
        const clientCp = withFarmNpc({ archetypeId: pick(['skeptical_buyer','relationship_owner']), role:'client',
            reservationPrice:null, urgency:0.6, trust:0.4, riskTolerance:0.3, concessionStyle:'medium',
            preferredTerms:['service guarantee','flexible payment'], redLine:null, hiddenInfo:'they received a competing offer' },
          { orgName: b.name, reuse: b.namedClient || null }, s);
        if(clientCp.speciesId) b.namedClient = FarmAnimalNPC.snapshotNpc(clientCp);
        problems.push({ id: uid(), type:'client', businessId:b.id,
          text: (modeCfg(s).farmTheme && typeof FarmAnimalNPC !== 'undefined')
            ? FarmAnimalNPC.urgentProblemText('client', { businessName: b.name, npcName: clientCp.npcName, stakeAmount, escalation: b.clientState, formatMoney: fmt })
            : `${b.name}: your largest client is ${b.clientState==='at_risk'?'threatening to leave':'pushing back on price/terms'}.`,
          stake: { kind:'revenue', amount: stakeAmount, label: b.clientState==='at_risk' ? 'will leave for good next time — revenue lost permanently' : 'may escalate and eventually walk — revenue at risk' },
          counterparty: clientCp });
      }
    }

    const supplierChance = b.supplierCooldown>0 ? 0 : clamp((100-b.supplierHealth)/100, 0, 1) * 0.3 * cfg.urgentFreqMult * careMult;
    if(Math.random() < supplierChance){
      if(b.supplierState === 'at_risk'){
        const hike = Math.round(b.operatingCosts * rnd(0.10, 0.20));
        b.operatingCosts += hike;
        b.supplierState = 'stable';
        b.supplierHealth = clamp(b.supplierHealth + 10, 0, 100);
        b.supplierCooldown = 3;
        addLog(`${b.name}'s supplier situation went unresolved — operating costs rise ${fmt(hike)}/qtr, permanently.`, 'event');
      } else {
        b.supplierState = b.supplierState==='stable' ? 'strained' : 'at_risk';
        b.supplierHealth = clamp(b.supplierHealth - 15, 0, 100);
        b.supplierCooldown = 2;
        const stakeAmount = Math.round(b.operatingCosts * rnd(0.10,0.20) * (b.supplierState==='at_risk' ? 1 : 0.55));
        const supplierCp = withFarmNpc({ archetypeId: pick(['aggressive_banker','proud_founder']), role:'supplier',
            reservationPrice:null, urgency:0.5, trust:0.45, riskTolerance:0.25, concessionStyle:'slow',
            preferredTerms:['volume commitment','faster payment'], redLine:null, hiddenInfo:'their own input costs rose' },
          { orgName: b.name, reuse: b.namedSupplier || null }, s);
        if(supplierCp.speciesId) b.namedSupplier = FarmAnimalNPC.snapshotNpc(supplierCp);
        problems.push({ id: uid(), type:'supplier', businessId:b.id,
          text: (modeCfg(s).farmTheme && typeof FarmAnimalNPC !== 'undefined')
            ? FarmAnimalNPC.urgentProblemText('supplier', { businessName: b.name, npcName: supplierCp.npcName, stakeAmount, escalation: b.supplierState, formatMoney: fmt })
            : `${b.name}: a critical supplier wants a price increase or new terms.`,
          stake: { kind:'cost', amount: stakeAmount, label: b.supplierState==='at_risk' ? 'will impose the hike for good next time — costs rise permanently' : 'may escalate into a lasting price increase' },
          counterparty: supplierCp });
      }
    }
  });
  s.loans.forEach(l=>{
    if(l.type==='business' && Math.random()<0.05*cfg.urgentFreqMult){
      if(l.riskFlag){
        const hike = Math.round(l.paymentPerTurn * rnd(0.08,0.15));
        l.paymentPerTurn += hike;
        l.riskFlag = false;
        addLog(`Coverage concerns on ${l.label} went unaddressed — payment rises ${fmt(hike)}/qtr, permanently.`, 'event');
      } else {
        l.riskFlag = true;
        const stakeAmount = Math.round(l.paymentPerTurn * rnd(0.08,0.15));
        const lenderCp = withFarmNpc({ archetypeId:'aggressive_banker', role:'lender', reservationPrice:null, urgency:0.5,
            trust:0.4, riskTolerance:0.15, concessionStyle:'medium', preferredTerms:['collateral','covenants'], redLine:null,
            hiddenInfo:'they are under internal pressure to reduce risk exposure' },
            { orgName: l.label, reuse: l.namedLender || null }, s);
        problems.push({ id: uid(), type:'lender', loanId:l.id,
          text: (modeCfg(s).farmTheme && typeof FarmAnimalNPC !== 'undefined')
            ? FarmAnimalNPC.urgentProblemText('lender', { businessName: l.label, npcName: lenderCp.npcName, stakeAmount, formatMoney: fmt })
            : `Your lender has flagged coverage concerns on a business loan.`,
          stake: { kind:'cost', amount: stakeAmount, label: 'may impose a lasting payment increase if left unaddressed' },
          counterparty: lenderCp });
        if(lenderCp.speciesId) l.namedLender = FarmAnimalNPC.snapshotNpc(lenderCp);
      }
    }
  });
  return problems;
}

// ---- Market events ----
function maybeTriggerMarketEvent(s){
  const cfg = modeCfg(s);
  const farmNodes = cfg.farmTheme && typeof FarmSupplyChain !== 'undefined'
    ? FarmSupplyChain.portfolioNodes(s).length
    : s.portfolio.businesses.length;
  if(farmNodes===0) return null;

  // Phase B: skip or soften shocks until the player has ~2 assets
  if(farmNodes < 2){
    if(Math.random() > 0.12 * cfg.eventFreqMult) return null;
    const earlySafe = MARKET_EVENTS.filter(e=> e.id === 'referral_opportunity' || e.id === 'competitor_failure');
    const ev = pick(earlySafe);
    if(!ev) return null;
    const biz = s.portfolio.businesses[0] || null;
    const result = ev.apply(biz || { name: biz?.name || 'your operation' });
    if(result.cashHit) s.cash -= Math.round(result.cashHit * 0.35);
    if(result.revenueMult && biz) biz.revenuePerTurn *= result.revenueMult;
    if(result.reputationBonus) s.reputation += result.reputationBonus;
    return { label: ev.label, note: result.note + (result.cashHit ? ' (early-run impact reduced)' : ''), exposes: ev.exposes };
  }

  if(Math.random() > 0.35*cfg.eventFreqMult) return null;

  // Capital Farm: authored shocks that propagate through active connections
  if(cfg.farmTheme && typeof FarmSupplyChain !== 'undefined' && Math.random() < 0.72){
    const shock = FarmSupplyChain.pickShock(s);
    const result = FarmSupplyChain.applyShock(s, shock);
    if(result) return { label: result.label, note: result.note, exposes: 'connected farm supply chain' };
  }

  const ev = pick(MARKET_EVENTS);
  const biz = s.portfolio.businesses.length ? pick(s.portfolio.businesses) : null;
  const result = ev.apply(biz || {});
  if(result.cashHit) s.cash -= result.cashHit;
  if(result.revenueMult && biz) biz.revenuePerTurn *= result.revenueMult;
  if(result.costMult && biz) biz.operatingCosts *= result.costMult;
  if(result.reputationBonus) s.reputation += result.reputationBonus;
  return { label: ev.label, note: result.note, exposes: ev.exposes };
}

// ---- Milestone check ----
function checkMilestone(s){
  const nw = netWorth(s);
  const stage = MILESTONE_STAGES.find(m=> nw>=m.min && nw<m.max) || MILESTONE_STAGES[MILESTONE_STAGES.length-1];
  if(stage.id !== s.milestoneStage && !s.milestonesHit.includes(stage.id)){
    s.milestoneStage = stage.id;
    s.milestonesHit.push(stage.id);
    if(stage.id !== 'survival'){
      return stage;
    }
  }
  s.milestoneStage = stage.id;
  return null;
}

// ---- Negotiation utility engine (deterministic, authoritative) ----
function evaluateOfferUtility(offer, counterparty, context){
  const askPrice = context.price;
  const cashAtClosing = offer.cashAtClosing ?? offer.totalPrice ?? 0;
  const totalPrice = offer.totalPrice ?? 0;
  let value = 0;

  if(counterparty.role==='seller' || counterparty.role==='lender'){
    const priceScore = counterparty.reservationPrice ? (totalPrice - counterparty.reservationPrice) / Math.max(1,counterparty.reservationPrice) : 0;
    value += priceScore * 40;
    const closingSpeedScore = { fast:1, standard:0.5, extended:0 }[offer.closingSpeed || 'standard'];
    value += closingSpeedScore * counterparty.urgency * 20;
    const certainty = (cashAtClosing / Math.max(1,totalPrice||1));
    value += certainty * 15;
  } else {
    // client / supplier: value is about price/terms favorable to them, inverse of player concession
    value += (offer.priceAdjustment||0) * -30; // negative adjustment (discount to them) increases their utility
    value += (offer.concessionSize||0) * 25;
  }

  offer.preferredTermsHit = (offer.termsOffered||[]).filter(t=> counterparty.preferredTerms.some(p=>t.toLowerCase().includes(p.split(' ')[0])));
  value += offer.preferredTermsHit.length * 8;
  value += counterparty.trust * 10;
  value -= (1-counterparty.riskTolerance) * (offer.riskToCounterparty||10);

  if(counterparty.redLine && totalPrice && totalPrice < counterparty.redLine){
    value -= 100; // hard violation
  }

  // Capital Farm addendum: capped species + relationship memory bonuses
  if(typeof FarmAnimalNPC !== 'undefined' && counterparty.speciesId){
    value = FarmAnimalNPC.applyUtilityBonus(value, offer, counterparty, context, S);
  }
  return value;
}

function negotiationDecision(utility, round, maxRounds){
  if(utility >= 18) return 'accept';
  if(utility <= -40) return 'reject';
  if(round >= maxRounds) return utility >= 16 ? 'accept' : 'counter';
  return 'counter';
}

function attachListingEconomicsToContext(ctx){
  if(!ctx) return;
  const o = ctx.opp;
  if(!o) return;
  ctx.listingEconomics = {
    askingPrice: o.price,
    quarterlyRevenue: o.revenue || null,
    marginPct: o.margin != null ? Math.round(o.margin * 100) : null,
  };
}

function dealQualityScore(offer, counterparty, context){
  let score = 60;
  if(context.price && offer.totalPrice) score += clamp((context.price - offer.totalPrice)/context.price,-0.3,0.3)*60;
  if(offer.closingSpeed==='fast') score += 5;
  if((offer.termsOffered||[]).length>0) score += 5;
  return Math.round(clamp(score,0,100));
}

    businesses: s.portfolio.businesses.map(b=>b.name),

  };
}

function resolvePlayerPurchaseOffer(text, n, parsed){
  const helpers = contestHelpers();
  if(typeof RivalFarmer !== 'undefined' && RivalFarmer.buildPlayerOfferFromMessage){
    const built = RivalFarmer.buildPlayerOfferFromMessage(text, parsed || { intent:'question' }, n, helpers);
    if(built.intent === 'walk') return { offer: null, intent: 'walk' };
    if(built.offer && built.offer.totalPrice){
      n.playerLastOfferText = text;
      return { offer: built.offer, intent: 'offer' };
    }
  }
  if(typeof RivalFarmer !== 'undefined' && RivalFarmer.extractPurchaseOfferFromText){
    const fromText = RivalFarmer.extractPurchaseOfferFromText(text, n, helpers);
    if(fromText && fromText.totalPrice){
      n.playerLastOfferText = text;
      return { offer: fromText, intent: 'offer' };
    }
  }
  const mentionsFigure = /\d/.test(text) || /\bpercent\b|%/i.test(text);
  let intent = parsed && parsed.intent ? parsed.intent : 'question';
  let offer = null;
  if(intent === 'offer'){
    offer = normalizeOffer(parsed.offer, n);
    const le = n.context?.listingEconomics || {};
    const rev = le.quarterlyRevenue || n.context?.opp?.revenue;
    const ask = n.context?.price || le.askingPrice;
    if(rev && offer?.totalPrice && Math.abs(offer.totalPrice - rev) / Math.max(1, rev) < 0.08
        && (!ask || Math.abs(offer.totalPrice - ask) / Math.max(1, ask) > 0.08)){
      offer = null;
      intent = 'question';
    }
    if(!offer || !mentionsFigure || (!offer.totalPrice && offer.priceAdjustment==null && offer.concessionSize==null)){
      offer = null;
      intent = 'question';
    }
  }
  return { offer, intent };
}

function extractPlayerOfferFromText(text, n){
  if(typeof RivalFarmer !== 'undefined' && RivalFarmer.buildPlayerOfferFromMessage){
    const built = RivalFarmer.buildPlayerOfferFromMessage(text, { intent:'question' }, n, contestHelpers());
    return built.offer;
  }
  const mentionsFigure = /\d/.test(text) || /\bpercent\b|%/i.test(text);
  if(!mentionsFigure) return null;
  const fb = fallbackExtractOffer(text, n);
  if(!fb.offer?.totalPrice) return null;
  return normalizeOffer(fb.offer, n);
}

}

function resolveUncontestedRivalContests(s){
  if(typeof RivalFarmer === 'undefined' || !modeCfg(s).farmTheme) return;
  const contested = s.opportunities.filter(o=> o.rivalContest);
  contested.forEach(o=>{
    const taunt = typeof RivalFarmer !== 'undefined' && RivalFarmer.rivalUncontestedWinLine
      ? RivalFarmer.rivalUncontestedWinLine(o)
      : null;
    addLog(`${RivalFarmer.RIVAL.name} closed ${o.name.split('—')[0].trim()} — you didn't win the bidding war in time.${taunt ? ' "' + taunt + '"' : ''}`, 'event');
    s.reputation = Math.max(0, s.reputation - 2);
  });
  if(contested.length) s.opportunities = s.opportunities.filter(o=> !o.rivalContest);
  s.activeRivalContestOppId = null;
}

function rivalWinsContest(n){
  const o = S.opportunities.find(x=>x.id===n.oppId);
  if(typeof RivalFarmer !== 'undefined' && RivalFarmer.rivalWinLine){
    const lastRival = n.messages.length && n.messages[n.messages.length - 1].who === 'rival';
    if(!lastRival){
      n.messages.push({ who:'rival', text: RivalFarmer.rivalWinLine(n, { reason: 'outbid' }) });
    }
  }
  S.opportunities = S.opportunities.filter(x=>x.id!==n.oppId);
  S.activeRivalContestOppId = null;
  n.status = 'rejected';
  n.readyToClose = false;
  n.pendingOffer = null;
  n.debriefNote = `${rivalDisplayName(n.rival)} won the listing with a stronger position.`;
  addLog(`${rivalDisplayName(n.rival)} acquired ${o?.name?.split('—')[0]?.trim() || 'the asset'}.`, 'event');
  S.reputation = Math.max(0, S.reputation - 2);
  recordFarmNpcOutcome(n, false);
}

function openRivalContestNegotiation(oppId){
  const o = S.opportunities.find(x=>x.id===oppId);
  if(!o || !o.rivalContest || S.actionPoints<1 || typeof RivalFarmer === 'undefined') return;
  spendAP(1);
  const stakes = negotiationStakes(o.price || 0);
  const rival = RivalFarmer.createRival(S);
  const contestRules = RivalFarmer.buildContestRules(S, o, o.counterparty);
  const rivalOffer = RivalFarmer.openingOffer(o, contestRules);
  const rivalOfferNorm = normalizeOffer(rivalOffer, { context: { price: o.price } });
  S.negotiation = {
    kind:'rival_contest',
    oppId,
    phase:'player_turn',
    context:{ price:o.price, name:o.name, assetType:o.assetType, opp:o, dealAsset:o.name },
    counterparty: o.counterparty,
    contestRules,
    rival,
    rivalLastOffer: rivalOfferNorm,
    rivalConceded: false,
    playerLastOffer: null,
    leadingBidder: 'rival',
    intelUnlocked: o.diligenceDone || hasEdge(S,'negotiation_analyst'),
    stakesTier: stakes.tier,
    stakesLabel: stakes.label + ' · 3-way contest',
    stakesNote: 'Rival opened first. Address the seller or Rowe directly — outbid him before the turn ends.',
    messages: [
      { who:'rival', text: RivalFarmer.rivalOpeningLine(o, rivalOfferNorm), offerSummary: summarizeOffer(rivalOfferNorm) },
      { who:'counterparty', text: RivalFarmer.sellerResponseToRival(o, rivalOfferNorm, o.counterparty) },
      { who:'system', text:'Three-way contest — your turn. Make a counter-offer, talk terms, or address Cassius Rowe directly.' },
    ],
    round:0, maxRounds: stakes.maxRounds + 2,
    status:'ongoing', lastOffer:null, readyToClose:false, pendingOffer:null,
  };
  attachPortfolioFactsToContext(S.negotiation.context);
  beginNegotiationAi(S.negotiation);
  render();
}

function processRivalContestTurn(n, text, parsed){
  const result = RivalFarmer.processContestTurn(n, text, parsed, contestHelpers());
  (result.messages || []).forEach(m => n.messages.push(m));
  if(result.walkAway){
    rivalWinsContest(n);
    return;
  }
  if(result.rivalWins){
    rivalWinsContest(n);
    return;
  }
}

function openingLine(counterparty, context){
  context = context || {};
  const stakesTier = context.stakesTier;
  let callback = null;
  if(typeof FarmAnimalNPC !== 'undefined' && counterparty?.speciesId){
    callback = FarmAnimalNPC.callbackLine(counterparty, context);
  }
  if(modeCfg(S).farmTheme && typeof FarmAnimalNPC !== 'undefined' && counterparty?.speciesId){
    const arch = NEGOTIATOR_ARCHETYPES.find(a=>a.id===counterparty.archetypeId) || {};
    let line;
    if(counterparty.role === 'seller'){
      line = FarmAnimalNPC.sellerOpeningLine(counterparty, Object.assign({}, context, { stakesTier, formatMoney: fmt }), arch);
    } else if(counterparty.role === 'client' || counterparty.role === 'supplier' || counterparty.role === 'lender'){
      line = FarmAnimalNPC.relationshipOpeningLine(counterparty, context);
    } else {
      line = FarmAnimalNPC.sellerOpeningLine(counterparty, Object.assign({}, context, { stakesTier, formatMoney: fmt }), arch);
    }
    if(callback) line = `${callback} ${line}`;
    return line;
  }
  const lines = {
    seller: stakesTier === 'small'
      ? [`I'm asking ${fmt(context.price || context.opp?.price || 0)} — it's a straightforward deal if the numbers work.`,
         `Price is ${fmt(context.price || context.opp?.price || 0)}. I'm not looking to drag this out.`]
      : stakesTier === 'major' || stakesTier === 'institutional'
      ? [`The asking price is ${fmt(context.price || context.opp?.price || 0)}. We'll need clean terms and a defensible structure before this moves.`,
         `We're discussing ${fmt(context.price || context.opp?.price || 0)} — this is a serious transaction, so expect a thorough process.`]
      : [`I'm asking ${fmt(context.price || context.opp?.price || 0)}. It's a solid business and I don't need to rush, but I'm listening.`,
         `Asking price is ${fmt(context.price || context.opp?.price || 0)}. I'd like this done cleanly — what did you have in mind?`],
    client: [`We need to talk about the terms. Honestly, we've had a better offer elsewhere.`,
      `I'll be direct — the current terms aren't working for us anymore.`],
    supplier: [`Costs are up on our end. We need to revisit pricing or volume commitments.`,
      `I'll level with you — we can't keep supplying at the current terms.`],
    lender: [`We've got some concerns about coverage on this loan. Let's talk about how we address that.`],
  };
  let line = pick(lines[counterparty.role] || lines.seller);
  if(callback) line = `${callback} ${line}`;
  if(counterparty.speciesId && typeof FarmAnimalNPC !== 'undefined'){
    const flavor = FarmAnimalNPC.speciesOpeningFlavor(counterparty);
    if(flavor && Math.random() < 0.55) line = `${flavor} ${line}`;
  }
  return line;
}
